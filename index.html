<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema SER - SER Energia Renovável</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3B6D11" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#6B21A8; --primary-dark:#4c1680; --primary-light:#9333ea;
  --bg:#F7F5FA; --sidebar:#1a0a2e; --sidebar-hover:#2d1550;
  --card:#ffffff; --border:#e2daea; --text:#1a0a2e; --text-light:#6b5f7a;
  --danger:#c0392b; --warning:#e67e22; --info:#2980b9; --success:#27ae60;
  --shadow:0 2px 8px rgba(107,33,168,.07); --shadow-lg:0 8px 24px rgba(107,33,168,.14);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* AUTH */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a2e,#6B21A8);z-index:9999}
.auth-box{background:#fff;padding:40px;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:380px}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo img{width:180px;height:auto;object-fit:contain;border-radius:0;margin-bottom:8px}
.auth-logo p{color:var(--text-light);font-size:13px;margin-top:4px}
.auth-box input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;outline:none;transition:border .2s}
.auth-box input:focus{border-color:var(--primary)}
.auth-box button{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:8px;font-weight:600;transition:background .2s}
.auth-box button:hover{background:var(--primary-dark)}
.auth-msg{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;text-align:center;display:none}
.auth-msg.error{background:#fde8e6;color:var(--danger);display:block}
.auth-msg.success{background:#e6f7ed;color:var(--success);display:block}

/* APP LAYOUT */
.app{display:none;height:100vh;overflow:hidden}
.app.active{display:flex}
.sidebar{width:240px;background:var(--sidebar);color:#cfd4c5;display:flex;flex-direction:column;transition:width .2s;flex-shrink:0}
.sidebar.collapsed{width:64px}
.sidebar-header{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-header .logo{flex:1;display:flex;align-items:center;justify-content:flex-start;overflow:hidden}
.sidebar-header .logo img{width:148px;height:auto;object-fit:contain;border-radius:0;flex-shrink:0;transition:width .2s;display:block}
.sidebar.collapsed .sidebar-header .logo img{width:46px}
.sidebar-header h2{display:none}
.sidebar-toggle{flex-shrink:0;color:#cfd4c5;font-size:18px;padding:4px}
.sidebar.collapsed .sidebar-toggle{margin:0 auto}
.nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7261;padding:14px 12px 6px}
.sidebar.collapsed .nav-section{visibility:hidden;height:0;padding:6px 0;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#cfd4c5;cursor:pointer;font-size:13.5px;margin-bottom:2px;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.sidebar.collapsed .nav-item .label{display:none}
.sidebar-user{padding:14px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#8a9180}
.sidebar.collapsed .user-info,.sidebar.collapsed .logout-btn{display:none}
.logout-btn{color:#cfd4c5;font-size:16px;padding:6px}
.logout-btn:hover{color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar h1{font-size:18px;font-weight:600}
.topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:#f5f4f0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.9)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 8px}

.content{flex:1;overflow:auto;padding:24px}

/* CARDS / METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.metric{background:var(--card);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.metric-label{font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-value{font-size:24px;font-weight:700;color:var(--text)}
.metric-sub{font-size:11px;color:var(--text-light);margin-top:4px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-header h3{font-size:15px;font-weight:600}

/* TABLE */
.table-wrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
th{background:#fafaf6;font-weight:600;color:var(--text-light);text-transform:uppercase;font-size:11px;letter-spacing:.5px;position:sticky;top:0}
tbody tr:hover{background:#fafaf6}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;background:#eee;color:#555}
.badge-em_contato,.badge-pendente,.badge-aguardando,.badge-em_aberto,.badge-aguardando_docs{background:#fff3cd;color:#856404}
.badge-proposta,.badge-enviada,.badge-projeto,.badge-comprado,.badge-em_andamento{background:#cfe2ff;color:#084298}
.badge-aceita,.badge-assinado,.badge-aprovada,.badge-concluida,.badge-pago,.badge-ativo,.badge-recebido,.badge-paga,.badge-reativado,.badge-entregue{background:#d1e7dd;color:#0f5132}
.badge-perdido,.badge-recusada,.badge-reprovada,.badge-cancelado,.badge-cancelada,.badge-descartado,.badge-inativo{background:#f8d7da;color:#842029}
.badge-agendada,.badge-enviado,.badge-realizada,.badge-trt_art_pg,.badge-parecer_acesso,.badge-vistoria_final,.badge-manutencao{background:#e2d6f3;color:#5e35b1}
.badge-aprovada_com_obra,.badge-aprovada_com_sombreamento,.badge-aprovada_com_obra_e_sombreamento{background:#fef0c3;color:#996a00}

/* FORMS */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:500;color:var(--text-light);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none;transition:border .15s;font-size:13.5px;width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group input[readonly]{background:#f5f4f0;color:var(--text-light)}
.form-group textarea{resize:vertical;min-height:60px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:6px 0}
.toggle input{width:40px;height:22px;appearance:none;background:#ccc;border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle input:checked{background:var(--primary)}
.toggle input::before{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle input:checked::before{left:20px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.lg{max-width:1100px}
.modal.sm{max-width:520px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{font-size:22px;color:var(--text-light);padding:4px 10px;border-radius:6px}
.modal-close:hover{background:#f5f4f0;color:var(--text)}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#fafaf6;border-radius:0 0 14px 14px}

.section{border:1px solid var(--border);border-radius:9px;margin-bottom:14px;overflow:hidden}
.section-header{padding:11px 14px;background:#fafaf6;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.section-header h4{font-size:13px;font-weight:600;color:var(--text)}
.section-toggle{font-size:14px;color:var(--text-light);transition:transform .2s}
.section.collapsed .section-toggle{transform:rotate(-90deg)}
.section-body{padding:14px}
.section.collapsed .section-body{display:none}

/* KANBAN */
.kanban{display:flex;gap:14px;height:calc(100vh - 110px);overflow-x:auto;padding-bottom:8px}
.kanban-col{flex:0 0 280px;background:#ecead9;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.kanban-col-header{padding:12px 14px;background:#dcdbc4;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--primary)}
.kanban-col-header .count{background:var(--primary);color:#fff;padding:2px 9px;border-radius:11px;font-size:11px}
.kanban-col-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.kanban-col-body.drag-over{background:#fff5d9}
.kanban-card{background:#fff;border-radius:8px;padding:11px 12px;box-shadow:var(--shadow);cursor:grab;border-left:3px solid var(--primary);transition:transform .1s, box-shadow .15s}
.kanban-card:hover{box-shadow:var(--shadow-lg)}
.kanban-card.dragging{opacity:.4}
.kanban-card .name{font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.kanban-card .meta{font-size:11.5px;color:var(--text-light);margin-bottom:3px}
.kanban-card .footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* PIPE LOG */
.log-list{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#fafaf6}
.log-item{padding:10px 13px;border-bottom:1px solid var(--border);font-size:12.5px}
.log-item:last-child{border-bottom:none}
.log-item .top{display:flex;justify-content:space-between;margin-bottom:3px;font-weight:500}
.log-item .obs{color:var(--text-light)}
.log-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.log-tools button{padding:6px 11px;background:#fff;border:1px solid var(--border);border-radius:7px;font-size:12px}
.log-tools button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.log-input-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}

/* TOAST */
.toast-stack{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:9px;background:#fff;border-left:4px solid var(--primary);box-shadow:var(--shadow-lg);font-size:13px;min-width:240px;animation:slideIn .25s ease}
.toast.error{border-color:var(--danger)}
.toast.success{border-color:var(--success)}
.toast.info{border-color:var(--info)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* FILE UPLOAD */
.file-upload{display:flex;flex-direction:column;gap:6px;padding:9px;border:1px dashed var(--border);border-radius:7px;background:#fafaf6}
.file-upload label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px}
.file-upload input[type=file]{font-size:12px}
.file-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.file-thumb{width:60px;height:60px;border-radius:6px;border:1px solid var(--border);position:relative;overflow:hidden;background:#fff}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}
.file-thumb.doc{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-light);padding:4px;text-align:center;word-break:break-all}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:980px){.charts-grid{grid-template-columns:1fr}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{position:fixed;height:100%;z-index:500;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 12px}
  .content{padding:14px}
  .modal{max-height:96vh;border-radius:10px}
  .form-grid{grid-template-columns:1fr}
}

.empty{padding:40px;text-align:center;color:var(--text-light)}
.loading{padding:40px;text-align:center;color:var(--text-light)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(59,109,17,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

/* FUNNEL */
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.funnel-row{display:flex;align-items:center;gap:10px}
.funnel-bar{flex:1;background:#ecead9;border-radius:6px;height:30px;position:relative;overflow:hidden}
.funnel-fill{background:linear-gradient(90deg,var(--primary),var(--primary-light));height:100%;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:12px;font-weight:600;min-width:30px}
.funnel-label{width:110px;font-size:12.5px;color:var(--text-light)}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* COMMISSION PREVIEW */
.preview-box{background:#fafaf6;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px}
.preview-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.preview-row:last-child{border-bottom:none;font-weight:700;color:var(--primary);font-size:15px;padding-top:10px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="logo.png" alt="SER Energia Renovável" />
      <p>Sistema de Gestão · SER Energia Renovável</p>
    </div>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="E-mail" required autocomplete="email" />
      <input type="password" id="loginPassword" placeholder="Senha" required autocomplete="current-password" />
      <button type="submit" id="loginBtn">Entrar</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><img src="logo.png" alt="SER" /></div>
      <h2>SER Energia Renovável</h2>
      <button class="sidebar-toggle" id="sidebarToggle" title="Recolher">☰</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-role" id="userRole">—</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Sair">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn-icon" id="mobileMenuBtn" style="display:none">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="actions" id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- MODAL ROOT -->
<div class="modal-overlay" id="modalRoot"></div>

<!-- TOAST -->
<div class="toast-stack" id="toastStack"></div>

<script>
/* ============================================================
   SISTEMA SER - CRM SOLAR COMPLETO
   ============================================================ */

const SURL = 'https://aickvgjrieeirybtqemh.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpY2t2Z2pyaWVlaXJ5YnRxZW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDQ1NjUsImV4cCI6MjA5MzIyMDU2NX0.FS1K-oI3iAYgmqjH9LH3DKFVdEOiIPfUD1KnbU78uuE';
const supa = supabase.createClient(SURL, SKEY, { auth:{ persistSession:true, autoRefreshToken:true } });

const State = {
  user:null, profile:null, route:'dashboard',
  leads:[], propostas:[], vistorias:[], contratos:[], logistica:[], instalacoes:[], homologacoes:[], posvenda:[],
  remarketing:[], comissoes:[], receitas:[], despesas:[], cadastros:[], perfis:[],
  charts:{}
};

const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtBRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtNum = (v,d=2) => (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate = d => d ? new Date(d+ (String(d).length===10?'T00:00:00':'')).toLocaleDateString('pt-BR') : '';
const fmtDateTime = d => d ? new Date(d).toLocaleString('pt-BR') : '';
const today = ()=> new Date().toISOString().slice(0,10);
const uid = ()=> 'id_'+Math.random().toString(36).slice(2,11);

function toast(msg,type='info',ms=3200){
  const stack = $('#toastStack');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s,transform .25s'; t.style.opacity='0'; t.style.transform='translateX(40px)'; setTimeout(()=>t.remove(),250); }, ms);
}

function badge(value){
  if(value==null||value==='') return '';
  const v = String(value).toLowerCase().replace(/\s+/g,'_');
  return `<span class="badge badge-${v}">${esc(String(value).replace(/_/g,' '))}</span>`;
}

async function confirmDel(msg='Confirma exclusão?'){ return confirm(msg); }

function isAdmin(){ return State.profile?.perfil === 'admin'; }
function isVend(){ return State.profile?.perfil === 'vendedor'; }
function userRole(){ return State.profile?.perfil; }

function filterByVendor(arr, key='vendedor'){
  if(!isVend()) return arr;
  const name = (State.profile?.nome||'').toLowerCase();
  return arr.filter(r => (r[key]||'').toLowerCase() === name);
}

/* ============================================================
   AUTH
   ============================================================ */
async function checkSession(){
  const { data:{ session } } = await supa.auth.getSession();
  if(session){
    State.user = session.user;
    await loadProfile();
    showApp();
  } else {
    showLogin();
  }
}

async function loadProfile(){
  if(!State.user) return;
  const { data } = await supa.from('perfis').select('*').eq('email', State.user.email).maybeSingle();
  if(!data){
    const newP = { id: State.user.id, email: State.user.email, nome: State.user.email.split('@')[0], perfil:'vendedor', ativo:true };
    const { data:created } = await supa.from('perfis').insert(newP).select().maybeSingle();
    State.profile = created || newP;
  } else {
    State.profile = data;
  }
}

async function doLogin(email,password){
  const { data, error } = await supa.auth.signInWithPassword({ email, password });
  if(error) throw error;
  State.user = data.user;
  await loadProfile();
  if(State.profile && State.profile.ativo === false){
    await supa.auth.signOut();
    throw new Error('Usuário inativo. Contate o administrador.');
  }
  return true;
}

async function doLogout(){
  await supa.auth.signOut();
  State.user = null; State.profile = null;
  location.reload();
}

const ROUTES = [
  { id:'dashboard', label:'Dashboard', icon:'📊' },
  { id:'pipeline', label:'Pipeline', icon:'🏠' },
  { id:'remarketing', label:'Remarketing', icon:'🔁' },
  { id:'comissoes', label:'Comissões', icon:'💰', section:'GESTÃO' },
  { id:'financeiro', label:'Financeiro', icon:'📈', section:'GESTÃO' },
  { id:'cadastros', label:'Cadastros', icon:'👥', section:'GESTÃO' },
  { id:'usuarios', label:'Usuários', icon:'🔐', section:'GESTÃO', adminOnly:true }
];

function visibleRoutes(){
  const role = userRole();
  return ROUTES.filter(r=>{
    if(r.adminOnly && !['admin','supervisor'].includes(role)) return false;
    if(role==='financeiro') return ['dashboard','comissoes','financeiro'].includes(r.id);
    if(['tec_vistoria','tec_instalacao','tec_homologacao'].includes(role)) return ['dashboard','pipeline'].includes(r.id);
    return true;
  });
}

function renderNav(){
  const nav = $('#nav');
  const items = visibleRoutes();
  let html=''; let lastSec='__';
  items.forEach(r=>{
    if(r.section && r.section!==lastSec){
      html += `<div class="nav-section">${r.section}</div>`;
      lastSec = r.section;
    }
    html += `<div class="nav-item" data-route="${r.id}"><span class="icon">${r.icon}</span><span class="label">${r.label}</span></div>`;
  });
  nav.innerHTML = html;
  $$('.nav-item', nav).forEach(el => el.addEventListener('click', ()=> navigate(el.dataset.route)));
}

function navigate(route){
  State.route = route;
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route === route));
  const r = ROUTES.find(x=>x.id===route);
  $('#pageTitle').textContent = r?.label || route;
  $('#pageActions').innerHTML = '';
  $('#content').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  switch(route){
    case 'dashboard': renderDashboard(); break;
    case 'pipeline': renderPipeline(); break;
    case 'remarketing': renderRemarketing(); break;
    case 'comissoes': renderComissoes(); break;
    case 'financeiro': renderFinanceiro(); break;
    case 'cadastros': renderCadastros(); break;
    case 'usuarios': renderUsuarios(); break;
  }
}

async function loadAll(){
  const tables = ['leads','propostas','vistorias','contratos','logistica','instalacoes','homologacoes','posvenda','remarketing','comissoes','financeiro_receitas','financeiro_despesas','cadastros','perfis'];
  const stateMap = { financeiro_receitas:'receitas', financeiro_despesas:'despesas' };
  await Promise.all(tables.map(async t => {
    try{
      const { data, error } = await supa.from(t).select('*').order('criado_em',{ascending:false});
      if(error){ console.warn(t,error.message); return; }
      State[stateMap[t] || t] = data || [];
    }catch(e){ console.warn(t,e); }
  }));
}

async function loadTable(table){
  const stateMap = { financeiro_receitas:'receitas', financeiro_despesas:'despesas' };
  const { data, error } = await supa.from(table).select('*').order('criado_em',{ascending:false});
  if(error){ toast(error.message,'error'); return []; }
  State[stateMap[table] || table] = data || [];
  return State[stateMap[table] || table];
}

async function renderPipeline(){
  await loadAll();

  else if(role === 'tec_instalacao') stages = STAGES.filter(s=>s.id==='instalacao');

function renderStageCol(stage){
  let items = filterByVendor(State[stage.dataKey]||[]);

  // Oculta itens que já avançaram para a próxima etapa (evita card duplicado)
  if(stage.id === 'lead'){
    const promovidos = new Set((State.propostas||[]).map(p=>p.lead_id).filter(Boolean));
    items = items.filter(l => !promovidos.has(l.id));
  }
  if(stage.id === 'proposta'){
    const promovidos = new Set((State.vistorias||[]).map(v=>v.proposta_id).filter(Boolean));
    items = items.filter(p => !promovidos.has(p.id));
  }
  if(stage.id === 'vistoria'){
    const promovidos = new Set((State.contratos||[]).map(c=>c.vistoria_id).filter(Boolean));
    items = items.filter(v => !promovidos.has(v.id));
  }
  if(stage.id === 'contrato'){
    const promovidos = new Set((State.logistica||[]).map(l=>l.contrato_id).filter(Boolean));
    items = items.filter(c => !promovidos.has(c.id));
  }
  if(stage.id === 'logistica'){
    const promovidos = new Set((State.instalacoes||[]).map(i=>i.logistica_id).filter(Boolean));
    items = items.filter(l => !promovidos.has(l.id));
  }
  if(stage.id === 'instalacao'){
    const promovidos = new Set((State.homologacoes||[]).map(h=>h.instalacao_id).filter(Boolean));
    items = items.filter(i => !promovidos.has(i.id));
  }
  if(stage.id === 'homologacao'){
    const promovidos = new Set((State.posvenda||[]).map(p=>p.homologacao_id).filter(Boolean));
    items = items.filter(h => !promovidos.has(h.id));
  }

  return `
    <div class="kanban-col" data-stage="${stage.id}">

      </div>

}

function renderCard(item,stage){
  const stat = stageStatus(item,stage);
  const kwh = item.kwh ? `${fmtNum(item.kwh,0)} kWh` : '';
  const kwp = item.kwp ? `${fmtNum(item.kwp,2)} kWp` : '';
  return `
    <div class="kanban-card" draggable="true" data-id="${item.id}" data-stage="${stage.id}">
      <div class="name">${stage.icon} ${esc(item.nome||'—')}</div>
      <div class="meta">${kwp || kwh || ''}</div>
      <div class="meta">${esc(item.vendedor||'')}</div>
      <div class="footer">${badge(stat)}</div>
    </div>`;
}

function stageStatus(item,stage){
  switch(stage.id){
    case 'lead': return item.status;
    case 'proposta': return item.status;
    case 'vistoria': return item.resultado || item.status;
    case 'contrato': return item.status;
    case 'logistica': return item.status;
    case 'instalacao': return item.status;
    case 'homologacao': return item.etapa;
    case 'posvenda': return item.status;
  }
  return '';
}

function attachKanbanDnD(){
  let dragging = null;
  $$('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragging = { id:card.dataset.id, stage:card.dataset.stage, el:card };
      card.classList.add('dragging');
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',card.dataset.id); }catch(_){}
    });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); $$('.kanban-col-body').forEach(c=>c.classList.remove('drag-over')); });
    card.addEventListener('click', ()=> openStageModal(card.dataset.stage, card.dataset.id));
  });
  $$('.kanban-col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', async e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      if(!dragging) return;
      const fromStage = dragging.stage;
      const toStage = col.dataset.drop;
      const drag = dragging;
      dragging = null;
      if(fromStage === toStage) return;
      const fromIdx = STAGES.findIndex(s=>s.id===fromStage);
      const toIdx = STAGES.findIndex(s=>s.id===toStage);
      if(toIdx !== fromIdx+1){
        toast('Só é permitido avançar uma etapa por vez.','error');
        return;
      }
      await transitionCard(drag.id, fromStage, toStage);
    });
  });
}

async function transitionCard(id, fromStage, toStage){
  const fromCfg = STAGES.find(s=>s.id===fromStage);
  const toCfg = STAGES.find(s=>s.id===toStage);
  const item = (State[fromCfg.dataKey]||[]).find(x=>String(x.id)===String(id));
  if(!item){ toast('Item não encontrado.','error'); return; }

  const guard = checkGuard(item, fromStage, toStage);
  if(!guard.ok){ toast(guard.msg, 'error'); return; }

  // Check duplicate
  const linkField = fromStage+'_id';
  const existing = (State[toCfg.dataKey]||[]).find(x => String(x[linkField]) === String(item.id));
  if(existing){ toast('Já existe registro nesta etapa para este item.','info'); return; }

  const payload = buildTransitionPayload(item, fromStage, toStage);
  payload.criado_por = State.user?.id;

  const { error } = await supa.from(toCfg.table).insert(payload);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  toast(`Movido para ${toCfg.label}`,'success');
  await loadAll();
  renderPipeline();
}

function checkGuard(item, fromStage, toStage){
  if(fromStage==='lead' && toStage==='proposta'){
    if(item.status !== 'proposta') return {ok:false, msg:'Lead precisa estar com status "Proposta".'};
  }
  if(fromStage==='proposta' && toStage==='vistoria'){
    if(item.status !== 'aceita') return {ok:false, msg:'Proposta precisa estar "Aceita".'};
  }
  if(fromStage==='vistoria' && toStage==='contrato'){
    if(!(item.resultado||'').includes('aprovada')) return {ok:false, msg:'Vistoria precisa estar aprovada.'};
  }
  if(fromStage==='contrato' && toStage==='logistica'){
    if(item.status !== 'assinado' || !item.data_assinatura) return {ok:false, msg:'Contrato precisa estar assinado com data preenchida.'};
  }
  if(fromStage==='logistica' && toStage==='instalacao'){
    if(item.status !== 'comprado') return {ok:false, msg:'Logística precisa estar "Comprado".'};
  }
  if(fromStage==='instalacao' && toStage==='homologacao'){
    if(item.status !== 'agendada' || !item.tecnico) return {ok:false, msg:'Instalação precisa estar "Agendada" e com técnico.'};
  }
  if(fromStage==='homologacao' && toStage==='posvenda'){
    if(item.etapa !== 'aprovada') return {ok:false, msg:'Homologação precisa estar "Aprovada".'};
  }
  return {ok:true};
}

function buildTransitionPayload(item, fromStage, toStage){
  const lead_id = item.lead_id || (fromStage==='lead'?item.id:null);
  const base = { nome:item.nome, telefone:item.telefone, vendedor:item.vendedor, lead_id };
  if(toStage==='proposta') return { ...base, kwh:item.kwh, status:'em_aberto' };
  if(toStage==='vistoria') return {
    ...base, proposta_id:item.id, email:item.email, cep:item.cep, rua:item.rua, numero:item.numero, complemento:item.complemento,
    bairro:item.bairro, cidade:item.cidade, estado:item.estado, qtd_modulos:item.qtd_modulos, marca_modulo:item.marca_modulo,
    pot_modulo:item.pot_modulo, qtd_inversores:item.qtd_inversores, marca_inversor:item.marca_inversor, pot_inversor:item.pot_inversor,
    qtd_baterias:item.qtd_baterias, marca_bateria:item.marca_bateria, pot_bateria:item.pot_bateria, kwp:item.kwp,
    status:'agendada'
  };
  if(toStage==='contrato') return {
    ...base, vistoria_id:item.id, proposta_id:item.proposta_id, email:item.email, cep:item.cep, rua:item.rua, numero:item.numero,
    complemento:item.complemento, bairro:item.bairro, cidade:item.cidade, estado:item.estado, gmap:item.gmap,
    qtd_modulos:item.qtd_modulos, marca_modulo:item.marca_modulo, pot_modulo:item.pot_modulo,
    qtd_inversores:item.qtd_inversores, marca_inversor:item.marca_inversor, pot_inversor:item.pot_inversor,
    qtd_baterias:item.qtd_baterias, marca_bateria:item.marca_bateria, pot_bateria:item.pot_bateria, kwp:item.kwp,
    status:'pendente'
  };
  if(toStage==='logistica') return {
    ...base, contrato_id:item.id, kwp:item.kwp, valor:item.valor, status:'aguardando'
  };
  if(toStage==='instalacao') return {
    ...base, logistica_id:item.id, contrato_id:item.contrato_id, kwp:item.kwp, valor:item.valor, distribuidora:item.distribuidora, status:'agendada'
  };
  if(toStage==='homologacao') return {
    ...base, instalacao_id:item.id, contrato_id:item.contrato_id, kwp:item.kwp, etapa:'aguardando_docs'
  };
  if(toStage==='posvenda') return {
    ...base, homologacao_id:item.id, contrato_id:item.contrato_id, kwp:item.kwp, status:'ativo'
  };
  return base;
}

function openStageModal(stage,id){
  const cfg = STAGES.find(s=>s.id===stage);
  const item = (State[cfg.dataKey]||[]).find(x=>String(x.id)===String(id));
  if(!item) return;
  switch(stage){
    case 'lead': openLeadModal(item); break;
    case 'proposta': openPropostaModal(item); break;
    case 'vistoria': openVistoriaModal(item); break;
    case 'contrato': openContratoModal(item); break;
    case 'logistica': openLogisticaModal(item); break;
    case 'instalacao': openInstalacaoModal(item); break;
    case 'homologacao': openHomologacaoModal(item); break;
    case 'posvenda': openPosVendaModal(item); break;
  }
}

/* ============================================================
   CPF / CNPJ / CEP UTILITIES
   ============================================================ */
function validarCPF(v){
  const c=v.replace(/\D/g,'');
  if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++) s+=+c[i]*(10-i);
  let r=s%11; const d1=r<2?0:11-r;
  if(+c[9]!==d1) return false;
  s=0; for(let i=0;i<10;i++) s+=+c[i]*(11-i);
  r=s%11; const d2=r<2?0:11-r;
  return +c[10]===d2;
}
function validarCNPJ(v){
  const c=v.replace(/\D/g,'');
  if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;
  const calc=(c,n)=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};
  return +c[12]===calc(c,12)&&+c[13]===calc(c,13);
}
function attachCPF(formEl){
  const el = formEl?.elements?.cpf || formEl?.querySelector?.('[name="cpf"]');
  if(!el) return;
  el.placeholder='000.000.000-00';
  el.addEventListener('input', ()=>{
    const v=el.value.replace(/\D/g,'');
    if(!v){el.style.borderColor='';el.title='';return;}
    if(v.length<11){el.style.borderColor='';return;}
    const ok=validarCPF(v);
    el.style.borderColor=ok?'#22c55e':'#ef4444';
    el.title=ok?'CPF válido ✓':'CPF inválido ✗';
  });
}
async function lookupCEP(cep, formEl){
  const digits=cep.replace(/\D/g,'');
  if(digits.length!==8) return;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${digits}/json/`);
    const d=await r.json();
    if(d.erro) return;
    const set=(name,val)=>{
      const el=formEl?.elements?.[name]||formEl?.querySelector?.(`[name="${name}"]`);
      if(el && !el.value && val) el.value=val;
    };
    set('rua', d.logradouro);
    set('bairro', d.bairro);
    set('cidade', d.localidade);
    const estado=formEl?.elements?.estado||formEl?.querySelector?.('[name="estado"]');
    if(estado && d.uf) estado.value=d.uf;
  }catch(e){}
}
function attachCEP(formEl){
  const el=formEl?.elements?.cep||formEl?.querySelector?.('[name="cep"]');
  if(!el) return;
  el.placeholder='00000-000';
  el.addEventListener('blur', ()=> lookupCEP(el.value, formEl));
}

function formField({label,name,type='text',value='',options=null,required=false,readonly=false,rows=null,full=false,placeholder=''}){
  const v = value==null?'':value;
  let inp;
  if(type==='select'){
    inp = `<select name="${name}" ${required?'required':''}>${options.map(o=>{
      const [val,text] = Array.isArray(o)?o:[o,o];
      return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(text)}</option>`;
    }).join('')}</select>`;
  } else if(type==='textarea'){
    inp = `<textarea name="${name}" rows="${rows||3}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`;
  } else if(type==='toggle'){
    inp = `<label class="toggle"><input type="checkbox" name="${name}" ${v?'checked':''}/><span>${esc(label)}</span></label>`;
    return `<div class="form-group ${full?'full':''}">${inp}</div>`;
  } else {
    inp = `<input type="${type}" name="${name}" value="${esc(v)}" placeholder="${esc(placeholder)}" ${required?'required':''} ${readonly?'readonly':''}/>`;
  }
  return `<div class="form-group ${full?'full':''}"><label>${esc(label)}${required?' *':''}</label>${inp}</div>`;
}

function readForm(formEl){
  const data = {};
  $$('input,select,textarea',formEl).forEach(el=>{
    if(!el.name) return;
    if(el.type==='checkbox') data[el.name] = el.checked;
    else data[el.name] = el.value === '' ? null : el.value;
  });
  return data;
}

async function attachContactLog(parentId, kind){
  const table = kind==='lead' ? 'tentativas_contato' : 'tentativas_remarketing';
  const fk = kind==='lead' ? 'lead_id' : 'remark_id';
  const listEl = $(`#logList_${kind}_${parentId}`);
  const inputEl = $(`#logInput_${kind}_${parentId}`);
  const toolsEl = $(`#logTools_${kind}_${parentId}`);

  async function refresh(){
    const { data } = await supa.from(table).select('*').eq(fk,parentId).order('criado_em',{ascending:false});
    if(!data || !data.length){ listEl.innerHTML = '<div style="padding:14px;color:var(--text-light);font-size:12px">Nenhuma tentativa registrada.</div>'; return; }
    listEl.innerHTML = data.map(t=>`
      <div class="log-item">
        <div class="top"><span>${esc(t.tipo)} → ${esc(t.resultado||'')}</span><span style="color:var(--text-light)">${fmtDateTime(t.criado_em)}</span></div>
        ${t.obs?`<div class="obs">${esc(t.obs)}</div>`:''}
      </div>
    `).join('');
  }
  refresh();

  $$('button',toolsEl).forEach(b=> b.addEventListener('click', ()=>{
    const tipo = b.dataset.tipo;
    const resOpts = [['sem_resposta','Sem resposta'],['contato_feito','Contato feito'],['agendou_retorno','Agendou retorno'],['interessado','Interessado'],['nao_interessado','Não interessado']];
    inputEl.innerHTML = `
      <div class="log-input-row">
        <select id="logRes_${parentId}">${resOpts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>
        <input type="text" placeholder="Observação (opcional)" id="logObs_${parentId}"/>
        <button type="button" class="btn btn-primary btn-sm" id="logSave_${parentId}">Registrar ${tipo}</button>
      </div>`;
    $(`#logSave_${parentId}`).addEventListener('click', async ()=>{
      const payload = {
        [fk]: parentId, tipo,
        resultado: $(`#logRes_${parentId}`).value,
        obs: $(`#logObs_${parentId}`).value || null,
        criado_por: State.user?.id
      };
      const { error } = await supa.from(table).insert(payload);
      if(error) return toast(error.message,'error');
      toast('Tentativa registrada','success');
      inputEl.innerHTML='';
      refresh();
    });
  }));
}

/* ============================================================
   FILE UPLOAD HELPER
   ============================================================ */
async function uploadFile(bucket, file, prefix=''){
  const ext = (file.name.split('.').pop()||'bin').toLowerCase();
  const path = `${prefix?prefix+'/':''}${Date.now()}_${uid()}.${ext}`;
  const { error } = await supa.storage.from(bucket).upload(path, file, { upsert:false, contentType:file.type || 'application/octet-stream' });
  if(error) throw error;
  const { data:urlData } = supa.storage.from(bucket).getPublicUrl(path);
  return { url:urlData.publicUrl, path, name:file.name };
}

function fileUploadBlock(label, name, bucket, currentList=[], multiple=true){
  const list = Array.isArray(currentList)?currentList:[];
  return `
    <div class="file-upload" data-fu="${name}">
      <label>${esc(label)}</label>
      <input type="file" data-bucket="${bucket}" data-name="${name}" ${multiple?'multiple':''} accept="image/*,application/pdf" />
      <div class="file-thumbs" data-thumbs="${name}">
        ${list.map((f,i)=>thumbHtml(f,name,i)).join('')}
      </div>
    </div>`;
}
function thumbHtml(f,name,i){
  const isImg = (f.url||'').match(/\.(jpe?g|png|gif|webp|bmp)$/i);
  return `<div class="file-thumb ${isImg?'':'doc'}" data-name="${name}" data-i="${i}">
    ${isImg ? `<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="${esc(f.name||'')}"/></a>` : `<a href="${esc(f.url)}" target="_blank">${esc(f.name||'arquivo')}</a>`}
    <button type="button" class="rm" data-rm="${name}" data-i="${i}">×</button>
  </div>`;
}

function attachFileUploads(rootEl, fileStore){
  function bindRemove(){
    $$('[data-rm]',rootEl).forEach(b=>{
      if(b._bound) return; b._bound = true;
      b.addEventListener('click', ()=>{
        const name = b.dataset.rm, i = Number(b.dataset.i);
        if(!fileStore[name]) return;
        fileStore[name].splice(i,1);
        const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
        wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
        bindRemove();
      });
    });
  }
  $$('input[type=file]',rootEl).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const bucket = inp.dataset.bucket;
      const name = inp.dataset.name;
      fileStore[name] = fileStore[name] || [];
      for(const file of inp.files){
        try{
          toast('Enviando '+file.name+'…','info',1500);
          const f = await uploadFile(bucket, file, name);
          fileStore[name].push(f);
        }catch(e){ toast('Erro upload: '+e.message,'error'); }
      }
      const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
      wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
      bindRemove();
      inp.value = '';
    });
  });
  bindRemove();
}

        } else {
          toast('Vistoria salva','success');
        }
      } else {
        toast('Vistoria salva','success');
      }
    }
    closeModal();
    if(State.route==='pipeline') renderPipeline();
  });

function extractJsonGroup(obj,prefix){
  const out = {};
  Object.entries(obj).forEach(([k,v])=>{
    if(k.startsWith(prefix)){
      out[k.slice(prefix.length)] = v;
    }
  });
  return out;
}
function pickFiles(store, keys){
  const out = {};
  keys.forEach(k=>{ if(store[k]?.length) out[k] = store[k]; });
  return out;
}

function abrirContratoJanela(c, imprimir=false){
  const fR = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const txt = v => v||'_______________';
  const dt  = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');

  function extenso(n){
    n=Math.round(Number(n||0));
    if(!n) return 'zero reais';
    const un=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
    const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
    const ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    function g(x){if(!x)return'';if(x===100)return'cem';let r='';if(x>=100){r+=ct[Math.floor(x/100)];x%=100;if(x)r+=' e ';}if(x>=20){r+=dz[Math.floor(x/10)];x%=10;if(x)r+=' e '+un[x];}else if(x)r+=un[x];return r;}
    let r='',mi=Math.floor(n/1000000),mil=Math.floor((n%1000000)/1000),hum=n%1000;
    if(mi){r+=g(mi)+(mi===1?' milhão':' milhões');}
    if(mil){if(r)r+=' e ';r+=mil===1?'mil':g(mil)+' mil';}
    if(hum){if(r)r+=' e ';r+=g(hum);}
    return r+(n===1?' real':' reais');
  }
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html>

          ${formField({label:'Observações',name:'obs',type:'textarea',value:item.obs,full:true})}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="delLogBtn">Excluir</button>
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  `);
  const form = $('#logForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    Object.keys(data).filter(k=>k.startsWith('_')).forEach(k=>delete data[k]);
    const { error } = await supa.from('logistica').update(data).eq('id',item.id);
    if(error) return toast(error.message,'error');
    toast('Salvo','success'); closeModal(); renderPipeline();
  });
  $('#delLogBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir?')) return;
    await supa.from('logistica').delete().eq('id',item.id);

  });
}

function openComissaoModal(item=null){
  const isNew = !item;
  item = item || {};
  const statusOpts = [['pendente','Pendente'],['aprovada','Aprovada'],['paga','Paga'],['cancelada','Cancelada']];

  openModal(`
    <div class="modal-header"><h2>${isNew?'Nova Comissão':'Editar Comissão'}</h2><button class="modal-close">×</button></div>
    <form id="comForm">
      <div class="modal-body">
        <div class="form-grid">
          ${formField({label:'Cliente',name:'nome',value:item.nome,required:true})}
          ${formField({label:'Valor Contrato',name:'valor_contrato',type:'number',value:item.valor_contrato,required:true})}
          ${formField({label:'Valor Vendido',name:'valor_vendido',type:'number',value:item.valor_vendido})}
          ${formField({label:'Status',name:'status',type:'select',value:item.status||'pendente',options:statusOpts})}
        </div>
        <div class="section"><div class="section-header"><h4>Vendedor</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'Nome',name:'vend_nome',value:item.vend_nome})}
            ${formField({label:'%',name:'vend_pct',type:'number',value:item.vend_pct})}
            ${formField({label:'% Major',name:'vend_major_pct',type:'number',value:item.vend_major_pct})}
          </div></div>
        </div>
        <div class="section"><div class="section-header"><h4>Supervisor</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'Nome',name:'sup_nome',value:item.sup_nome})}
            ${formField({label:'%',name:'sup_pct',type:'number',value:item.sup_pct})}
          </div></div>
        </div>
        <div class="section collapsed"><div class="section-header"><h4>SDR / Captador / Indicador</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'SDR ativo',name:'sdr_ativo',type:'toggle',value:item.sdr_ativo})}
            ${formField({label:'SDR nome',name:'sdr_nome',value:item.sdr_nome})}
            ${formField({label:'SDR %',name:'sdr_pct',type:'number',value:item.sdr_pct})}
            ${formField({label:'Captador ativo',name:'cap_ativo',type:'toggle',value:item.cap_ativo})}
            ${formField({label:'Captador nome',name:'cap_nome',value:item.cap_nome})}
            ${formField({label:'Captador %',name:'cap_pct',type:'number',value:item.cap_pct})}
            ${formField({label:'Indicador ativo',name:'ind_ativo',type:'toggle',value:item.ind_ativo})}
            ${formField({label:'Indicador nome',name:'ind_nome',value:item.ind_nome})}
            ${formField({label:'Indicador %',name:'ind_pct',type:'number',value:item.ind_pct})}
          </div></div>
        </div>
        <div class="section collapsed"><div class="section-header"><h4>Obra / Presente</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'Obra ativo',name:'obra_ativo',type:'toggle',value:item.obra_ativo})}
            ${formField({label:'Obra valor',name:'obra_val',type:'number',value:item.obra_val})}
            ${formField({label:'Presente ativo',name:'pres_ativo',type:'toggle',value:item.pres_ativo})}
            ${formField({label:'Presente valor',name:'pres_val',type:'number',value:item.pres_val})}
          </div></div>
        </div>
        <div id="comPreview" class="preview-box"></div>
      </div>
      <div class="modal-footer">
        ${!isNew?`<button type="button" class="btn btn-danger" id="delComBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
      </div>
    </form>
  `,'lg');

  const form = $('#comForm');
  function recalc(){
    const raw = readForm(form);
    const vc = Number(raw.valor_contrato)||0;
    const vp = Number(raw.vend_pct)||0;
    const vmp = Number(raw.vend_major_pct)||0;
    const vend_val = vc * (vp/100) + vc*(vmp/100);
    const sup_val = vc * ((Number(raw.sup_pct)||0)/100);
    const sdr_val = raw.sdr_ativo ? vc*((Number(raw.sdr_pct)||0)/100) : 0;
    const cap_val = raw.cap_ativo ? vc*((Number(raw.cap_pct)||0)/100) : 0;
    const ind_val = raw.ind_ativo ? vc*((Number(raw.ind_pct)||0)/100) : 0;
    const obra_val = raw.obra_ativo ? (Number(raw.obra_val)||0) : 0;
    const pres_val = raw.pres_ativo ? (Number(raw.pres_val)||0) : 0;
    const total = vend_val + sup_val + sdr_val + cap_val + ind_val + obra_val + pres_val;
    const lucro = vc - total;
    $('#comPreview').innerHTML = `
      <div class="preview-row"><span>Vendedor</span><span>${fmtBRL(vend_val)}</span></div>
      <div class="preview-row"><span>Supervisor</span><span>${fmtBRL(sup_val)}</span></div>
      <div class="preview-row"><span>SDR</span><span>${fmtBRL(sdr_val)}</span></div>
      <div class="preview-row"><span>Captador</span><span>${fmtBRL(cap_val)}</span></div>
      <div class="preview-row"><span>Indicador</span><span>${fmtBRL(ind_val)}</span></div>
      <div class="preview-row"><span>Obra</span><span>${fmtBRL(obra_val)}</span></div>
      <div class="preview-row"><span>Presente</span><span>${fmtBRL(pres_val)}</span></div>
      <div class="preview-row"><span>Total saídas</span><span>${fmtBRL(total)}</span></div>
      <div class="preview-row"><span>Lucro Líquido</span><span>${fmtBRL(lucro)}</span></div>
    `;
    return { vend_val, sup_val, sdr_val, cap_val, ind_val, total_saidas:total, lucro_liquido:lucro };
  }
  form.addEventListener('input', recalc);
  recalc();

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    const calc = recalc();
    Object.assign(data, calc);
    ['valor_contrato','valor_vendido','vend_pct','vend_major_pct','sup_pct','sdr_pct','cap_pct','ind_pct','obra_val','pres_val'].forEach(k=>{ data[k] = data[k]?Number(data[k]):null; });
    if(isNew){
      data.criado_por = State.user?.id;
      const { error } = await supa.from('comissoes').insert(data);
      if(error) return toast(error.message,'error');
    } else {
      const { error } = await supa.from('comissoes').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
    }
    toast('Salvo','success'); closeModal(); renderComissoes();
  });
  $('#delComBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir comissão?')) return;
    await supa.from('comissoes').delete().eq('id',item.id);
    toast('Excluído','success'); closeModal(); renderComissoes();
  });
}

async function renderFinanceiro(){
  await Promise.all([ loadTable('financeiro_receitas'), loadTable('financeiro_despesas'), loadTable('comissoes'), loadTable('contratos') ]);
  const receitas = State.receitas;
  const despesas = State.despesas;
  const totalR = receitas.filter(r=>r.status!=='cancelado').reduce((s,r)=>s+(Number(r.valor)||0),0);
  const totalD = despesas.filter(d=>d.status!=='cancelado').reduce((s,d)=>s+(Number(d.valor)||0),0);
  const lucro = totalR - totalD;
  const comissoesPag = State.comissoes.filter(c=>c.status==='aprovada').reduce((s,c)=>s+(Number(c.total_saidas)||0),0);

  const months = {};
  receitas.forEach(r=>{
    if(!r.data_recebimento) return;
    const k = r.data_recebimento.slice(0,7);
    months[k] = months[k] || { rec:0, desp:0 };
    months[k].rec += Number(r.valor)||0;
  });
  despesas.forEach(d=>{
    if(!d.data_pagamento) return;
    const k = d.data_pagamento.slice(0,7);
    months[k] = months[k] || { rec:0, desp:0 };
    months[k].desp += Number(d.valor)||0;
  });
  const mKeys = Object.keys(months).sort();

  const rank = {};
  State.contratos.filter(c=>c.status==='assinado').forEach(c=>{
    const v = c.vendedor||'—';
    rank[v] = (rank[v]||0) + (Number(c.valor)||0);
  });
  const rankSorted = Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,10);

  $('#pageActions').innerHTML = `
    <button class="btn btn-secondary" id="newReceitaBtn">+ Receita</button>
    <button class="btn btn-primary" id="newDespesaBtn">+ Despesa</button>
  `;
  $('#newReceitaBtn').addEventListener('click', ()=> openReceitaModal());
  $('#newDespesaBtn').addEventListener('click', ()=> openDespesaModal());

  $('#content').innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="metric-label">Receita Total</div><div class="metric-value">${fmtBRL(totalR)}</div></div>
      <div class="metric" style="border-color:var(--danger)"><div class="metric-label">Despesa Total</div><div class="metric-value">${fmtBRL(totalD)}</div></div>
      <div class="metric" style="border-color:var(--info)"><div class="metric-label">Lucro</div><div class="metric-value">${fmtBRL(lucro)}</div></div>
      <div class="metric" style="border-color:var(--warning)"><div class="metric-label">Comissões a Pagar</div><div class="metric-value">${fmtBRL(comissoesPag)}</div></div>
    </div>
    <div class="charts-grid">
      <div class="card"><div class="card-header"><h3>Movimentação Mensal</h3></div><canvas id="chartFin" height="220"></canvas></div>
      <div class="card"><div class="card-header"><h3>Ranking Vendedores</h3></div>
        <table>
          <thead><tr><th>#</th><th>Vendedor</th><th>Valor</th></tr></thead>
          <tbody>${rankSorted.map(([v,val],i)=>`<tr><td>${i+1}</td><td>${esc(v)}</td><td>${fmtBRL(val)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem dados</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="tabs"><div class="tab active" data-tab="r">Receitas</div><div class="tab" data-tab="d">Despesas</div></div>
    <div id="finTab">
      <div class="card" id="tabR">
        <div class="table-wrap"><table>
          <thead><tr><th>Descrição</th><th>Valor</th><th>Data</th><th>Categoria</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${receitas.map(r=>`
              <tr>
                <td>${esc(r.descricao||'')}</td><td>${fmtBRL(r.valor)}</td><td>${fmtDate(r.data_recebimento)}</td>
                <td>${esc(r.categoria||'')}</td><td>${badge(r.status)}</td>
                <td class="row-actions"><button class="btn btn-sm btn-secondary" data-rec="${r.id}">Editar</button></td>
              </tr>`).join('')||'<tr><td colspan="6" class="empty">Sem receitas</td></tr>'}
          </tbody>
        </table></div>
      </div>
      <div class="card" id="tabD" style="display:none">
        <div class="table-wrap"><table>
          <thead><tr><th>Descrição</th><th>Valor</th><th>Data</th><th>Categoria</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${despesas.map(d=>`
              <tr>
                <td>${esc(d.descricao||'')}</td><td>${fmtBRL(d.valor)}</td><td>${fmtDate(d.data_pagamento)}</td>
                <td>${esc(d.categoria||'')}</td><td>${badge(d.status)}</td>
                <td class="row-actions"><button class="btn btn-sm btn-secondary" data-desp="${d.id}">Editar</button></td>
              </tr>`).join('')||'<tr><td colspan="6" class="empty">Sem despesas</td></tr>'}
          </tbody>
        </table></div>
      </div>
    </div>
  `;

  $$('.tab').forEach(t => t.addEventListener('click', ()=>{
    $$('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('#tabR').style.display = t.dataset.tab==='r' ? '' : 'none';
    $('#tabD').style.display = t.dataset.tab==='d' ? '' : 'none';
  }));

  $$('[data-rec]').forEach(b=>b.addEventListener('click', ()=> openReceitaModal(receitas.find(r=>String(r.id)===b.dataset.rec))));
  $$('[data-desp]').forEach(b=>b.addEventListener('click', ()=> openDespesaModal(despesas.find(d=>String(d.id)===b.dataset.desp))));

  if(State.charts.fin){ try{State.charts.fin.destroy();}catch(_){} }
  const ctx = $('#chartFin')?.getContext('2d');
  if(ctx){
    State.charts.fin = new Chart(ctx,{
      type:'bar',
      data:{
        labels: mKeys,
        datasets:[
          { label:'Receita', data: mKeys.map(k=>months[k].rec), backgroundColor:'#3B6D11' },

        ]
      },
      options:{ responsive:true, plugins:{ legend:{ position:'bottom' } } }
    });
  }
}

  const catOpts = [['equipamentos','Equipamentos'],['mao_de_obra','Mão de obra'],['homologacao','Homologação'],['comissao','Comissão'],['outro','Outro']];
  const statusOpts = [['pendente','Pendente'],['pago','Pago'],['cancelado','Cancelado']];
  openModal(`
    <div class="modal-header"><h2>${isNew?'Nova Despesa':'Editar Despesa'}</h2><button class="modal-close">×</button></div>
    <form id="despForm"><div class="modal-body"><div class="form-grid">
      ${formField({label:'Descrição',name:'descricao',value:item.descricao,required:true,full:true})}
      ${formField({label:'Valor',name:'valor',type:'number',value:item.valor,required:true})}
      ${formField({label:'Data',name:'data_pagamento',type:'date',value:item.data_pagamento})}
      ${formField({label:'Categoria',name:'categoria',type:'select',value:item.categoria||'outro',options:catOpts})}
      ${formField({label:'Status',name:'status',type:'select',value:item.status||'pendente',options:statusOpts})}
      ${formField({label:'Obs',name:'obs',type:'textarea',value:item.obs,full:true})}
    </div></div>
    <div class="modal-footer">
      ${!isNew?`<button type="button" class="btn btn-danger" id="delDesp">Excluir</button>`:''}
      <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div></form>
  `,'sm');
  const form = $('#despForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    data.valor = Number(data.valor)||0;
    if(isNew){ data.criado_por = State.user?.id; await supa.from('financeiro_despesas').insert(data); }
    else await supa.from('financeiro_despesas').update(data).eq('id',item.id);
    toast('Salvo','success'); closeModal(); renderFinanceiro();
  });
  $('#delDesp')?.addEventListener('click', async ()=>{ if(!await confirmDel('Excluir?')) return; await supa.from('financeiro_despesas').delete().eq('id',item.id); closeModal(); renderFinanceiro(); });
}

/* ============================================================
   CADASTROS
   ============================================================ */
async function renderCadastros(){
  await loadTable('cadastros');
  const items = State.cadastros;
  $('#pageActions').innerHTML = `
    <input type="text" id="searchCad" placeholder="Buscar…" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px"/>
    <button class="btn btn-primary" id="newCadBtn">+ Novo Cadastro</button>
  `;
  $('#newCadBtn').addEventListener('click', ()=> openCadastroModal());
  $('#content').innerHTML = `
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Tipo</th><th>Telefone</th><th>Email</th><th>Cidade</th><th></th></tr></thead>
      <tbody id="cadBody">
        ${items.length?items.map(c=>`
          <tr>
            <td>${esc(c.nome||'')}</td>
            <td><span class="badge">${esc(c.tipo||'')}</span></td>
            <td>${esc(c.telefone||'')}</td>
            <td>${esc(c.email||'')}</td>
            <td>${esc(c.cidade||'')}</td>
            <td class="row-actions"><button class="btn btn-sm btn-secondary" data-cad="${c.id}">Editar</button></td>
          </tr>`).join(''):'<tr><td colspan="6" class="empty">Sem cadastros</td></tr>'}
      </tbody>
    </table></div></div>
  `;
  $$('[data-cad]').forEach(b=>b.addEventListener('click', ()=> openCadastroModal(items.find(x=>String(x.id)===b.dataset.cad))));
  $('#searchCad').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    $$('#cadBody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q)?'':'none');
  });
}

function openCadastroModal(item=null){
  const isNew = !item;
  item = item || {};
  const tipoOpts = [['vendedor','Vendedor'],['tecnico','Técnico'],['captador','Captador'],['sdr','SDR'],['supervisor','Supervisor'],['distribuidor','Distribuidor'],['cliente','Cliente'],['outro','Outro']];
  openModal(`
    <div class="modal-header"><h2>${isNew?'Novo Cadastro':'Editar Cadastro'}</h2><button class="modal-close">×</button></div>
    <form id="cadForm"><div class="modal-body"><div class="form-grid">
      ${formField({label:'Nome',name:'nome',value:item.nome,required:true})}
      ${formField({label:'Tipo',name:'tipo',type:'select',value:item.tipo||'cliente',options:tipoOpts})}
      ${formField({label:'Telefone',name:'telefone',value:item.telefone})}
      ${formField({label:'Email',name:'email',type:'email',value:item.email})}
      ${formField({label:'Documento',name:'doc',value:item.doc})}
      ${formField({label:'Nascimento',name:'nascimento',type:'date',value:item.nascimento})}
      ${formField({label:'CEP',name:'cep',value:item.cep})}
      ${formField({label:'Rua',name:'rua',value:item.rua})}
      ${formField({label:'Número',name:'numero',value:item.numero})}
      ${formField({label:'Complemento',name:'complemento',value:item.complemento})}
      ${formField({label:'Cidade',name:'cidade',value:item.cidade})}
      ${formField({label:'Estado',name:'estado',value:item.estado})}
      ${formField({label:'Obs',name:'obs',type:'textarea',value:item.obs,full:true})}
    </div></div>
    <div class="modal-footer">
      ${!isNew?`<button type="button" class="btn btn-danger" id="delCad">Excluir</button>`:''}
      <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div></form>
  `);
  const form = $('#cadForm');
  attachCEP(form);
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    if(isNew){ data.criado_por = State.user?.id; await supa.from('cadastros').insert(data); }
    else await supa.from('cadastros').update(data).eq('id',item.id);
    toast('Salvo','success'); closeModal(); renderCadastros();
  });
  $('#delCad')?.addEventListener('click', async ()=>{ if(!await confirmDel('Excluir?')) return; await supa.from('cadastros').delete().eq('id',item.id); closeModal(); renderCadastros(); });
}

/* ============================================================
   USUARIOS (admin/supervisor)
   ============================================================ */
async function renderUsuarios(){
  if(!['admin','supervisor'].includes(userRole())){
    $('#content').innerHTML = '<div class="empty">Sem permissão.</div>'; return;
  }
  await loadTable('perfis');
  const items = State.perfis;
  $('#pageActions').innerHTML = isAdmin() ? `<button class="btn btn-primary" id="newUserBtn">+ Novo Usuário</button>` : '';
  $('#newUserBtn')?.addEventListener('click', ()=> openUserModal());
  $('#content').innerHTML = `
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${items.length?items.map(u=>`
          <tr>
            <td>${esc(u.nome||'')}</td>
            <td>${esc(u.email||'')}</td>
            <td><span class="badge">${esc(u.perfil||'')}</span></td>
            <td>${u.ativo?'<span class="badge badge-ativo">Ativo</span>':'<span class="badge badge-inativo">Inativo</span>'}</td>
            <td class="row-actions">
              <button class="btn btn-sm btn-secondary" data-user="${u.id}">Editar</button>
              ${isAdmin()?`<button class="btn btn-sm btn-secondary" data-toggle="${u.id}">${u.ativo?'Desativar':'Ativar'}</button>`:''}
            </td>
          </tr>`).join(''):'<tr><td colspan="5" class="empty">Sem usuários</td></tr>'}
      </tbody>
    </table></div></div>
  `;
  $$('[data-user]').forEach(b=>b.addEventListener('click', ()=> openUserModal(items.find(x=>String(x.id)===b.dataset.user))));
  $$('[data-toggle]').forEach(b=>b.addEventListener('click', async ()=>{
    const u = items.find(x=>String(x.id)===b.dataset.toggle);
    await supa.from('perfis').update({ ativo:!u.ativo }).eq('id',u.id);
    toast('Status atualizado','success'); renderUsuarios();
  }));
}

function openUserModal(item=null){
  if(!isAdmin() && item==null){ toast('Apenas admin pode criar usuários.','error'); return; }
  const isNew = !item;
  item = item || {};
  const perfilOpts = [['admin','Admin'],['supervisor','Supervisor'],['vendedor','Vendedor'],['tec_vistoria','Téc. Vistoria'],['tec_instalacao','Téc. Instalação'],['tec_homologacao','Téc. Homologação'],['financeiro','Financeiro']];
  openModal(`
    <div class="modal-header"><h2>${isNew?'Novo Usuário':'Editar Usuário'}</h2><button class="modal-close">×</button></div>
    <form id="userForm"><div class="modal-body"><div class="form-grid">
      ${formField({label:'Nome',name:'nome',value:item.nome,required:true})}
      ${formField({label:'Email',name:'email',type:'email',value:item.email,required:true,readonly:!isNew})}
      ${isNew?formField({label:'Senha',name:'password',type:'password',value:'',required:true}):''}
      ${formField({label:'Perfil',name:'perfil',type:'select',value:item.perfil||'vendedor',options:perfilOpts})}
      ${formField({label:'Ativo',name:'ativo',type:'toggle',value:item.ativo!==false})}
    </div></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
      <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
    </div></form>
  `,'sm');
  const form = $('#userForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    if(isNew){
      try{
        const { data:auth, error } = await supa.auth.signUp({ email:data.email, password:data.password });
        if(error) throw error;
        const profile = { id:auth.user?.id, nome:data.nome, email:data.email, perfil:data.perfil, ativo:data.ativo };
        const { error:e2 } = await supa.from('perfis').insert(profile);
        if(e2) throw e2;
        toast('Usuário criado','success');
      }catch(err){ return toast(err.message,'error'); }
    } else {
      const { error } = await supa.from('perfis').update({ nome:data.nome, perfil:data.perfil, ativo:data.ativo }).eq('id',item.id);
      if(error) return toast(error.message,'error');
      toast('Atualizado','success');
    }
    closeModal(); renderUsuarios();
  });
}

$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = $('#loginBtn'); const msg = $('#authMsg');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Entrando…';
  msg.className = 'auth-msg';
  try{
    await doLogin($('#loginEmail').value, $('#loginPassword').value);
    msg.className = 'auth-msg success'; msg.textContent = 'Bem-vindo!';
    setTimeout(showApp, 300);
  }catch(err){
    msg.className = 'auth-msg error'; msg.textContent = err.message || 'Falha no login';
  }finally{
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});

$('#logoutBtn').addEventListener('click', doLogout);

$('#sidebarToggle').addEventListener('click', ()=>{
  $('#sidebar').classList.toggle('collapsed');
});
$('#mobileMenuBtn').addEventListener('click', ()=>{

});

function updateMobileBtn(){

}
window.addEventListener('resize', updateMobileBtn);
