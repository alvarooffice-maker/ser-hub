name: Deploy (GitHub Pages)

# Publica o build do Astro (dist/) no GitHub Pages.
# Antes do primeiro deploy: Settings → Pages → Source = "GitHub Actions".
# SEGURANÇA DE LANÇAMENTO: por enquanto só roda MANUALMENTE (Actions → "Deploy (GitHub Pages)" → Run workflow),
# para que juntar o ramo na main não troque o sistema em produção sem querer.
# Depois que o Astro estiver aprovado e estável, descomente o bloco "push" para publicar a cada alteração na main.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
