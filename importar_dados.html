*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#2D0F5A,#4B1D8E,#7B3FC5);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:36px;max-width:480px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.4)}
h1{font-size:18px;font-weight:700;color:#2D0F5A;margin-bottom:6px;text-align:center}
p{font-size:13px;color:#555;margin-bottom:20px;text-align:center}
label{display:block;font-size:10px;font-weight:700;color:#4B1D8E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
input{width:100%;padding:9px 12px;border:1.5px solid #d0c8e0;border-radius:9px;font-size:13px;margin-bottom:12px}
button{width:100%;padding:11px;background:linear-gradient(135deg,#4B1D8E,#7B3FC5);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.spinner{width:40px;height:40px;border:4px solid #e8e0f5;border-top-color:#4B1D8E;border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.log{font-size:11px;color:#555;font-family:monospace;background:#f8f5ff;border-radius:8px;padding:10px;max-height:140px;overflow-y:auto;margin-top:12px}
.ok{color:#2ecc71;font-weight:700}.err{color:#e74c3c;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.stat-box{background:#f0ecf8;border-radius:10px;padding:12px;text-align:center}
.stat-n{font-size:26px;font-weight:700;color:#4B1D8E}
.stat-l{font-size:11px;color:#555;margin-top:2px}
</style>
</head>

function log(msg){
  const el=document.getElementById('log');
  if(el){el.innerHTML+=msg+'<br>';el.scrollTop=el.scrollHeight;}
  console.log(msg);
}

async function doImport(){
  const email=document.getElementById('imp-email').value.trim();
  const pass=document.getElementById('imp-pass').value;
  if(!email||!pass)return alert('Preencha e-mail e senha.');
  document.getElementById('login-form').style.display='none';
  document.getElementById('progress').style.display='block';

  sb=window.supabase.createClient(SURL,SKEY);
  const {data:authData,error:authErr}=await sb.auth.signInWithPassword({email,password:pass});
  if(authErr){
    document.getElementById('prog-msg').innerHTML='<span class="err">❌ '+authErr.message+'</span>';
    return;
  }
  const uid=authData.user.id;
  log('✅ Autenticado como '+email);

  // Helper: check existing by nome
  async function insertBatch(tbl,rows,keyField){
    const {data:existing}=await sb.from(tbl).select(keyField);
    const existKeys=new Set((existing||[]).map(r=>r[keyField]?.trim().toLowerCase()));
    const toInsert=rows.filter(r=>!existKeys.has((r[keyField]||'').trim().toLowerCase()));
    let ok=0;
    for(let i=0;i<toInsert.length;i+=50){
      const batch=toInsert.slice(i,i+50).map(r=>{const x={...r};delete x.id;x.criado_por=uid;return x;});
      const {error}=await sb.from(tbl).insert(batch);
      if(error)log('⚠️ '+tbl+': '+error.message);
      else ok+=batch.length;
    }
    log(`📦 ${tbl}: ${toInsert.length} novos de ${rows.length} (${rows.length-toInsert.length} já existiam)`);
    return {inserted:ok,skipped:rows.length-toInsert.length};
  }

  document.getElementById('prog-msg').textContent='Importando contratos...';
  const rC=await insertBatch('contratos',novosContratos,'nome');

  document.getElementById('prog-msg').textContent='Importando propostas...';
  const rP=await insertBatch('propostas',novasPropostas,'nome');

  document.getElementById('prog-msg').textContent='Importando homologações...';
  const rH=await insertBatch('homologacoes',novasHomos,'nome');

  document.getElementById('progress').style.display='none';
  document.getElementById('done').style.display='block';
  document.getElementById('stats').innerHTML=`
    <div class="stat-box"><div class="stat-n">${rC.inserted}</div><div class="stat-l">Contratos</div></div>
    <div class="stat-box"><div class="stat-n">${rP.inserted}</div><div class="stat-l">Propostas</div></div>
    <div class="stat-box"><div class="stat-n">${rH.inserted}</div><div class="stat-l">Homologações</div></div>
  `;
  document.getElementById('done-msg').innerHTML='<span class="ok">✅ Importação concluída! Os dados estão salvos no banco de dados.</span>';
}
</script>
