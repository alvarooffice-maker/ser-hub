<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema SER - SER Energia Renovável</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3B6D11" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <img src="logo.png" alt="SER Energia Renovável" />
      <p>Sistema de Gestão · SER Energia Renovável</p>
    </div>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="E-mail" required autocomplete="email" />
      <input type="password" id="loginPassword" placeholder="Senha" required autocomplete="current-password" />
      <button type="submit" id="loginBtn">Entrar</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><img src="logo.png" alt="SER" /></div>
      <h2>SER Energia Renovável</h2>
      <button class="sidebar-toggle" id="sidebarToggle" title="Recolher">☰</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div id="offlineBadge" style="display:none;margin:0 12px 8px;padding:8px 12px;background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;font-size:11.5px;color:#92400e;font-weight:600;text-align:center;cursor:pointer" title="Clique para tentar sincronizar agora"></div>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-role" id="userRole">—</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Sair">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn-icon" id="mobileMenuBtn" style="display:none">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <button id="globalSearchBtn" title="Busca global (Ctrl+K)">🔍 Buscar <kbd>Ctrl K</kbd></button>
      <div class="actions" id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- MODAL ROOT -->
<div class="modal-overlay" id="modalRoot"></div>

<!-- TOAST -->
<div class="toast-stack" id="toastStack"></div>

<!-- BUSCA GLOBAL -->
<div id="globalSearchOverlay">
  <div id="globalSearchBox">
    <input id="globalSearchInput" placeholder="🔍  Buscar cliente, contrato, telefone…" autocomplete="off" spellcheck="false" />
    <div id="globalSearchResults"></div>
    <div id="globalSearchKbd"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span><span><kbd>Ctrl K</kbd> abrir</span></div>
  </div>
</div>

<script src="js/app01.js"></script>
<script src="js/app02.js"></script>
<script src="js/app03.js"></script>
<script src="js/app04.js"></script>
<script src="js/app05.js"></script>
<script src="js/app06.js"></script>
<script src="js/app07.js"></script>
</body>
</html>
