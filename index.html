<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema SER - SER Energia Renovável</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3B6D11" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#6B21A8; --primary-dark:#4c1680; --primary-light:#9333ea;
  --bg:#F7F5FA; --sidebar:#1a0a2e; --sidebar-hover:#2d1550;
  --card:#ffffff; --border:#e2daea; --text:#1a0a2e; --text-light:#6b5f7a;
  --danger:#c0392b; --warning:#e67e22; --info:#2980b9; --success:#27ae60;
  --shadow:0 2px 8px rgba(107,33,168,.07); --shadow-lg:0 8px 24px rgba(107,33,168,.14);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* AUTH */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a2e,#6B21A8);z-index:9999}
.auth-box{background:#fff;padding:40px;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:380px}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo img{width:180px;height:auto;object-fit:contain;border-radius:0;margin-bottom:8px}
.auth-logo p{color:var(--text-light);font-size:13px;margin-top:4px}
.auth-box input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;outline:none;transition:border .2s}
.auth-box input:focus{border-color:var(--primary)}
.auth-box button{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:8px;font-weight:600;transition:background .2s}
.auth-box button:hover{background:var(--primary-dark)}
.auth-msg{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;text-align:center;display:none}
.auth-msg.error{background:#fde8e6;color:var(--danger);display:block}
.auth-msg.success{background:#e6f7ed;color:var(--success);display:block}

/* APP LAYOUT */
.app{display:none;height:100vh;overflow:hidden}
.app.active{display:flex}
.sidebar{width:240px;background:var(--sidebar);color:#cfd4c5;display:flex;flex-direction:column;transition:width .2s;flex-shrink:0}
.sidebar.collapsed{width:64px}
.sidebar-header{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-header .logo{flex:1;display:flex;align-items:center;justify-content:flex-start;overflow:hidden}
.sidebar-header .logo img{width:148px;height:auto;object-fit:contain;border-radius:0;flex-shrink:0;transition:width .2s;display:block}
.sidebar.collapsed .sidebar-header .logo img{width:46px}
.sidebar-header h2{display:none}
.sidebar-toggle{flex-shrink:0;color:#cfd4c5;font-size:18px;padding:4px}
.sidebar.collapsed .sidebar-toggle{margin:0 auto}
.nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7261;padding:14px 12px 6px}
.sidebar.collapsed .nav-section{visibility:hidden;height:0;padding:6px 0;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#cfd4c5;cursor:pointer;font-size:13.5px;margin-bottom:2px;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.sidebar.collapsed .nav-item .label{display:none}
.sidebar-user{padding:14px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#8a9180}
.sidebar.collapsed .user-info,.sidebar.collapsed .logout-btn{display:none}
.logout-btn{color:#cfd4c5;font-size:16px;padding:6px}
.logout-btn:hover{color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar h1{font-size:18px;font-weight:600}
.topbar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:#f5f4f0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.9)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 8px}

.content{flex:1;overflow:auto;padding:24px}

/* CARDS / METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.metric{background:var(--card);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.metric-label{font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-value{font-size:24px;font-weight:700;color:var(--text)}
.metric-sub{font-size:11px;color:var(--text-light);margin-top:4px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-header h3{font-size:15px;font-weight:600}

/* TABLE */
.table-wrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
th{background:#fafaf6;font-weight:600;color:var(--text-light);text-transform:uppercase;font-size:11px;letter-spacing:.5px;position:sticky;top:0}
tbody tr:hover{background:#fafaf6}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;background:#eee;color:#555}
.badge-em_contato,.badge-pendente,.badge-aguardando,.badge-em_aberto,.badge-aguardando_docs{background:#fff3cd;color:#856404}
.badge-proposta,.badge-enviada,.badge-projeto,.badge-comprado,.badge-em_andamento{background:#cfe2ff;color:#084298}
.badge-aceita,.badge-assinado,.badge-aprovada,.badge-concluida,.badge-pago,.badge-ativo,.badge-recebido,.badge-paga,.badge-reativado,.badge-entregue{background:#d1e7dd;color:#0f5132}
.badge-perdido,.badge-recusada,.badge-reprovada,.badge-cancelado,.badge-cancelada,.badge-descartado,.badge-inativo{background:#f8d7da;color:#842029}
.badge-agendada,.badge-enviado,.badge-realizada,.badge-trt_art_pg,.badge-parecer_acesso,.badge-vistoria_final,.badge-manutencao,.badge-aguardando_agendamento{background:#e2d6f3;color:#5e35b1}
.badge-aprovada_com_obra,.badge-aprovada_com_sombreamento,.badge-aprovada_com_obra_e_sombreamento{background:#fef0c3;color:#996a00}

/* FORMS */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:500;color:var(--text-light);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none;transition:border .15s;font-size:13.5px;width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group input[readonly]{background:#f5f4f0;color:var(--text-light)}
.form-group textarea{resize:vertical;min-height:60px}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:6px 0}
.toggle input{width:40px;height:22px;appearance:none;background:#ccc;border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle input:checked{background:var(--primary)}
.toggle input::before{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle input:checked::before{left:20px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:clip}
.modal.lg{max-width:1100px}
.modal.sm{max-width:520px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{font-size:22px;color:var(--text-light);padding:4px 10px;border-radius:6px}
.modal-close:hover{background:#f5f4f0;color:var(--text)}
.modal>form{display:flex;flex-direction:column;flex:1;min-height:0}
.modal-body{padding:20px 22px 20px 18px;overflow-y:scroll;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(107,33,168,.4) rgba(0,0,0,.05)}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-track{background:rgba(0,0,0,.05);border-radius:6px;margin:6px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(107,33,168,.45);border-radius:6px}
.modal-body::-webkit-scrollbar-thumb:hover{background:rgba(107,33,168,.75)}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#fafaf6;border-radius:0 0 14px 14px}

.section{border:1px solid var(--border);border-radius:9px;margin-bottom:14px;overflow:hidden}
.section-header{padding:11px 14px;background:#fafaf6;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.section-header h4{font-size:13px;font-weight:600;color:var(--text)}
.section-toggle{font-size:14px;color:var(--text-light);transition:transform .2s}
.section.collapsed .section-toggle{transform:rotate(-90deg)}
.section-body{padding:14px}
.section.collapsed .section-body{display:none}

/* KANBAN */
/* 100vh - 60px topbar - 48px padding do .content = espaço disponível para as colunas */
.kanban{display:flex;gap:14px;overflow-x:auto;align-items:stretch;padding-bottom:8px;height:calc(100vh - 108px)}
.kanban-col{flex:0 0 280px;background:#ecead9;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.kanban-col-header{padding:12px 14px;background:#dcdbc4;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--primary);flex-shrink:0}
.kanban-col-header .count{background:var(--primary);color:#fff;padding:2px 9px;border-radius:11px;font-size:11px}
.kanban-col-body{flex:1;min-height:0;overflow-y:auto;padding:10px 6px 10px 10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(107,33,168,.45) rgba(0,0,0,.06)}
.kanban-col-body::-webkit-scrollbar{width:7px;-webkit-appearance:none}
.kanban-col-body::-webkit-scrollbar-track{background:rgba(0,0,0,.08);border-radius:6px;margin:4px}
.kanban-col-body::-webkit-scrollbar-thumb{background:rgba(107,33,168,.5);border-radius:6px;min-height:40px}
.kanban-col-body::-webkit-scrollbar-thumb:hover{background:rgba(107,33,168,.8)}
.kanban-col-body.drag-over{background:#fff5d9}
.kanban-card{flex-shrink:0;background:#fff;border-radius:8px;box-shadow:var(--shadow);cursor:grab;border-left:3px solid var(--primary);transition:transform .1s, box-shadow .15s;overflow:hidden}
.kanban-card:hover{box-shadow:var(--shadow-lg)}
.kanban-card.dragging{opacity:.4}
.kanban-card-inner{padding:11px 12px;max-height:260px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(107,33,168,.4) transparent}
.kanban-card-inner::-webkit-scrollbar{width:5px}
.kanban-card-inner::-webkit-scrollbar-track{background:transparent}
.kanban-card-inner::-webkit-scrollbar-thumb{background:rgba(107,33,168,.45);border-radius:4px}
.kanban-card-inner::-webkit-scrollbar-thumb:hover{background:rgba(107,33,168,.75)}
.kanban-card .name{font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.kanban-card .meta{font-size:11.5px;color:var(--text-light);margin-bottom:3px}
.kanban-card .footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:4px;position:sticky;bottom:0;background:#fff;border-top:1px solid rgba(226,218,234,.35)}
/* KANBAN COLUMN SEARCH */
.col-search-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.6;transition:opacity .15s,background .15s;border-radius:5px;line-height:1}
.col-search-btn:hover{opacity:1;background:rgba(0,0,0,.1)}
.col-search-btn.active{opacity:1;background:rgba(59,109,17,.18)}
.col-search-bar{padding:6px 8px 4px;background:#d4d3be;border-bottom:1px solid rgba(0,0,0,.07)}
.col-search-input{width:100%;box-sizing:border-box;padding:5px 10px;border-radius:7px;border:1.5px solid var(--primary);font-size:12px;outline:none;background:#fff;color:var(--text)}
.col-search-input:focus{border-color:#2d6b10;box-shadow:0 0 0 2px rgba(59,109,17,.14)}
.card-flags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;margin-bottom:2px}
/* Meta clock */
.meta-clock-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.meta-clock-val{font-size:13px;font-weight:700;color:var(--primary);text-align:center}
.meta-clock-label{font-size:11px;color:var(--text-light);text-align:center}
.period-filter{display:flex;gap:4px;background:#f5f4f0;border-radius:8px;padding:4px}
.period-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-light);cursor:pointer;transition:all .15s}
.period-btn.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
.rank-tabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.rank-tab{padding:7px 14px;font-size:12.5px;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.rank-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
/* Linked docs bar (inside modal body) */
.linked-docs-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#f5f0fc;border-radius:8px;margin-top:14px;border:1px solid #e2d6f3}
.linked-docs-label{font-size:11px;font-weight:700;color:#5e35b1;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;margin-right:2px}
.btn-group{display:inline-flex;border-radius:7px;overflow:hidden}
.btn-group .btn{border-radius:0;border-right:1px solid rgba(0,0,0,.08)}
.btn-group .btn:first-child{border-radius:7px 0 0 7px}
.btn-group .btn:last-child{border-radius:0 7px 7px 0;border-right:none}
.btn-group .btn:only-child{border-radius:7px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:#fafaf6;border-radius:0 0 14px 14px}
.flag{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid transparent;white-space:nowrap;line-height:1.4}
.flag.ok{background:#d1e7dd;color:#0f5132;border-color:#b8dcc9}
.flag.warn{background:#fff3cd;color:#856404;border-color:#ffe8a1}
.flag.danger{background:#f8d7da;color:#842029;border-color:#f5c2c7}
.flag.countdown{background:#e2d6f3;color:#5e35b1;border-color:#d8ccf0}
.flag.countdown.urgent{background:#f8d7da;color:#842029;border-color:#f5c2c7}
.flag.countdown.done{background:#d1e7dd;color:#0f5132;border-color:#b8dcc9}

/* PIPE LOG */
.log-list{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:#fafaf6}
.log-item{padding:10px 13px;border-bottom:1px solid var(--border);font-size:12.5px}
.log-item:last-child{border-bottom:none}
.log-item .top{display:flex;justify-content:space-between;margin-bottom:3px;font-weight:500}
.log-item .obs{color:var(--text-light)}
.log-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.log-tools button{padding:6px 11px;background:#fff;border:1px solid var(--border);border-radius:7px;font-size:12px}
.log-tools button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.log-input-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}

/* TOAST */
.toast-stack{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:9px;background:#fff;border-left:4px solid var(--primary);box-shadow:var(--shadow-lg);font-size:13px;min-width:240px;animation:slideIn .25s ease}
.toast.error{border-color:var(--danger)}
.toast.success{border-color:var(--success)}
.toast.info{border-color:var(--info)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* FILE UPLOAD */
.file-upload{display:flex;flex-direction:column;gap:6px;padding:9px;border:1px dashed var(--border);border-radius:7px;background:#fafaf6}
.file-upload label{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px}
/* HISTÓRICO */
.hist-list{display:flex;flex-direction:column}
.hist-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.hist-item:last-child{border-bottom:none}
.hist-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0;margin-top:1px}
.hist-body{flex:1;min-width:0}
.hist-desc{color:#1a0a2e;line-height:1.4;word-break:break-word}
.hist-meta{font-size:11px;color:#888;margin-top:2px}
.hist-empty{text-align:center;padding:16px 8px;color:#aaa;font-size:12px}
/* FILE UPLOAD */
.file-upload input[type=file]{display:none}
.btn-add-file{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px 12px;border:1.5px dashed #6B21A8;border-radius:6px;background:none;color:#6B21A8;font-size:11px;font-weight:700;cursor:pointer;margin-top:2px;transition:background .15s}
.btn-add-file:hover{background:#f5f0fc}
.file-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.file-thumb{width:60px;height:60px;border-radius:6px;border:1px solid var(--border);position:relative;overflow:hidden;background:#fff}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}
.file-thumb.doc{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-light);padding:4px;text-align:center;word-break:break-all}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:980px){.charts-grid{grid-template-columns:1fr}}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{position:fixed;height:100%;z-index:500;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 12px}
  .content{padding:14px}
  .modal{max-height:96vh;border-radius:10px}
  .form-grid{grid-template-columns:1fr}
}

.empty{padding:40px;text-align:center;color:var(--text-light)}
.loading{padding:40px;text-align:center;color:var(--text-light)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(59,109,17,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}

/* FUNNEL */
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.funnel-row{display:flex;align-items:center;gap:10px}
.funnel-bar{flex:1;background:#ecead9;border-radius:6px;height:30px;position:relative;overflow:hidden}

.tab{padding:9px 14px;font-size:13px;color:var(--text-light);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* COMMISSION PREVIEW */
.preview-box{background:#fafaf6;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px}
.preview-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.preview-row:last-child{border-bottom:none;font-weight:700;color:var(--primary);font-size:15px;padding-top:10px}

async function loadProfile(){
  if(!State.user) return;
  const { data } = await supa.from('perfis').select('*').eq('email', State.user.email).maybeSingle();
  if(!data){
    const newP = { id: State.user.id, email: State.user.email, nome: State.user.email.split('@')[0], perfil:'vendedor', ativo:true };
    const { data:created } = await supa.from('perfis').insert(newP).select().maybeSingle();
    State.profile = created || newP;
  } else {
    State.profile = data;
  }
}

async function doLogin(email,password){
  const { data, error } = await supa.auth.signInWithPassword({ email, password });
  if(error) throw error;
  State.user = data.user;
  await loadProfile();
  if(State.profile && State.profile.ativo === false){
    await supa.auth.signOut();
    throw new Error('Usuário inativo. Contate o administrador.');
  }
  return true;
}

function getPeriodRange(period){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const end = toStr(now);
  switch(period){
    case 'dia': return [toStr(now), end];
    case 'mes': return [toStr(new Date(now.getFullYear(),now.getMonth(),1)), end];
    case 'trimestre': { const q=Math.floor(now.getMonth()/3); return [toStr(new Date(now.getFullYear(),q*3,1)),end]; }
    case 'semestre': { const h=Math.floor(now.getMonth()/6); return [toStr(new Date(now.getFullYear(),h*6,1)),end]; }
    case 'ano': return [toStr(new Date(now.getFullYear(),0,1)), end];
    default: return [null, null];
  }
}

              stroke-dasharray="${circum}" stroke-dashoffset="${dashOffset.toFixed(1)}"

      </div>
      <div id="rankBody"></div>
    </div>
  `;

  // Estado interno do dashboard
  let dashPeriod = 'mes';
  let dashRankTab = 'vendedores';
  let salesChartInst = null;

  function renderChart(){
    const periodLabels = {dia:'Últimos 7 dias',mes:'Últimos 6 meses',trimestre:'Últimos 6 meses',semestre:'Últimos 6 meses',ano:'Últimos 12 meses'};
    $('#chartPeriodLabel').textContent = `(${periodLabels[dashPeriod]||''})`;

    const now = new Date();
    const labels = [], values = [];
    const allContratos = State.contratos || [];

    if(dashPeriod === 'dia'){
      // Últimos 7 dias
      for(let i=6;i>=0;i--){
        const d = new Date(now); d.setDate(d.getDate()-i);
        const key = d.toISOString().slice(0,10);
        labels.push(d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
        values.push(allContratos.filter(c=>c.status==='assinado'&&c.data_assinatura===key).reduce((s,c)=>s+(Number(c.valor)||0),0));
      }
    } else {
      // Últimos N meses
      const n = dashPeriod==='ano' ? 12 : 6;
      for(let i=n-1;i>=0;i--){
        const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        labels.push(d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}));
        values.push(allContratos.filter(c=>c.status==='assinado'&&(c.data_assinatura||'').startsWith(key)).reduce((s,c)=>s+(Number(c.valor)||0),0));
      }
    }

    const ctx = $('#salesChart')?.getContext('2d');
    if(!ctx) return;
    if(salesChartInst) salesChartInst.destroy();
    salesChartInst = new Chart(ctx,{
      type:'bar',
      data:{
        labels,
        datasets:[{
          label:'Vendas (R$)',
          data: values,
          backgroundColor: values.map((v,i)=>i===values.length-1?'rgba(107,33,168,0.85)':'rgba(107,33,168,0.35)'),
          borderColor:'rgba(107,33,168,0.9)',
          borderWidth:1.5,
          borderRadius:6,
          borderSkipped:false
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:c=>' '+fmtBRL(c.raw)}}
        },
        scales:{
          x:{grid:{display:false}, ticks:{font:{size:11}}},
          y:{
            grid:{color:'rgba(0,0,0,.05)'},
            ticks:{font:{size:11}, callback:v=>v>=1000?'R$'+(v/1000).toFixed(0)+'k':'R$'+v}
          }
        }
      }
    });
  }

  function renderRankings(){
    const [startD, endD] = getPeriodRange(dashPeriod);
    const periodLabels = {dia:'Hoje',mes:'Mês atual',trimestre:'Trimestre',semestre:'Semestre',ano:'Ano atual'};
    $('#rankPeriodLabel').textContent = `(${periodLabels[dashPeriod]||dashPeriod})`;

    const contFiltrados = contratos.filter(c=>c.status==='assinado' && c.data_assinatura >= startD && c.data_assinatura <= endD);
    let rows = [];

    if(dashRankTab === 'vendedores'){
      const grp = {};
      contFiltrados.forEach(c=>{ const k=c.vendedor||'—'; grp[k]=(grp[k]||0)+(Number(c.valor)||0); });
      rows = Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<tr><td>${i+1}</td><td>${esc(k)}</td><td>${fmtBRL(v)}</td><td>${contFiltrados.filter(c=>(c.vendedor||'—')===k).length} contratos</td></tr>`);
      $('#rankBody').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Vendedor</th><th>Volume</th><th>Qtd</th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<div class="empty">Nenhum dado no período.</div>';
    }
    else if(dashRankTab === 'bancos'){
      const grp = {};
      contFiltrados.filter(c=>c.banco).forEach(c=>{ const k=c.banco||'—'; grp[k]=(grp[k]||0)+(Number(c.valor)||0); });
      rows = Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<tr><td>${i+1}</td><td>${esc(k)}</td><td>${fmtBRL(v)}</td></tr>`);
      $('#rankBody').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Banco</th><th>Volume</th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<div class="empty">Nenhum financiamento no período.</div>';
    }
    else if(dashRankTab === 'forma_pgto'){
      const grp = {};
      contFiltrados.forEach(c=>{ const k=c.forma_pgto||'—'; grp[k]=(grp[k]||0)+1; });
      rows = Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<tr><td>${i+1}</td><td>${esc(k)}</td><td>${v}</td><td>${Math.round(v/Math.max(1,contFiltrados.length)*100)}%</td></tr>`);
      $('#rankBody').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Forma Pagamento</th><th>Qtd</th><th>%</th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<div class="empty">Nenhum dado no período.</div>';
    }
    else if(dashRankTab === 'distribuidores'){
      const logFiltrados = filterByVendor(State.logistica).filter(l=>l.criado_em>=startD+'T00:00:00' && l.criado_em<=endD+'T23:59:59' && l.distribuidora);
      const grp = {};
      logFiltrados.forEach(l=>{ const k=l.distribuidora||'—'; grp[k]=(grp[k]||0)+1; });
      rows = Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<tr><td>${i+1}</td><td>${esc(k)}</td><td>${v}</td></tr>`);
      $('#rankBody').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Distribuidora</th><th>Qtd pedidos</th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<div class="empty">Nenhum dado no período.</div>';
    }
  }

  renderChart();
  renderRankings();

  // Filtro de período
  $$('.period-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      $$('.period-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      dashPeriod = btn.dataset.p;
      renderChart();
      renderRankings();
    });
  });

  // Tabs de ranking
  $$('.rank-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      $$('.rank-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      dashRankTab = tab.dataset.rank;
      renderRankings();
    });
  });

  // Editar meta
  $('#editMetaBtn')?.addEventListener('click',()=>{
    const metaAtual = metaValor||'';
    openModal(`
      <div class="modal-header"><h2>Meta do Mês — ${mesAtual}</h2><button class="modal-close">×</button></div>
      <form id="metaForm"><div class="modal-body">
        <div class="form-grid">
          ${formField({label:`Meta para ${mesAtual}`,name:'valor',type:'number',value:metaAtual,required:true,placeholder:'0'})}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar meta</button>
      </div></form>
    `,'sm');
    $('#metaForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const d = readForm($('#metaForm'));
      const val = parseBR(d.valor)||0;
      if(metaRec){
        await supa.from('metas').update({valor:val,atualizado_em:new Date().toISOString()}).eq('id',metaRec.id);
      } else {
        await supa.from('metas').insert({mes:mesAtual,valor:val});
      }
      toast('Meta salva!','success'); closeModal(); renderDashboard();
    });
  });
}

/* ============================================================
   PIPELINE - KANBAN
   ============================================================ */
const STAGES = [
  { id:'lead', label:'Lead', icon:'🎯', table:'leads', dataKey:'leads' },
  { id:'proposta', label:'Proposta', icon:'📄', table:'propostas', dataKey:'propostas' },
  { id:'vistoria', label:'Vistoria', icon:'🔍', table:'vistorias', dataKey:'vistorias' },
  { id:'contrato', label:'Contrato', icon:'✍️', table:'contratos', dataKey:'contratos' },
  { id:'logistica', label:'Logística', icon:'📦', table:'logistica', dataKey:'logistica' },
  { id:'instalacao', label:'Instalação', icon:'🔧', table:'instalacoes', dataKey:'instalacoes' },
  { id:'homologacao', label:'Homologação', icon:'📋', table:'homologacoes', dataKey:'homologacoes' },
  { id:'posvenda',     label:'Pós Venda',    icon:'⭐', table:'posvenda',     dataKey:'posvenda' },
  { id:'atendimentos', label:'Atendimentos', icon:'🛠️', table:'atendimentos', dataKey:'atendimentos' }
];

async function renderPipeline(){
  await loadAll();
  const role = userRole();
  let stages = STAGES;
  // tec_vistoria e tec_instalacao vêem todas as colunas (filtrado pelos seus cards em renderStageCol)
  if(role === 'tec_homologacao') stages = STAGES.filter(s=>s.id==='homologacao');

  const isTec = ['tec_vistoria','tec_instalacao','tec_homologacao','tec_vistoria_instalacao'].includes(role);
  $('#pageActions').innerHTML = isTec ? '' : `<button class="btn btn-primary" id="newLeadBtn">+ Novo Lead</button>`;
  $('#newLeadBtn')?.addEventListener('click', ()=> openLeadModal());

  $('#content').innerHTML = `<div class="kanban" id="kanban">${stages.map(s=>renderStageCol(s)).join('')}</div>`;
  attachKanbanDnD();
  attachKanbanSearch();
  $('#newAtendBtn')?.addEventListener('click', ()=> openAtendimentoModal());
}

function renderStageCol(stage){
  let items = filterByVendor(State[stage.dataKey]||[]);

  // ── tec_vistoria_instalacao: combina cadeia de vistoria + instalação ──────────
  if(userRole() === 'tec_vistoria_instalacao'){
    const tecNome = (State.profile?.nome||'').toLowerCase().trim();
    // Vistorias do técnico
    const minhasVist = (State.vistorias||[]).filter(v=>(v.tecnico||'').toLowerCase().trim()===tecNome);
    const vistIds = new Set(minhasVist.map(v=>v.id));
    // Instalações do técnico
    const minhasInst = (State.instalacoes||[]).filter(i=>(i.tecnico||'').toLowerCase().trim()===tecNome);
    const instIdsProprios = new Set(minhasInst.map(i=>i.id));
    // Cadeia para frente a partir das vistorias
    const contIdsV = new Set((State.contratos||[]).filter(c=>vistIds.has(c.vistoria_id)).map(c=>c.id));
    const logIdsV  = new Set((State.logistica||[]).filter(l=>contIdsV.has(l.contrato_id)).map(l=>l.id));
    const instIdsV = new Set((State.instalacoes||[]).filter(i=>logIdsV.has(i.logistica_id)).map(i=>i.id));
    // Cadeia para frente a partir das instalações
    const logIdsI  = new Set(minhasInst.map(i=>i.logistica_id).filter(Boolean));
    const contIdsI = new Set((State.logistica||[]).filter(l=>logIdsI.has(l.id)).map(l=>l.contrato_id).filter(Boolean));
    const vistIdsI = new Set((State.contratos||[]).filter(c=>contIdsI.has(c.id)).map(c=>c.vistoria_id).filter(Boolean));
    // Merge das instalações visíveis
    const instIds  = new Set([...instIdsProprios,...instIdsV]);
    const homIds   = new Set((State.homologacoes||[]).filter(h=>instIds.has(h.instalacao_id)).map(h=>h.id));
    // Cadeia para trás — unindo ambas as origens
    const propIdsV = new Set(minhasVist.map(v=>v.proposta_id).filter(Boolean));
    const propIdsI = new Set((State.vistorias||[]).filter(v=>new Set([...vistIds,...vistIdsI]).has(v.id)).map(v=>v.proposta_id).filter(Boolean));
    const propIds  = new Set([...propIdsV,...propIdsI]);
    const allVistIds = new Set([...vistIds,...vistIdsI]);
    const allContIds = new Set([...contIdsV,...contIdsI]);
    const allLogIds  = new Set([...logIdsV,...logIdsI]);
    const leadIds  = new Set((State.propostas||[]).filter(p=>propIds.has(p.id)).map(p=>p.lead_id).filter(Boolean));
    const filtroIds = {
      lead: leadIds, proposta: propIds, vistoria: allVistIds,
      contrato: allContIds, logistica: allLogIds, instalacao: instIds,
      homologacao: homIds
      // posvenda excluído
    };
    items = items.filter(i=>(filtroIds[stage.id]||new Set()).has(i.id));
  }

  // ── tec_instalacao: filtra por cadeia encadeada a partir das SUAS instalações ──
  if(userRole() === 'tec_instalacao'){
    const tecNome = (State.profile?.nome||'').toLowerCase().trim();
    const minhasInst = (State.instalacoes||[]).filter(i=>
      (i.tecnico||'').toLowerCase().trim() === tecNome
    );
    const instIds = new Set(minhasInst.map(i=>i.id));
    // Cadeia para frente (sem pós venda)
    const homIds  = new Set((State.homologacoes||[]).filter(h=>instIds.has(h.instalacao_id)).map(h=>h.id));
    // Cadeia para trás
    const logIds  = new Set(minhasInst.map(i=>i.logistica_id).filter(Boolean));
    const contIds = new Set((State.logistica||[]).filter(l=>logIds.has(l.id)).map(l=>l.contrato_id).filter(Boolean));
    const vistIds = new Set((State.contratos||[]).filter(c=>contIds.has(c.id)).map(c=>c.vistoria_id).filter(Boolean));
    const propIds = new Set((State.vistorias||[]).filter(v=>vistIds.has(v.id)).map(v=>v.proposta_id).filter(Boolean));
    const leadIds = new Set((State.propostas||[]).filter(p=>propIds.has(p.id)).map(p=>p.lead_id).filter(Boolean));
    const filtroIds = {
      lead: leadIds, proposta: propIds, vistoria: vistIds,
      contrato: contIds, logistica: logIds, instalacao: instIds,
      homologacao: homIds
      // posvenda: excluído — instalador não precisa ver cards em Pós Venda
    };
    items = items.filter(i => (filtroIds[stage.id]||new Set()).has(i.id));
  }

  // ── tec_vistoria: filtra por cadeia encadeada a partir das SUAS vistorias ──
  if(userRole() === 'tec_vistoria'){
    const tecNome = (State.profile?.nome||'').toLowerCase().trim();
    const minhasVist = (State.vistorias||[]).filter(v=>
      (v.tecnico||'').toLowerCase().trim() === tecNome
    );
    const vistIds = new Set(minhasVist.map(v=>v.id));
    // Cadeia para frente
    const contIds = new Set((State.contratos||[]).filter(c=>vistIds.has(c.vistoria_id)).map(c=>c.id));
    const logIds  = new Set((State.logistica||[]).filter(l=>contIds.has(l.contrato_id)).map(l=>l.id));
    const instIds = new Set((State.instalacoes||[]).filter(i=>logIds.has(i.logistica_id)).map(i=>i.id));
    const homIds  = new Set((State.homologacoes||[]).filter(h=>instIds.has(h.instalacao_id)).map(h=>h.id));
    // Cadeia para trás
    const propIds = new Set(minhasVist.map(v=>v.proposta_id).filter(Boolean));
    const leadIds = new Set((State.propostas||[]).filter(p=>propIds.has(p.id)).map(p=>p.lead_id).filter(Boolean));
    const filtroIds = {
      lead: leadIds, proposta: propIds, vistoria: vistIds,
      contrato: contIds, logistica: logIds, instalacao: instIds,
      homologacao: homIds
      // posvenda: excluído — vistoriador não precisa ver cards em Pós Venda
    };
    items = items.filter(i => (filtroIds[stage.id]||new Set()).has(i.id));
  }

  // ── Oculta itens já promovidos — igual para TODOS os perfis ──
  // Garante 1 card por cliente em cada coluna (aparece só na etapa mais avançada)
  if(stage.id === 'lead'){
    const promovidos = new Set((State.propostas||[]).map(p=>p.lead_id).filter(Boolean));
    items = items.filter(l => !promovidos.has(l.id));
  }
  if(stage.id === 'proposta'){
    const promovidos = new Set((State.vistorias||[]).map(v=>v.proposta_id).filter(Boolean));
    items = items.filter(p => !promovidos.has(p.id));
  }
  if(stage.id === 'vistoria'){
    const promovidos = new Set((State.contratos||[]).map(c=>c.vistoria_id).filter(Boolean));
    items = items.filter(v => !promovidos.has(v.id));
  }
  if(stage.id === 'contrato'){
    const promovidos = new Set((State.logistica||[]).map(l=>l.contrato_id).filter(Boolean));
    items = items.filter(c => !promovidos.has(c.id));
  }
  if(stage.id === 'logistica'){
    const promovidos = new Set((State.instalacoes||[]).map(i=>i.logistica_id).filter(Boolean));
    items = items.filter(l => !promovidos.has(l.id));
  }
  if(stage.id === 'instalacao'){
    const promovidos = new Set((State.homologacoes||[]).map(h=>h.instalacao_id).filter(Boolean));
    items = items.filter(i => !promovidos.has(i.id));
  }
  if(stage.id === 'homologacao'){
    const promovidos = new Set((State.posvenda||[]).map(p=>p.homologacao_id).filter(Boolean));
    items = items.filter(h => !promovidos.has(h.id));
  }

  // Atendimentos: sem deduplicação (múltiplos por cliente são esperados)
  if(stage.id !== 'atendimentos'){
    const seen = new Map();
    items.forEach(it => {
      let key;
      if(stage.id === 'lead')
        key = 'n:' + (it.nome||'').toLowerCase().trim();
      else if(stage.id === 'proposta')
        key = it.lead_id || ('n:' + (it.nome||'').toLowerCase().trim());
      else if(stage.id === 'vistoria')
        key = it.proposta_id || it.lead_id || ('n:' + (it.nome||'').toLowerCase().trim());
      else
        key = it.lead_id || ('n:' + (it.nome||'').toLowerCase().trim());
      const prev = seen.get(key);
      if(!prev || (it.criado_em||'') > (prev.criado_em||'')) seen.set(key, it);
    });
    items = [...seen.values()];
  }

  // Botão "+" para criar novo atendimento direto na coluna
  const addBtn = stage.id === 'atendimentos'
    ? `<button class="col-search-btn" id="newAtendBtn" title="Novo Atendimento" style="font-size:16px;font-weight:700">＋</button>`
    : '';

  return `
    <div class="kanban-col" data-stage="${stage.id}">
      <div class="kanban-col-header">
        <span>${stage.icon} ${stage.label}</span>
        <div style="display:flex;align-items:center;gap:5px">
          <span class="count" id="col-count-${stage.id}">${items.length}</span>
          ${addBtn}
          <button class="col-search-btn" data-stage="${stage.id}" title="Pesquisar nesta coluna">🔍</button>
        </div>
      </div>
      <div class="col-search-bar" id="col-search-bar-${stage.id}" style="display:none">
        <input class="col-search-input" id="col-search-${stage.id}" placeholder="Buscar cliente, vendedor..." autocomplete="off">
      </div>
      <div class="kanban-col-body" data-drop="${stage.id}">
        ${items.map(it=>renderCard(it,stage)).join('') || '<div class="empty" style="padding:20px;font-size:12px">Sem itens</div>'}
      </div>
    </div>`;
}

// Retorna onde o cliente está no funil a partir de uma vistoria (para badge no card)
function etapaAtualDaVistoria(v){
  const c = (State.contratos||[]).find(x=>x.vistoria_id===v.id);
  if(!c) return null;
  const l = (State.logistica||[]).find(x=>x.contrato_id===c.id);
  if(!l) return {icon:'✍️', label:'Contrato', status:c.status};
  const i = (State.instalacoes||[]).find(x=>x.logistica_id===l.id);
  if(!i) return {icon:'📦', label:'Logística', status:l.status};
  const h = (State.homologacoes||[]).find(x=>x.instalacao_id===i.id);
  if(!h) return {icon:'🔧', label:'Instalação', status:i.status};
  const p = (State.posvenda||[]).find(x=>x.homologacao_id===h.id);
  if(!p) return {icon:'📋', label:'Homologação', status:h.etapa};
  return {icon:'⭐', label:'Pós Venda', status:p.status};
}

function renderCard(item,stage){
  const stat = stageStatus(item,stage);
  const kwh = item.kwh ? `${fmtNum(item.kwh,0)} kWh` : '';
  const kwp = item.kwp ? `${fmtNum(item.kwp,2)} kWp` : '';
  const flags = stageFlags(item,stage);
  const role = userRole();
  const isTecVist  = role === 'tec_vistoria';
  const isTecInst  = role === 'tec_instalacao';
  const isTecBoth  = role === 'tec_vistoria_instalacao';
  // técnicos restritos: sem drag
  const draggable = (isTecVist || isTecInst || isTecBoth) ? 'false' : 'true';

  // chip informativo nos cards de outras colunas
  const tecHint = (isTecVist && stage.id !== 'vistoria')
    ? `<div style="font-size:10px;color:#6B21A8;font-style:italic;margin-top:3px">🔍 Clique → editar vistoria</div>`
    : (isTecInst && stage.id !== 'instalacao')
    ? `<div style="font-size:10px;color:#0369a1;font-style:italic;margin-top:3px">🔍 Clique → editar instalação</div>`
    : (isTecBoth && !['vistoria','instalacao'].includes(stage.id))
    ? `<div style="font-size:10px;color:#6B21A8;font-style:italic;margin-top:3px">🔍 Clique → editar vistoria / instalação</div>`
    : '';

  const tipoAtendMap = {retorno_tecnico:'Retorno Técnico',manutencao:'Manutenção',venda_bateria:'Venda de Bateria',venda_app:'Venda de App',venda_produto:'Venda de Produto',outro:'Outro'};
  const isAtend = stage.id === 'atendimentos';
  const meta1 = isAtend ? (tipoAtendMap[item.tipo]||item.tipo||'') : (kwp || kwh || '');
  const meta2 = isAtend ? (item.responsavel||'') : (item.vendedor||'');

  return `
    <div class="kanban-card" draggable="${draggable}" data-id="${item.id}" data-stage="${stage.id}" data-search="${((item.nome||'')+' '+(item.responsavel||item.vendedor||'')).toLowerCase()}">
      <div class="kanban-card-inner">
        <div class="name">${stage.icon} ${esc(item.nome||'—')}</div>
        <div class="meta">${esc(meta1)}</div>
        <div class="meta">${esc(meta2)}</div>
        ${flags}
        ${tecHint}
        <div class="footer">${badge(stat)}</div>
      </div>
    </div>`;
}

function stageStatus(item,stage){
  switch(stage.id){
    case 'lead': return item.status;
    case 'proposta': return item.status;
    case 'vistoria': return item.resultado || item.status;
    case 'contrato': return item.status;
    case 'logistica': return item.status;
    case 'instalacao': return item.status;
    case 'homologacao': return item.etapa;
    case 'posvenda':     return item.status;
    case 'atendimentos': return item.status;
  }
  return '';
}

/* ─────────────────────────────────────────────────────────────
   FLAGS DE HISTÓRICO DO FUNIL — aparece nos cards do kanban
   Contrato → flag vistoria
   Logística → + flag contrato
   Instalação → + flag logística
   Homologação → + flag instalação
   Pós-venda → + 5 flags de contagem regressiva
   ───────────────────────────────────────────────────────────── */
function stageFlags(item, stage){
  const sid = stage.id;

  // ── FLAGS DE CONTATO PARA LEADS ───────────────────────────
  if(sid === 'lead' && item.status !== 'proposta'){
    const attempts = (State.tentativas_contato||[])
      .filter(t=>t.lead_id===item.id)
      .sort((a,b)=> (a.criado_em||'')<(b.criado_em||'') ? -1 : 1);
    if(!attempts.length) return '';
    const ordinal = n => n===1?'1º':n===2?'2º':n===3?'3º':`${n}º`;
    const flagsL = attempts.map((t,i)=>{
      const res = t.resultado||'';
      let c = 'warn';
      if(/contato_feito|interessado|agendou_retorno/.test(res)) c = 'ok';
      else if(/nao_interessado/.test(res)) c = 'danger';
      return `<span class="flag ${c}" title="${ordinal(i+1)} Contato: ${t.tipo} → ${res}">📞 ${ordinal(i+1)} ${t.tipo}</span>`;
    });
    return `<div class="card-flags">${flagsL.join('')}</div>`;
  }

  if(!['contrato','logistica','instalacao','homologacao','posvenda'].includes(sid)) return '';

  const flags = [];
  const today = new Date(); today.setHours(0,0,0,0);

  // ── Lookups da cadeia do funil ────────────────────────────
  const find = (arr, id) => id ? (arr||[]).find(x=>String(x.id)===String(id)) : null;

  const contrato = find(State.contratos, item.contrato_id);
  // Fallback: vistoria via contrato (registros antigos sem vistoria_id direto)
  const vistoria = find(State.vistorias, item.vistoria_id)
               || (contrato ? find(State.vistorias, contrato.vistoria_id) : null);

  // Logística e Instalação: trace a cadeia conforme o estágio
  let logistica = null, instalacao = null;
  if(sid === 'instalacao'){
    logistica  = find(State.logistica,  item.logistica_id);
  } else if(sid === 'homologacao'){
    instalacao = find(State.instalacoes, item.instalacao_id);
    logistica  = find(State.logistica,   instalacao?.logistica_id);
  } else if(sid === 'posvenda'){
    const homolog = find(State.homologacoes, item.homologacao_id);
    instalacao = find(State.instalacoes, homolog?.instalacao_id);
    logistica  = find(State.logistica,   instalacao?.logistica_id);
  }

  // ── Cor da flag conforme o status ────────────────────────
  function cls(s){
    if(!s) return '';
    if(/aprovada|assinado|conclu|comprado|ativo|realiz|entregue|pago|paga|recebido/.test(s)) return 'ok';
    if(/reprova|perdido|recusad|cancel|descart/.test(s)) return 'danger';
    return 'warn';
  }

  // ── Flags de histórico ────────────────────────────────────
  if(vistoria){
    const s = vistoria.resultado || vistoria.status || '—';
    flags.push(`<span class="flag ${cls(s)}" title="Vistoria: ${s}">🔍 ${s}</span>`);
  }
  if(['logistica','instalacao','homologacao','posvenda'].includes(sid) && contrato){
    const s = contrato.status || '—';
    flags.push(`<span class="flag ${cls(s)}" title="Contrato: ${s}">✍️ ${s}</span>`);
  }
  if(['instalacao','homologacao','posvenda'].includes(sid) && logistica){
    const s = logistica.status || '—';
    flags.push(`<span class="flag ${cls(s)}" title="Logística: ${s}">📦 ${s}</span>`);
  }
  if(['homologacao','posvenda'].includes(sid) && instalacao){
    const s = instalacao.status || '—';
    flags.push(`<span class="flag ${cls(s)}" title="Instalação: ${s}">🔧 ${s}</span>`);
  }

  // ── Pós-venda: 5 contagens regressivas ───────────────────
  if(sid === 'posvenda'){
    function addDays(dateStr, n){
      if(!dateStr) return null;
      const d = new Date(dateStr+'T12:00:00');
      d.setDate(d.getDate()+n);
      return d;
    }
    function cdFlag(icon, label, targetDate){
      if(!targetDate) return null;
      const t = new Date(targetDate); t.setHours(0,0,0,0);
      const diff = Math.round((t - today)/86400000);
      let c = 'countdown', txt;
      if(diff < 0)        { c+=' done';   txt=`${icon} ✓`; }
      else if(diff === 0) { c+=' urgent'; txt=`${icon} HOJE!`; }
      else if(diff <= 7)  { c+=' urgent'; txt=`${icon} ${diff}d`; }
      else                {               txt=`${icon} ${diff}d`; }
      return `<span class="flag ${c}" title="${label}: ${diff>=0?diff+' dias':'concluído'}">${txt}</span>`;
    }

    // 1. Aniversário (próximo)
    const lead = find(State.leads, item.lead_id);
    if(lead?.nascimento){
      const bday = new Date(lead.nascimento+'T12:00:00');
      const next = new Date(today.getFullYear(), bday.getMonth(), bday.getDate());
      if(next < today) next.setFullYear(today.getFullYear()+1);
      const diff = Math.round((next-today)/86400000);
      const c = diff<=30 ? 'countdown urgent' : 'countdown';
      flags.push(`<span class="flag ${c}" title="Aniversário: ${diff===0?'HOJE':diff+' dias'}">🎂 ${diff===0?'HOJE!':diff+'d'}</span>`);
    }

    // 2. Manutenção (+300 dias da instalação)
    if(instalacao?.data_instalacao){
      const f = cdFlag('🛡️','Manutenção (300d)',addDays(instalacao.data_instalacao,300));
      if(f) flags.push(f);
    }

    if(instalacao?.data_instalacao){
      // 3. Acolhimento (+5 dias da instalação)
      const f3 = cdFlag('🤝','Acolhimento (5d)',addDays(instalacao.data_instalacao,5));
      if(f3) flags.push(f3);
      // 4. Gratidão (+30 dias da instalação)
      const f4 = cdFlag('💛','Gratidão (30d)',addDays(instalacao.data_instalacao,30));
      if(f4) flags.push(f4);
      // 5. Embaixador (+90 dias da instalação)
      const f5 = cdFlag('🌟','Embaixador (90d)',addDays(instalacao.data_instalacao,90));
      if(f5) flags.push(f5);
    }
  }

  if(!flags.length) return '';
  return `<div class="card-flags">${flags.join('')}</div>`;
}

function filterColCards(stageId, term){
  const t = (term||'').toLowerCase().trim();
  const col = document.querySelector(`.kanban-col[data-stage="${stageId}"]`);
  if(!col) return;
  const cards = col.querySelectorAll('.kanban-card');
  let visible = 0;
  cards.forEach(card=>{
    const hay = card.dataset.search || '';
    const show = !t || hay.includes(t);
    card.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = document.getElementById(`col-count-${stageId}`);
  if(countEl) countEl.textContent = t ? `${visible}/${cards.length}` : String(cards.length);
}

function attachKanbanSearch(){
  $$('.col-search-btn').forEach(btn=>{
    const sid = btn.dataset.stage;
    const bar = document.getElementById(`col-search-bar-${sid}`);
    const inp = document.getElementById(`col-search-${sid}`);
    if(!bar || !inp) return;

    btn.addEventListener('click', ()=>{
      const isOpen = bar.style.display !== 'none';
      if(isOpen){
        bar.style.display = 'none';
        inp.value = '';
        btn.classList.remove('active');
        filterColCards(sid, '');
      } else {
        bar.style.display = '';
        btn.classList.add('active');
        inp.focus();
      }
    });

    inp.addEventListener('input', ()=> filterColCards(sid, inp.value));

    inp.addEventListener('keydown', e=>{
      if(e.key === 'Escape'){
        bar.style.display = 'none';
        inp.value = '';
        btn.classList.remove('active');
        filterColCards(sid, '');
      }
    });
  });
}

function attachKanbanDnD(){
  let dragging = null;
  $$('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragging = { id:card.dataset.id, stage:card.dataset.stage, el:card };
      card.classList.add('dragging');
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',card.dataset.id); }catch(_){}
    });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); $$('.kanban-col-body').forEach(c=>c.classList.remove('drag-over')); });
    card.addEventListener('click', ()=> openStageModal(card.dataset.stage, card.dataset.id));
  });
  $$('.kanban-col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', async e=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      if(!dragging) return;
      const fromStage = dragging.stage;
      const toStage = col.dataset.drop;
      const drag = dragging;
      dragging = null;
      if(fromStage === toStage) return;
      const fromIdx = STAGES.findIndex(s=>s.id===fromStage);
      const toIdx = STAGES.findIndex(s=>s.id===toStage);
      if(toIdx !== fromIdx+1){
        toast('Só é permitido avançar uma etapa por vez.','error');
        return;
      }
      await transitionCard(drag.id, fromStage, toStage);
    });
  });
}

async function transitionCard(id, fromStage, toStage){
  const fromCfg = STAGES.find(s=>s.id===fromStage);
  const toCfg = STAGES.find(s=>s.id===toStage);
  const item = (State[fromCfg.dataKey]||[]).find(x=>String(x.id)===String(id));
  if(!item){ toast('Item não encontrado.','error'); return; }

  const guard = checkGuard(item, fromStage, toStage);
  if(!guard.ok){ toast(guard.msg, 'error'); return; }

  // Check duplicate — consulta o banco para evitar race condition
  const linkField = fromStage+'_id';
  const { data: dupCheck } = await supa.from(toCfg.table).select('id').eq(linkField, item.id).maybeSingle();
  if(dupCheck){ toast('Já existe registro nesta etapa para este item.','info'); return; }

  const payload = buildTransitionPayload(item, fromStage, toStage);
  payload.criado_por = State.user?.id;

  const { error } = await supa.from(toCfg.table).insert(payload);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  toast(`Movido para ${toCfg.label}`,'success');
  await loadAll();
  renderPipeline();
}

function checkGuard(item, fromStage, toStage){
  if(fromStage==='lead' && toStage==='proposta'){
    if(item.status !== 'proposta') return {ok:false, msg:'Lead precisa estar com status "Proposta".'};
  }
  if(fromStage==='proposta' && toStage==='vistoria'){
    if(item.status !== 'aceita') return {ok:false, msg:'Proposta precisa estar "Aceita".'};
  }
  if(fromStage==='vistoria' && toStage==='contrato'){
    const ok = ['aguardando_agendamento','agendada','realizada','aprovada'].includes(item.status);
    if(!ok) return {ok:false, msg:'Vistoria precisa estar com status Agendada, Realizada ou Aprovada.'};
  }
  if(fromStage==='contrato' && toStage==='logistica'){
    if(item.status !== 'assinado' || !item.data_assinatura) return {ok:false, msg:'Contrato precisa estar assinado com data preenchida.'};
  }
  if(fromStage==='logistica' && toStage==='instalacao'){
    // Qualquer status permite avançar
  }
  if(fromStage==='instalacao' && toStage==='homologacao'){
    if(item.status === 'cancelada') return {ok:false, msg:'Instalação cancelada não pode avançar para homologação.'};
  }
  if(fromStage==='homologacao' && toStage==='posvenda'){
    if(item.etapa !== 'aprovada') return {ok:false, msg:'Homologação precisa estar "Aprovada".'};
  }
  return {ok:true};
}

function buildTransitionPayload(item, fromStage, toStage){
  const lead_id = item.lead_id || (fromStage==='lead'?item.id:null);
  const base = { nome:item.nome, telefone:item.telefone, vendedor:item.vendedor, lead_id };
  if(toStage==='proposta') return { ...base, kwh:item.kwh, status:'em_aberto' };
  if(toStage==='vistoria') return {
    ...base, proposta_id:item.id, email:item.email, cep:item.cep, rua:item.rua, numero:item.numero, complemento:item.complemento,
    bairro:item.bairro, cidade:item.cidade, estado:item.estado, qtd_modulos:item.qtd_modulos, marca_modulo:item.marca_modulo,
    pot_modulo:item.pot_modulo, qtd_inversores:item.qtd_inversores, marca_inversor:item.marca_inversor, pot_inversor:item.pot_inversor,
    qtd_baterias:item.qtd_baterias, marca_bateria:item.marca_bateria, pot_bateria:item.pot_bateria, kwp:item.kwp,
    status:'agendada'
  };
  if(toStage==='contrato') return {
    ...base, vistoria_id:item.id, proposta_id:item.proposta_id, email:item.email, cep:item.cep, rua:item.rua, numero:item.numero,
    complemento:item.complemento, bairro:item.bairro, cidade:item.cidade, estado:item.estado, gmap:item.gmap,
    qtd_modulos:item.qtd_modulos, marca_modulo:item.marca_modulo, pot_modulo:item.pot_modulo,
    qtd_inversores:item.qtd_inversores, marca_inversor:item.marca_inversor, pot_inversor:item.pot_inversor,
    qtd_baterias:item.qtd_baterias, marca_bateria:item.marca_bateria, pot_bateria:item.pot_bateria, kwp:item.kwp,
    status:'pendente'
  };
  if(toStage==='logistica') return {
    ...base, contrato_id:item.id, proposta_id:item.proposta_id||null, vistoria_id:item.vistoria_id||null,
    kwp:item.kwp, valor:item.valor, status:'aguardando'
  };
  if(toStage==='instalacao'){
    // Herda endereço do contrato para facilitar a equipe técnica
    const contrato = (State.contratos||[]).find(c=>String(c.id)===String(item.contrato_id));
    const endParts = [contrato?.rua, contrato?.numero?`nº ${contrato.numero}`:'', contrato?.complemento, contrato?.bairro, contrato?.cidade, contrato?.estado].filter(Boolean);
    const endereco = endParts.length ? endParts.join(', ') : (item.endereco||'');
    return {
      ...base, logistica_id:item.id, contrato_id:item.contrato_id, proposta_id:item.proposta_id||null, vistoria_id:item.vistoria_id||null,
      kwp:item.kwp, valor:item.valor, distribuidora:item.distribuidora, status:'agendada', endereco,
      cep:contrato?.cep||null, gmap:contrato?.gmap||null
    };
  }
  if(toStage==='homologacao') return {
    ...base, instalacao_id:item.id, contrato_id:item.contrato_id, proposta_id:item.proposta_id||null, vistoria_id:item.vistoria_id||null,
    kwp:item.kwp, etapa:'aguardando_docs'
  };
  if(toStage==='posvenda') return {
    ...base, homologacao_id:item.id, contrato_id:item.contrato_id, proposta_id:item.proposta_id||null, vistoria_id:item.vistoria_id||null,
    kwp:item.kwp, status:'ativo'
  };
  return base;
}

/* ============================================================
   HELPER — Documentos vinculados (cadeia completa do funil)
   Disponível em qualquer estágio: Proposta, Contrato, e ambos os PDFs
   ============================================================ */
function getLinkedDocs(item){
  const _f = (arr,id) => id ? (arr||[]).find(x=>String(x.id)===String(id)) : null;
  // Resolve cadeia de baixo para cima: instalação → logística → contrato
  // Isso garante que gmap e equipamentos sejam encontrados mesmo em registros antigos
  const instalacao = _f(State.instalacoes, item.instalacao_id)
                  || (() => {
                       const hom = _f(State.homologacoes, item.homologacao_id);
                       return hom ? _f(State.instalacoes, hom.instalacao_id) : null;
                     })();
  const logistica  = _f(State.logistica,  item.logistica_id)
                  || (instalacao ? _f(State.logistica,  instalacao.logistica_id) : null);
  // contrato_id direto (registros novos) ou via logistica (registros antigos)
  const contrato   = _f(State.contratos,  item.contrato_id)
                  || (logistica  ? _f(State.contratos,  logistica.contrato_id)  : null);
  const vistoria   = _f(State.vistorias,  item.vistoria_id)
                  || (contrato   ? _f(State.vistorias,  contrato.vistoria_id)   : null);
  const proposta   = _f(State.propostas,  item.proposta_id)
                  || (contrato   ? _f(State.propostas,  contrato.proposta_id)   : null)
                  || (vistoria   ? _f(State.propostas,  vistoria.proposta_id)   : null);
  return { proposta, vistoria, contrato, logistica, instalacao };
}

function openStageModal(stage,id){
  const cfg = STAGES.find(s=>s.id===stage);
  const item = (State[cfg.dataKey]||[]).find(x=>String(x.id)===String(id));
  if(!item) return;

  // tec_vistoria: só pode editar o modal de vistoria.
  if(userRole() === 'tec_vistoria' && stage !== 'vistoria'){
    const linked = getLinkedDocs(item);
    const vistoria = linked.vistoria
      || (State.vistorias||[]).find(v=>String(v.id)===String(item.vistoria_id));
    if(vistoria) openVistoriaModal(vistoria);
    else toast('Vistoria vinculada não encontrada.','warn');
    return;
  }

  // tec_vistoria_instalacao: pode editar vistoria e instalação.
  if(userRole() === 'tec_vistoria_instalacao' && !['vistoria','instalacao'].includes(stage)){
    const linked = getLinkedDocs(item);
    const vistoria  = linked.vistoria  || (State.vistorias||[]).find(v=>String(v.id)===String(item.vistoria_id));
    const instalacao= linked.instalacao|| (State.instalacoes||[]).find(i=>String(i.id)===String(item.instalacao_id));
    if(vistoria)   { openVistoriaModal(vistoria);   return; }
    if(instalacao) { openInstalacaoModal(instalacao); return; }
    toast('Modal vinculado não encontrado.','warn');
    return;
  }

  // tec_instalacao: só pode editar o modal de instalação.
  if(userRole() === 'tec_instalacao' && stage !== 'instalacao'){
    const linked = getLinkedDocs(item);
    const instalacao = linked.instalacao
      || (State.instalacoes||[]).find(i=>String(i.id)===String(item.instalacao_id));
    if(instalacao) openInstalacaoModal(instalacao);
    else toast('Instalação vinculada não encontrada.','warn');
    return;
  }

  switch(stage){
    case 'lead': openLeadModal(item); break;
    case 'proposta': openPropostaModal(item); break;
    case 'vistoria': openVistoriaModal(item); break;
    case 'contrato': openContratoModal(item); break;
    case 'logistica': openLogisticaModal(item); break;
    case 'instalacao': openInstalacaoModal(item); break;
    case 'homologacao': openHomologacaoModal(item); break;
    case 'posvenda':     openPosVendaModal(item); break;
    case 'atendimentos': openAtendimentoModal(item); break;
  }
}

function openModal(html, size=''){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal ${size}">${html}</div>`;
  root.classList.add('active');
  $$('.modal-close',root).forEach(b=>b.addEventListener('click', closeModal));

/* ============================================================
   CPF / CNPJ / CEP UTILITIES
   ============================================================ */
function validarCPF(v){
  const c=v.replace(/\D/g,'');
  if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  let s=0; for(let i=0;i<9;i++) s+=+c[i]*(10-i);
  let r=s%11; const d1=r<2?0:11-r;
  if(+c[9]!==d1) return false;
  s=0; for(let i=0;i<10;i++) s+=+c[i]*(11-i);
  r=s%11; const d2=r<2?0:11-r;
  return +c[10]===d2;
}
function validarCNPJ(v){
  const c=v.replace(/\D/g,'');
  if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;
  const calc=(c,n)=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};
  return +c[12]===calc(c,12)&&+c[13]===calc(c,13);
}
function attachCPF(formEl){
  const el = formEl?.elements?.cpf || formEl?.querySelector?.('[name="cpf"]');
  if(!el) return;
  el.placeholder='000.000.000-00';
  el.addEventListener('input', ()=>{
    const v=el.value.replace(/\D/g,'');
    if(!v){el.style.borderColor='';el.title='';return;}
    if(v.length<11){el.style.borderColor='';return;}
    const ok=validarCPF(v);
    el.style.borderColor=ok?'#22c55e':'#ef4444';
    el.title=ok?'CPF válido ✓':'CPF inválido ✗';
  });
}
async function lookupCEP(cep, formEl){
  const digits=cep.replace(/\D/g,'');
  if(digits.length!==8) return;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${digits}/json/`);
    const d=await r.json();
    if(d.erro) return;
    const set=(name,val)=>{
      const el=formEl?.elements?.[name]||formEl?.querySelector?.(`[name="${name}"]`);
      if(el && !el.value && val) el.value=val;
    };
    set('rua', d.logradouro);
    set('bairro', d.bairro);
    set('cidade', d.localidade);
    const estado=formEl?.elements?.estado||formEl?.querySelector?.('[name="estado"]');
    if(estado && d.uf) estado.value=d.uf;
  }catch(e){}
}
function attachCEP(formEl){
  const el=formEl?.elements?.cep||formEl?.querySelector?.('[name="cep"]');
  if(!el) return;
  el.placeholder='00000-000';
  el.addEventListener('blur', ()=> lookupCEP(el.value, formEl));
}

function formField({label,name,type='text',value='',options=null,required=false,readonly=false,rows=null,full=false,placeholder='',datalist=null}){
  const v = value==null?'':value;
  const dlId = datalist ? 'dl_'+name+'_'+Math.random().toString(36).slice(2,7) : null;
  const dlHtml = datalist ? `<datalist id="${dlId}">${datalist.map(o=>`<option value="${esc(String(o))}">`).join('')}</datalist>` : '';
  let inp;
  if(type==='select'){
    inp = `<select name="${name}" ${required?'required':''}>${options.map(o=>{
      const [val,text] = Array.isArray(o)?o:[o,o];
      return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(text)}</option>`;
    }).join('')}</select>`;
  } else if(type==='textarea'){
    inp = `<textarea name="${name}" rows="${rows||3}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`;
  } else if(type==='toggle'){
    inp = `<label class="toggle"><input type="checkbox" name="${name}" ${v?'checked':''}/><span>${esc(label)}</span></label>`;
    return `<div class="form-group ${full?'full':''}">${inp}</div>`;
  } else if(type==='number'){
    // Usa text+inputmode para aceitar vírgula decimal (padrão BR)
    inp = `<input type="text" inputmode="decimal" name="${name}" value="${esc(fmtInputNum(v))}" placeholder="${esc(placeholder||'0')}" data-numtype="1" ${datalist?`list="${dlId}"`:''}  ${required?'required':''} ${readonly?'readonly':''}/>`;
  } else {
    const dateAttrs = type==='date' ? 'min="1900-01-01" max="2100-12-31"' : '';
    inp = `<input type="${type}" name="${name}" value="${esc(v)}" placeholder="${esc(placeholder)}" ${dateAttrs} ${datalist?`list="${dlId}"`:''}  ${required?'required':''} ${readonly?'readonly':''}/>`;
  }
  return `<div class="form-group ${full?'full':''}"><label>${esc(label)}${required?' *':''}</label>${inp}${dlHtml}</div>`;
}

function readForm(formEl){
  const data = {};
  const badDates = [];
  $$('input,select,textarea',formEl).forEach(el=>{
    if(!el.name) return;
    if(el.type==='checkbox'){
      data[el.name] = el.checked;
    } else if(el.dataset.numtype){
      data[el.name] = parseBR(el.value); // converte "1.500,50" → 1500.5
    } else if(el.type==='date'){
      if(!el.value){ data[el.name] = null; return; }
      const m = el.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const yr = m ? +m[1] : 0;
      if(!m || yr < 1900 || yr > 2100){
        badDates.push(el.labels?.[0]?.textContent || el.name);
        data[el.name] = null;
      } else {
        data[el.name] = el.value;
      }
    } else {
      data[el.name] = el.value === '' ? null : el.value;
    }
  });
  if(badDates.length) toast(`Data inválida em: ${badDates.join(', ')} — verifique o ano digitado.`,'error', 5000);
  return data;
}

/* ============================================================
   HISTÓRICO DE ALTERAÇÕES
   ============================================================ */

// Detecta campos que mudaram entre o objeto antigo e o novo
function detectMudancas(antes, depois, campos){
  return campos.map(([key, label, mapFn])=>{
    const va = String(antes[key]??'');
    const vd = String(depois[key]??'');
    if(va === vd) return null;
    const fmt = v => mapFn ? (mapFn(v)||v||'—') : (v||'—');
    return `${label}: ${fmt(antes[key])} → ${fmt(depois[key])}`;
  }).filter(Boolean);
}

// Grava um evento no histórico (usa supaAdmin para ignorar RLS de escrita)
async function registrarHistorico(tabela, registroId, acao, descricao){
  if(!registroId) return;
  try{
    const perfil = (State.perfis||[]).find(p=>p.user_id===State.user?.id);
    const nomeUsuario = perfil?.nome || State.user?.email || 'Sistema';
    const { error } = await supaAdmin.from('historico').insert({
      tabela,
      registro_id: String(registroId),
      usuario_id: State.user?.id || null,
      usuario_nome: nomeUsuario,
      acao,
      descricao
    });
    if(error) console.error('[Histórico] Falha ao gravar:', error.message, error);
  }catch(e){ console.error('[Histórico] Exceção:', e); }
}

// Carrega e renderiza o histórico num elemento DOM
async function carregarHistorico(el, tabela, registroId){
  if(!el || !registroId) return;
  const { data, error } = await supaAdmin.from('historico')
    .select('*').eq('tabela', tabela).eq('registro_id', String(registroId))
    .order('criado_em', { ascending: false }).limit(60);
  if(error){
    console.error('[Histórico] Falha ao carregar:', error.message, error);
    el.innerHTML = `<div class="hist-empty" style="color:#dc2626;font-size:11px">
      ⚠️ Erro ao carregar histórico — verifique o console (F12).<br>
      <small>${error.message}</small>
    </div>`;
    return;
  }
  const icons = {criado:'🆕', atualizado:'✏️', status:'🔄', etapa:'🔖',
                 avancou:'➡️', aprovado:'✅', reprovado:'❌'};
  const fmtDT = ts => new Date(ts).toLocaleString('pt-BR',{
    day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  if(!data?.length){
    el.innerHTML = '<div class="hist-empty">Nenhuma alteração registrada ainda.</div>';
    return;
  }
  el.innerHTML = data.map(h=>`
    <div class="hist-item">
      <div class="hist-icon">${icons[h.acao]||'📝'}</div>
      <div class="hist-body">
        <div class="hist-desc">${esc(h.descricao)}</div>
        <div class="hist-meta"><strong>${esc(h.usuario_nome||'Sistema')}</strong> · ${fmtDT(h.criado_em)}</div>
      </div>
    </div>`).join('');
}

        });

        // Lead atualizado para "proposta" → cria proposta automaticamente
        const jaExiste = (State.propostas||[]).find(p => p.lead_id === item.id);
        if(!jaExiste){
          const pPayload = buildTransitionPayload({...item,...data}, 'lead', 'proposta');
          pPayload.criado_por = State.user?.id;
          const { error: pe } = await supa.from('propostas').insert(pPayload);
          if(pe) toast('Lead atualizado, mas erro ao criar proposta: '+pe.message,'error');
          else toast('Lead → Proposta criada automaticamente! ✓','success');
        } else { toast('Lead atualizado!','success'); }
      } else {
        toast('Lead atualizado!','success');
      }
    }

    if(State.route==='pipeline') renderPipeline();
  });

  $('#delLeadBtn')?.addEventListener('click', async ()=>{

    const { error } = await supa.from('leads').delete().eq('id',item.id);
    if(error) return toast(error.message,'error');
    toast('Lead excluído','success'); closeModal();
    if(State.route==='pipeline') renderPipeline();
  });

  if(!isNew) attachContactLog(item.id,'lead');
}

  const form = $('#propForm');
  attachCEP(form);

  if(isNew && form.validade && !form.validade.value){
    const d = new Date(); d.setDate(d.getDate()+7);
    form.validade.value = d.toISOString().slice(0,10);
  }

  function recalc(){
    const qm = parseBR(form.qtd_modulos.value)||0;
    const pm = parseBR(form.pot_modulo.value)||0;
    const kwp = qm*pm/1000;
    form.kwp.value = kwp ? fmtInputNum(parseFloat(kwp.toFixed(4))) : '';
    // Área mínima: qtd_módulos × 3,5 m²
    form.area_minima.value = qm ? fmtInputNum(parseFloat((qm*3.5).toFixed(1))) : '';
  }
  function recalcSemSolar(){
    const kwh = parseBR(form.kwh.value)||0;
    if(kwh){
      const sem = parseFloat((kwh*1.29).toFixed(2));
      form.conta_sem_solar.value = fmtInputNum(sem);
      form.conta_com_solar.value = fmtInputNum(parseFloat((sem*0.15).toFixed(2)));
    }
    recalcEco();
  }
  function recalcComSolar(){
    const sem = parseBR(form.conta_sem_solar.value)||0;
    if(sem) form.conta_com_solar.value = fmtInputNum(parseFloat((sem*0.15).toFixed(2)));
    recalcEco();
  }
  function recalcEco(){
    const semSolar = parseBR(form.conta_sem_solar.value)||0;
    const comSolar = parseBR(form.conta_com_solar.value)||0;
    const eco = Math.max(0, semSolar - comSolar);
    form.economia_mensal.value = eco ? fmtInputNum(parseFloat(eco.toFixed(2))) : '';
    form.economia_5anos.value  = eco ? fmtInputNum(parseFloat((eco*60).toFixed(2))) : '';
  }
  ['qtd_modulos','pot_modulo'].forEach(n=> form[n].addEventListener('input',recalc));
  form.kwh.addEventListener('input', recalcSemSolar);
  form.conta_sem_solar.addEventListener('input', recalcComSolar);
  form.conta_com_solar.addEventListener('input', recalcEco);

  if(!isNew) carregarHistorico($('#histList'), 'propostas', item.id);

  const statusPropMap = {em_aberto:'Em aberto', enviada:'Enviada', aceita:'Aceita', perdida:'Perdida'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    ['qtd_modulos','pot_modulo','qtd_inversores','pot_inversor','qtd_baterias','pot_bateria','kwp','kwh','valor',
     'conta_sem_solar','conta_com_solar','economia_mensal','economia_5anos','area_minima'].forEach(k=>{ data[k] = data[k]!=null ? Number(data[k]) : null; });
    if(isNew){
      data.criado_por = State.user?.id;
      const { data: propCriada, error } = await supa.from('propostas').insert(data).select('id').single();
      if(error) return toast(error.message,'error');
      await registrarHistorico('propostas', propCriada.id, 'criado', `Proposta criada: ${data.nome||''}`);
      toast('Proposta criada','success');
    } else {
      const prevStatus = item.status;
      const { error } = await supa.from('propostas').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
      const mud = detectMudancas(item, data, [
        ['status','Status', v=>statusPropMap[v]||v],
        ['vendedor','Vendedor',null], ['valor','Valor',null],
      ]);
      const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
      await registrarHistorico('propostas', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');

      // Proposta aceita → cria Vistoria automaticamente (se ainda não existir)
      if(data.status === 'aceita' && prevStatus !== 'aceita'){
        const jaExiste = (State.vistorias||[]).find(v => v.proposta_id === item.id);
        if(!jaExiste){
          await loadAll(); // garante dados frescos
          const propostaAtual = (State.propostas||[]).find(p=>p.id===item.id) || {...item,...data};
          const vPayload = buildTransitionPayload(propostaAtual, 'proposta', 'vistoria');
          vPayload.criado_por = State.user?.id;
          const { error: ve } = await supa.from('vistorias').insert(vPayload);
          if(ve) toast('Proposta aceita, mas erro ao criar vistoria: '+ve.message,'error');
          else toast('Proposta aceita → Vistoria criada automaticamente! ✓','success');
        } else {
          toast('Proposta atualizada','success');
        }
      } else {
        toast('Proposta atualizada','success');
      }
    }
    closeModal();
    if(State.route==='pipeline') renderPipeline();
  });
  $('#vizPropBtn')?.addEventListener('click', ()=> abrirPropostaJanela(item, false));
  $('#dlPropBtn')?.addEventListener('click',  ()=> abrirPropostaJanela(item, true));

  $('#delPropBtn')?.addEventListener('click', async ()=>{

    toast('Excluído','success'); closeModal();
    if(State.route==='pipeline') renderPipeline();
  });
}

/* ============================================================
   FILE UPLOAD HELPER
   ============================================================ */
async function uploadFile(bucket, file, prefix=''){
  const ext = (file.name.split('.').pop()||'bin').toLowerCase();
  const path = `${prefix?prefix+'/':''}${Date.now()}_${uid()}.${ext}`;
  const { error } = await supa.storage.from(bucket).upload(path, file, { upsert:false, contentType:file.type || 'application/octet-stream' });
  if(error) throw error;
  const { data:urlData } = supa.storage.from(bucket).getPublicUrl(path);
  return { url:urlData.publicUrl, path, name:file.name };
}

function fileUploadBlock(label, name, bucket, currentList=[], multiple=true){
  const list = Array.isArray(currentList)?currentList:[];
  const btnLabel = multiple ? '+ Adicionar fotos' : '+ Selecionar arquivo';
  return `
    <div class="file-upload" data-fu="${name}">
      <label>${esc(label)}</label>
      <div class="file-thumbs" data-thumbs="${name}">
        ${list.map((f,i)=>thumbHtml(f,name,i)).join('')}
      </div>
      <button type="button" class="btn-add-file" data-trigger="${name}">${btnLabel}</button>
      <input type="file" data-bucket="${bucket}" data-name="${name}" ${multiple?'multiple':''} accept="image/*,application/pdf" />
    </div>`;
}
function thumbHtml(f,name,i){
  const isImg = (f.url||'').match(/\.(jpe?g|png|gif|webp|bmp)$/i);
  return `<div class="file-thumb ${isImg?'':'doc'}" data-name="${name}" data-i="${i}">
    ${isImg ? `<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="${esc(f.name||'')}"/></a>` : `<a href="${esc(f.url)}" target="_blank">${esc(f.name||'arquivo')}</a>`}
    <button type="button" class="rm" data-rm="${name}" data-i="${i}">×</button>
  </div>`;
}

function attachFileUploads(rootEl, fileStore){
  function bindRemove(){
    $$('[data-rm]',rootEl).forEach(b=>{
      if(b._bound) return; b._bound = true;
      b.addEventListener('click', ()=>{
        const name = b.dataset.rm, i = Number(b.dataset.i);
        if(!fileStore[name]) return;
        fileStore[name].splice(i,1);
        const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
        wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
        bindRemove();
      });
    });
  }
  // Botão "+ Adicionar fotos/arquivo" → dispara o input oculto
  $$('.btn-add-file',rootEl).forEach(btn=>{
    if(btn._bound) return; btn._bound = true;
    btn.addEventListener('click', ()=>{
      const inp = rootEl.querySelector(`input[type=file][data-name="${btn.dataset.trigger}"]`);
      if(inp) inp.click();
    });
  });

  $$('input[type=file]',rootEl).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const bucket = inp.dataset.bucket;
      const name = inp.dataset.name;
      fileStore[name] = fileStore[name] || [];
      for(const file of inp.files){
        try{
          toast('Enviando '+file.name+'…','info',1500);
          const f = await uploadFile(bucket, file, name);
          fileStore[name].push(f);
        }catch(e){ toast('Erro upload: '+e.message,'error'); }
      }
      const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
      wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
      bindRemove();
      inp.value = '';
    });
  });
  bindRemove();
}

    const wrap = document.getElementById('respAusenciaWrap');
    if(wrap) wrap.style.display = presente ? 'none' : 'block';
  };
