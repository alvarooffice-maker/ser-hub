async function renderRemarketing(){
  await loadTable('remarketing');
  let items = filterByVendor(State.remarketing);
  $('#pageActions').innerHTML = `<input type="text" id="searchRem" placeholder="Buscar…" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px"/>`;
  $('#content').innerHTML = `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Telefone</th><th>Motivo</th><th>Reativação</th><th>Vendedor</th><th>Status</th><th></th></tr></thead>
          <tbody id="remBody">
            ${items.length?items.map(r=>`
              <tr>
                <td>${esc(r.nome||'')}</td>
                <td>${esc(r.telefone||'')}</td>
                <td>${esc((r.motivo_perda||'').replace(/_/g,' '))}</td>
                <td>${fmtDate(r.data_reativacao)}</td>
                <td>${esc(r.vendedor||'')}</td>
                <td>${badge(r.status)}</td>
                <td class="row-actions">
                  <button class="btn btn-sm btn-secondary" data-edit="${r.id}">Abrir</button>
                  <button class="btn btn-sm btn-primary" data-react="${r.id}">Reativar</button>
                </td>
              </tr>`).join(''):`<tr><td colspan="7" class="empty">Nenhum item.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
  $$('[data-edit]').forEach(b=>b.addEventListener('click', ()=> openRemarketingModal(items.find(x=>String(x.id)===b.dataset.edit))));
  $$('[data-react]').forEach(b=>b.addEventListener('click', async ()=>{
    const r = items.find(x=>String(x.id)===b.dataset.react);
    if(!r) return;

    const confirmado = await new Promise(resolve => {
      openModal(`
        <div style="text-align:center;padding:8px 0 4px;max-width:320px;margin:0 auto">
          <div style="font-size:32px;margin-bottom:12px">🔁</div>
          <h3 style="margin:0 0 8px">Reativar lead?</h3>
          <p style="color:#555;font-size:13px;margin:0 0 24px">
            <strong>${esc(r.nome)}</strong> voltará para a aba
            <strong>Lead</strong> do pipeline.
          </p>
          <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn btn-secondary" id="cancelReact">Não, cancelar</button>
            <button class="btn" id="confirmReact" style="background:#6B21A8;color:#fff">Sim, reativar</button>
          </div>
        </div>
      `);
      $('#confirmReact')?.addEventListener('click', () => { closeModal(); resolve(true); });
      $('#cancelReact')?.addEventListener('click',  () => { closeModal(); resolve(false); });
    });
    if(!confirmado) return;

    let leadId = r.lead_id;
    if(leadId){
      await supa.from('leads').update({ status:'em_contato', motivo_perda:null, remarketing:true }).eq('id',leadId);
    } else {
      const { data: novoLead, error: eLead } = await supa.from('leads').insert({
        nome: r.nome, telefone: r.telefone, vendedor: r.vendedor,
        status: 'em_contato', remarketing: true,
        criado_por: State.user?.id
      }).select('id').single();
      if(eLead) return toast(eLead.message,'error');
      leadId = novoLead.id;
    }
    await supa.from('remarketing').update({ status:'reativado', lead_id: leadId }).eq('id',r.id);
    await loadAll();
    toast('Lead reativado ✓ Redirecionando para o pipeline…','success');
    navigate('pipeline');
  }));
  $('#searchRem')?.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    $$('#remBody tr').forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q)?'':'none');
  });
}

function openRemarketingModal(item){
  if(!item) return;
  const statusOpts = [['pendente','Pendente'],['em_contato','Em contato'],['reativado','Reativado'],['descartado','Descartado']];
  openModal(`
    <div class="modal-header"><h2>Remarketing — ${esc(item.nome||'')}</h2><button class="modal-close">×</button></div>
    <form id="remForm">
      <div class="modal-body">
        <div class="form-grid">
          ${formField({label:'Nome',name:'nome',value:item.nome,readonly:true})}
          ${formField({label:'Telefone',name:'telefone',value:item.telefone})}
          ${formField({label:'Motivo perda',name:'motivo_perda',value:item.motivo_perda,readonly:true})}
          ${formField({label:'Data reativação',name:'data_reativacao',type:'date',value:item.data_reativacao})}
          ${formField({label:'Vendedor',name:'vendedor',value:item.vendedor})}
          ${formField({label:'Status',name:'status',type:'select',value:item.status,options:statusOpts})}
          ${formField({label:'Observações',name:'obs',type:'textarea',value:item.obs,full:true})}
        </div>
        ${renderContactLog(item.id,'remark')}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  `,'lg');
  attachContactLog(item.id,'remark');
  const form = $('#remForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    delete data.nome; delete data.motivo_perda;
    const { error } = await supa.from('remarketing').update(data).eq('id',item.id);
    if(error) return toast(error.message,'error');
    toast('Salvo','success'); closeModal(); renderRemarketing();
  });
}

function renderBaterias(){
  $('#pageActions').innerHTML = '';
  let autonomiaHoras = 6;
  let customItems = [];
  let ultimoCalculo = null;

  $('#content').innerHTML = `

      <div class="section">
        <div class="section-header"><h4>🔌 Cargas Prioritárias</h4><span class="section-toggle">▼</span></div>
        <div class="section-body">
          <p style="font-size:12.5px;color:var(--text-light);margin-bottom:14px">Marque os equipamentos que devem continuar funcionando durante a falta de energia. Ajuste a quantidade e as horas de uso (dentro da autonomia).</p>
          <table class="bat-table">
            <thead><tr>
              <th style="width:36%">Equipamento</th>
              <th style="width:14%;text-align:center">Qtd.</th>
              <th style="width:18%;text-align:center">Potência (W)</th>
              <th style="width:18%;text-align:center">Horas de uso</th>
              <th style="width:14%;text-align:center">Ativo</th>
            </tr></thead>
            <tbody id="batCargasBody"></tbody>
          </table>
          <div id="batCustomContainer"></div>
          <button type="button" class="btn-add-file" id="batAddCustomBtn" style="margin-top:12px">+ Adicionar equipamento personalizado</button>
          <div class="alert" id="batAlertaSemCarga" style="display:none;margin-top:12px;background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:12.5px;font-weight:600">⚠️ Selecione ao menos uma carga prioritária para calcular.</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin:18px 0;flex-wrap:wrap">
        <button type="button" class="btn btn-primary" id="batCalcularBtn">⚡ Calcular Baterias</button>
        <button type="button" class="btn btn-secondary" id="batLimparBtn">↺ Limpar tudo</button>
      </div>

      <div id="batResultadoWrap" style="display:none">
        <div class="section">
          <div class="section-header"><h4>✓ Resultado do Dimensionamento</h4><span class="section-toggle">▼</span></div>
          <div class="section-body">
            <div class="bat-resultado-main">
              <div class="bat-res-card">
                <div class="nome">Energia Total Necessária</div>
                <div class="valor" id="batResEnergia">—</div>
                <div class="unidade">kWh</div>
              </div>
              <div class="bat-res-card destaque">
                <div class="nome">Nº de Baterias (${BAT_CAPACIDADE_UNIDADE} kWh)</div>
                <div class="valor" id="batResBaterias">—</div>
                <div class="unidade">unidades</div>
              </div>
              <div class="bat-res-card">
                <div class="nome">Capacidade Total</div>
                <div class="valor" id="batResCapacidade">—</div>
                <div class="unidade">kWh instalados</div>
              </div>
            </div>
            <table class="bat-detail-table">
              <thead><tr>
                <th>Equipamento</th><th style="text-align:center">Qtd.</th>
                <th style="text-align:center">Pot. Unit. (W)</th><th style="text-align:center">Horas</th>
                <th style="text-align:right">Consumo (Wh)</th>

            </table>
            <div class="bat-nota" id="batNotaBox"></div>

  // ── Seções colapsáveis (fora de modal — precisa bind manual) ──
  $$('#content .section-header').forEach(h=>{
    h.addEventListener('click', ()=> h.parentElement.classList.toggle('collapsed'));
  });

  // ── Autonomia ──
  const autGrid = $('#batAutonomiaGrid');
  function renderAutonomiaCards(){
    autGrid.innerHTML = BAT_AUTONOMIAS.map(a=>`
      <div class="bat-autonomia-card${a.h===autonomiaHoras?' selected':''}" data-horas="${a.h}">
        <div class="horas">${a.h}h</div>
        <div class="label">${a.label}${a.h===autonomiaHoras?' ✓':''}</div>
      </div>`).join('');
    $$('.bat-autonomia-card', autGrid).forEach(card=>{
      card.addEventListener('click', ()=>{
        autonomiaHoras = Number(card.dataset.horas);
        renderAutonomiaCards();
        // ajusta horas de uso para não ultrapassar a autonomia
        $$('[id^="batHor_"]').forEach(inp=>{
          inp.max = autonomiaHoras;
          if(parseFloat(inp.value) > autonomiaHoras) inp.value = autonomiaHoras;
        });
        $$('[data-bh]', $('#batCustomContainer')).forEach(inp=>{
          inp.max = autonomiaHoras;
          if(parseFloat(inp.value) > autonomiaHoras) inp.value = autonomiaHoras;
        });
      });
    });
  }
  renderAutonomiaCards();

  // ── Cargas padrão ──
  const cargasBody = $('#batCargasBody');
  cargasBody.innerHTML = BAT_EQUIPAMENTOS.map((eq,i)=>`
    <tr class="bat-row" style="opacity:.45" data-row="${i}">
      <td><div class="equip-name"><span class="equip-icon">${eq.icon}</span>
        <div><div class="equip-label">${esc(eq.nome)}</div><div class="equip-default">${esc(eq.detalhe)}</div></div>
      </div></td>
      <td><div class="bat-qty-control">
        <button type="button" class="bat-qty-btn" data-qty-dec="${i}">−</button>
        <span class="bat-qty-val" id="batQty_${i}">${eq.qtd}</span>
        <button type="button" class="bat-qty-btn" data-qty-inc="${i}">+</button>
      </div></td>
      <td><input class="bat-input-small" type="number" id="batPot_${i}" value="${eq.potencia}" min="1" max="99999"></td>
      <td><input class="bat-input-small" type="number" id="batHor_${i}" value="${eq.horas}" min="0.5" max="${autonomiaHoras}" step="0.5"></td>
      <td class="bat-toggle-col"><input type="checkbox" class="bat-toggle-check" id="batChk_${i}" data-toggle="${i}"></td>
    </tr>`).join('');

  $$('[data-toggle]', cargasBody).forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const row = chk.closest('tr');
      row.style.opacity = chk.checked ? '1' : '.45';
    });
  });
  $$('[data-qty-dec]', cargasBody).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = $(`#batQty_${btn.dataset.qtyDec}`);
      el.textContent = Math.max(0, parseInt(el.textContent)-1);
    });
  });
  $$('[data-qty-inc]', cargasBody).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = $(`#batQty_${btn.dataset.qtyInc}`);
      el.textContent = parseInt(el.textContent)+1;
    });
  });

  // ── Itens personalizados ──
  const customContainer = $('#batCustomContainer');
  function renderCustom(){
    customContainer.innerHTML = customItems.map((item,i)=>`
      <div class="bat-custom-row" data-custom="${i}">
        <input type="text" data-bn="${i}" placeholder="Nome do equipamento" value="${esc(item.nome)}">
        <input type="number" data-bp="${i}" placeholder="W" value="${item.potencia}" min="1" max="99999" title="Potência em Watts">
        <input type="number" data-bq="${i}" placeholder="Qtd" value="${item.qtd}" min="1" max="99" title="Quantidade">
        <input type="number" data-bh="${i}" placeholder="h" value="${item.horas}" min="0.5" max="${autonomiaHoras}" step="0.5" title="Horas de uso">

  $('#batCalcularBtn').addEventListener('click', ()=>{
    $('#batAlertaSemCarga').style.display = 'none';
    let cargas = [];

    BAT_EQUIPAMENTOS.forEach((eq,i)=>{
      const chk = $(`#batChk_${i}`);
      if(!chk.checked) return;
      const qty = parseInt($(`#batQty_${i}`).textContent)||0;
      const pot = parseFloat($(`#batPot_${i}`).value)||0;
      const hor = parseFloat($(`#batHor_${i}`).value)||0;
      if(qty>0 && pot>0 && hor>0) cargas.push({ nome:eq.nome, icon:eq.icon, qtd:qty, potencia:pot, horas:hor });
    });

    customItems.forEach((_,i)=>{
      const nome = customContainer.querySelector(`[data-bn="${i}"]`)?.value || 'Equipamento personalizado';
      const pot  = parseFloat(customContainer.querySelector(`[data-bp="${i}"]`)?.value)||0;
      const qtd  = parseInt(customContainer.querySelector(`[data-bq="${i}"]`)?.value)||1;
      const hor  = parseFloat(customContainer.querySelector(`[data-bh="${i}"]`)?.value)||0;
      if(pot>0 && hor>0) cargas.push({ nome, icon:'🔌', qtd, potencia:pot, horas:hor });
    });

    if(cargas.length === 0){
      $('#batAlertaSemCarga').style.display = 'block';
      return;
    }

    let totalWh = 0;
    cargas.forEach(c=> totalWh += c.qtd*c.potencia*c.horas);

    const fatorSeguranca = 1.20; // perdas + temperatura + derating
    const dod = 0.80;            // profundidade de descarga (baterias de lítio)
    const energiaCorrigida = (totalWh*fatorSeguranca)/dod;
    const capacidadeBateriaWh = BAT_CAPACIDADE_UNIDADE*1000;
    const numBaterias = Math.ceil(energiaCorrigida/capacidadeBateriaWh);
    const capacidadeTotal = numBaterias*BAT_CAPACIDADE_UNIDADE;

    $('#batResEnergia').textContent = (energiaCorrigida/1000).toFixed(2);
    $('#batResBaterias').textContent = numBaterias;
    $('#batResCapacidade').textContent = capacidadeTotal;

    const detBody = $('#batDetalheBody');
    detBody.innerHTML = cargas.map(c=>{
      const consumo = c.qtd*c.potencia*c.horas;
      return `<tr><td>${c.icon} ${esc(c.nome)}</td><td style="text-align:center">${c.qtd}</td>
        <td style="text-align:center">${c.potencia}</td><td style="text-align:center">${c.horas}h</td>
        <td style="text-align:right">${consumo.toFixed(0)} Wh</td></tr>`;
    }).join('') + `<tr class="total"><td colspan="4" style="text-align:right;padding-right:16px">Consumo bruto total</td><td style="text-align:right">${totalWh.toFixed(0)} Wh</td></tr>`;

    $('#batNotaBox').innerHTML = `<strong>📐 Metodologia de cálculo:</strong><br>
      Consumo bruto: <strong>${totalWh.toFixed(0)} Wh</strong> &nbsp;|&nbsp;
      Fator de segurança: <strong>+20%</strong> (perdas + temperatura) &nbsp;|&nbsp;
      DOD (profundidade de descarga): <strong>80%</strong> (baterias de lítio) &nbsp;|&nbsp;
      Energia necessária líquida: <strong>${(energiaCorrigida/1000).toFixed(2)} kWh</strong><br>
      Autonomia configurada: <strong>${autonomiaHoras}h</strong> &nbsp;|&nbsp; Capacidade por bateria: <strong>${BAT_CAPACIDADE_UNIDADE} kWh</strong>`;

    ultimoCalculo = { cargas, totalWh, energiaCorrigida, numBaterias, capacidadeTotal, autonomiaHoras };

    $('#batResultadoWrap').style.display = '';
    $('#batResultadoWrap').scrollIntoView({behavior:'smooth', block:'start'});
  });

  // ── Limpar ──
  $('#batLimparBtn').addEventListener('click', async ()=>{
    if(!await confirmDel('Deseja limpar todos os dados preenchidos?')) return;
    autonomiaHoras = 6;
    customItems = [];
    ultimoCalculo = null;
    renderBaterias();
  });

  // ── PDF ──
  $('#batPdfBtn').addEventListener('click', ()=>{
    if(!ultimoCalculo) return;
    const cliente = $('#content [name="bat_nome"]')?.value || '';
    const cidade  = $('#content [name="bat_cidade"]')?.value || '';
    abrirBateriaPDF(ultimoCalculo, cliente, cidade, true);
  });
}

async function renderCustoPorProjeto(){
  await Promise.all([loadTable('comissoes'), loadTable('contratos'), loadTable('financeiro_despesas'), loadTable('financeiro_receitas')]);
  const contratos = (State.contratos||[]).filter(c=>c.status==='assinado');
  const fR = v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  $('#pageActions').innerHTML = `<button class="btn btn-secondary" id="relComissaoPDFBtn">📄 Relatório PDF</button>`;
  $('#relComissaoPDFBtn').addEventListener('click', ()=> gerarRelatorioComissoesPDF());
  $('#content').innerHTML = `
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Cliente</th><th>Valor Contrato</th><th>Total Custos</th><th>Receita</th><th>Margem</th><th></th></tr></thead>
      <tbody>
        ${contratos.length ? contratos.map(c=>{
          const desp = (State.despesas||[]).filter(d=>String(d.contrato_id)===String(c.id));
          const rec  = (State.receitas||[]).filter(r=>String(r.contrato_id)===String(c.id));
          const com  = (State.comissoes||[]).find(x=>(x.nome||'').toLowerCase().trim()===(c.nome||'').toLowerCase().trim());
          const totalDesp = desp.reduce((s,d)=>s+(Number(d.valor)||0),0) + (com ? Number(com.total_saidas)||0 : 0);
          const totalRec  = rec.reduce((s,r)=>s+(Number(r.valor)||0),0) || Number(c.valor)||0;
          const margem    = totalRec - totalDesp;
          const mColor    = margem>=0?'#16a34a':'#dc2626';
          return `<tr style="cursor:pointer" data-proj-id="${c.id}" data-proj-nome="${esc(c.nome||'')}">
            <td><strong>${esc(c.nome||'')}</strong></td>
            <td>${fR(c.valor)}</td>
            <td style="color:#dc2626">${fR(totalDesp)}</td>
            <td style="color:#16a34a">${fR(totalRec)}</td>
            <td style="color:${mColor};font-weight:700">${fR(margem)}</td>
            <td><button class="btn btn-sm btn-primary" data-abrir="${c.id}">Abrir</button></td>
          </tr>`;
        }).join('') : `<tr><td colspan="6" class="empty">Nenhum contrato assinado.</td></tr>`}
      </tbody>
    </table></div></div>
  `;
  $$('[data-abrir]').forEach(b=>{
    const c = contratos.find(x=>String(x.id)===b.dataset.abrir);
    b.addEventListener('click', e=>{ e.stopPropagation(); openProjetoFinanceiroModal(c.id, c.nome||''); });
  });
  $$('[data-proj-id]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const c = contratos.find(x=>String(x.id)===tr.dataset.projId);
      if(c) openProjetoFinanceiroModal(c.id, c.nome||'');
    });
  });
}

async function renderComissoes(){ renderCustoPorProjeto(); }

function gerarRelatorioComissoesPDF(){
  const comissoes = State.comissoes || [];
  const contratos = (State.contratos || []).filter(c=>c.status==='assinado');
  const fR = v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = (v,base)=> base ? ' ('+(((Number(v)||0)/(Number(base)||1))*100).toFixed(1)+'%)' : '';
  const hoje = new Date().toLocaleDateString('pt-BR');

  // Agrupa linhas de comissão por pessoa
  const porPessoa = {};
  comissoes.forEach(com=>{
    const _vc   = Number(com.valor_contrato||0);
    const _vv   = Number(com.valor_vendido||0) || _vc;
    const _obra = com.obra_ativo ? Number(com.obra_val||0) : 0;
    const _pres = com.pres_ativo ? Number(com.pres_val||0) : 0;
    const _ind  = com.ind_ativo  ? Number(com.ind_val||0)  : 0;
    const _vend_base = _vc * (Number(com.vend_pct)||0) / 100;
    const _base_maj  = _vv - _vc - _obra - _pres - _ind;
    const _major_val = Math.max(0, _base_maj) * (Number(com.vend_major_pct)||0) / 100;

    const linhas = [];
    if(_vend_base)                     linhas.push({ tipo:'Comissão Vendedor', val:_vend_base, nome:com.vend_nome||'Vendedor', cliente:com.nome, status:com.status });
    if(_major_val)                     linhas.push({ tipo:'Majorado',          val:_major_val, nome:com.vend_nome||'Vendedor', cliente:com.nome, status:com.status });
    if(Number(com.sup_val))            linhas.push({ tipo:'Supervisor',        val:Number(com.sup_val), nome:com.sup_nome||'Supervisor', cliente:com.nome, status:com.status });
    if(com.sdr_ativo&&Number(com.sdr_val)) linhas.push({ tipo:'SDR',          val:Number(com.sdr_val), nome:com.sdr_nome||'SDR', cliente:com.nome, status:com.status });
    if(com.cap_ativo&&Number(com.cap_val)) linhas.push({ tipo:'Captador',     val:Number(com.cap_val), nome:com.cap_nome||'Captador', cliente:com.nome, status:com.status });

    linhas.forEach(l=>{
      const key = l.nome.trim().toLowerCase();
      if(!porPessoa[key]) porPessoa[key] = { nome:l.nome, itens:[], total:0, pago:0, pendente:0 };
      porPessoa[key].itens.push(l);
      porPessoa[key].total += l.val;
      if(l.status==='paga') porPessoa[key].pago += l.val;
      else porPessoa[key].pendente += l.val;
    });
  });

  const pessoas = Object.values(porPessoa).sort((a,b)=>b.total-a.total);
  const totalGeral = pessoas.reduce((s,p)=>s+p.total,0);
  const totalPago  = pessoas.reduce((s,p)=>s+p.pago,0);
  const totalPend  = pessoas.reduce((s,p)=>s+p.pendente,0);

  const statusBadge = s => {
    const map = { paga:'#16a34a', pendente:'#d97706', aprovada:'#2563eb', cancelada:'#9ca3af' };
    return `<span style="background:${map[s]||'#6b7280'}20;color:${map[s]||'#6b7280'};border:1px solid ${map[s]||'#6b7280'}40;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;text-transform:uppercase">${s||'—'}</span>`;
  };

  const pessoasSecs = pessoas.map(p=>`
    <div style="margin-bottom:28px;page-break-inside:avoid">
      <div style="display:flex;align-items:center;justify-content:space-between;background:#1a3a5c;color:#fff;padding:8px 14px;border-radius:6px 6px 0 0">
        <span style="font-weight:700;font-size:14px">👤 ${p.nome}</span>
        <span style="font-size:13px">${fR(p.total)}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="background:#f1f5f9">
            <th style="text-align:left;padding:6px 10px;border-bottom:1px solid #e2e8f0">Cliente</th>
            <th style="text-align:left;padding:6px 10px;border-bottom:1px solid #e2e8f0">Tipo</th>
            <th style="text-align:right;padding:6px 10px;border-bottom:1px solid #e2e8f0">Valor</th>
            <th style="text-align:center;padding:6px 10px;border-bottom:1px solid #e2e8f0">Status</th>
          </tr>
        </thead>
        <tbody>
          ${p.itens.map((it,i)=>`
          <tr style="background:${i%2?'#f8fafc':'#fff'}">
            <td style="padding:6px 10px;border-bottom:1px solid #f1f5f9">${it.cliente||'—'}</td>
            <td style="padding:6px 10px;border-bottom:1px solid #f1f5f9;color:#64748b">${it.tipo}</td>
            <td style="padding:6px 10px;border-bottom:1px solid #f1f5f9;text-align:right;font-weight:600;color:#dc2626">${fR(it.val)}</td>
            <td style="padding:6px 10px;border-bottom:1px solid #f1f5f9;text-align:center">${statusBadge(it.status)}</td>
          </tr>`).join('')}
          <tr style="background:#fef9f0">
            <td colspan="2" style="padding:6px 10px;font-weight:700;font-size:11px;color:#92400e">SUBTOTAL</td>
            <td style="padding:6px 10px;text-align:right;font-weight:700;color:#92400e">${fR(p.total)}</td>
            <td style="padding:6px 10px;text-align:center;font-size:11px;color:#64748b">
              <span style="color:#16a34a">Pago: ${fR(p.pago)}</span> &nbsp;
              <span style="color:#d97706">Pend: ${fR(p.pendente)}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>`).join('');

  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Relatório de Comissões — SER Energia</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;background:#fff;padding:32px}
    .print-bar{position:fixed;top:0;left:0;right:0;background:#1a3a5c;color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;z-index:999;font-size:13px}
    .print-bar button{background:#f59e0b;color:#1a3a5c;border:none;border-radius:6px;padding:6px 16px;font-weight:700;cursor:pointer;font-size:13px}
    .report-body{margin-top:56px}
    @media print{.print-bar{display:none}.report-body{margin-top:0}}
    h1{font-size:22px;color:#1a3a5c;margin-bottom:4px}
    .sub{font-size:13px;color:#64748b;margin-bottom:24px}
    .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
    .summary-card{border-radius:8px;padding:16px;text-align:center}
    .summary-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600}
    .summary-card .value{font-size:20px;font-weight:800}
    @media print{body{padding:16px}h1{font-size:18px}}
  </style>
  </head><body>
  <div class="print-bar">
    <span>SER Energia Renovável — Relatório de Comissões</span>
    <button onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  </div>
  <div class="report-body">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px">
      <div>
        <h1>Relatório de Comissões</h1>
        <div class="sub">Gerado em ${hoje} &nbsp;·&nbsp; ${comissoes.length} contrato${comissoes.length!==1?'s':''} &nbsp;·&nbsp; ${pessoas.length} colaborador${pessoas.length!==1?'es':''}</div>
      </div>
      <div style="text-align:right;font-size:11px;color:#94a3b8;font-weight:600;letter-spacing:.5px">SER ENERGIA RENOVÁVEL</div>
    </div>

    <div class="summary-grid">
      <div class="summary-card" style="background:#eff6ff;border:1px solid #bfdbfe">
        <div class="label" style="color:#1d4ed8">Total Comissões</div>
        <div class="value" style="color:#1d4ed8">${fR(totalGeral)}</div>
      </div>
      <div class="summary-card" style="background:#f0fdf4;border:1px solid #bbf7d0">
        <div class="label" style="color:#15803d">Total Pago</div>
        <div class="value" style="color:#15803d">${fR(totalPago)}</div>
      </div>
      <div class="summary-card" style="background:#fffbeb;border:1px solid #fde68a">
        <div class="label" style="color:#b45309">Total Pendente</div>
        <div class="value" style="color:#b45309">${fR(totalPend)}</div>
      </div>
    </div>

    ${pessoas.length ? pessoasSecs : '<p style="color:#94a3b8;text-align:center;padding:40px">Nenhuma comissão lançada.</p>'}

    <div style="margin-top:32px;padding-top:16px;border-top:2px solid #1a3a5c;display:flex;justify-content:space-between;font-size:12px;color:#64748b">
      <span>SER Energia Renovável</span>
      <span>Relatório gerado automaticamente pelo SER Hub</span>
    </div>
  </div>
  <script>window.onload=()=>{};<\/script>
  </body></html>`);
  w.document.close();
}

function openComissaoModal(item=null, nomePreenchido=null){
  const isNew = !item;
  item = item || {};
  if(nomePreenchido && isNew) item = { ...item, nome: nomePreenchido };
  const statusOpts = [['pendente','Pendente'],['aprovada','Aprovada'],['paga','Paga'],['cancelada','Cancelada']];

  // Listas por perfil vindas de State.perfis
  const perfisAtivos = (State.perfis||[]).filter(p=>p.ativo!==false && p.nome);
  const nomesPorPerfil = perfil => ['',  ...perfisAtivos.filter(p=>p.perfil===perfil).map(p=>p.nome)];
  const selectOpts    = perfil => nomesPorPerfil(perfil).map(n=>n?[n,n]:['','— selecione —']);

  // Contratos assinados para busca de cliente e auto-preenchimento de valor
  const contratosAssinados = (State.contratos||[]).filter(c=>c.status==='assinado');
  const clientesDL = [...new Set(contratosAssinados.map(c=>c.nome).filter(Boolean))];

  openModal(`
    <div class="modal-header"><h2>${isNew?'Nova Comissão':'Editar Comissão'}</h2><button class="modal-close">×</button></div>
    <form id="comForm">
      <div class="modal-body">
        <div class="form-grid">
          ${formField({label:'Cliente',name:'nome',value:item.nome,required:true,datalist:clientesDL})}
          ${formField({label:'Valor Referência',name:'valor_contrato',type:'number',value:item.valor_contrato,required:true})}
          ${formField({label:'Valor Vendido (R$)',name:'valor_vendido',type:'number',value:item.valor_vendido,readonly:true})}
          ${formField({label:'Status',name:'status',type:'select',value:item.status||'pendente',options:statusOpts})}
        </div>
        <div class="section"><div class="section-header"><h4>Vendedor</h4><span class="section-toggle">▼</span></div>

            ${formField({label:'Nome',name:'vend_nome',type:'select',value:item.vend_nome||'',options:selectOpts('vendedor')})}
            ${formField({label:'%',name:'vend_pct',type:'number',value:item.vend_pct})}
            ${formField({label:'% Major',name:'vend_major_pct',type:'number',value:item.vend_major_pct})}
          </div></div>
        </div>
        <div class="section"><div class="section-header"><h4>Supervisor</h4><span class="section-toggle">▼</span></div>

            ${formField({label:'%',name:'sup_pct',type:'number',value:item.sup_pct})}
          </div></div>
        </div>
        <div class="section collapsed"><div class="section-header"><h4>SDR / Captador / Indicador</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'SDR ativo',name:'sdr_ativo',type:'toggle',value:item.sdr_ativo})}
            ${formField({label:'SDR nome',name:'sdr_nome',type:'select',value:item.sdr_nome||'',options:selectOpts('sdr')})}
            ${formField({label:'SDR %',name:'sdr_pct',type:'number',value:item.sdr_pct})}
            ${formField({label:'Captador ativo',name:'cap_ativo',type:'toggle',value:item.cap_ativo})}
            ${formField({label:'Captador nome',name:'cap_nome',type:'select',value:item.cap_nome||'',options:selectOpts('captador')})}

        <div id="comPreview" class="preview-box"></div>
      </div>
      <div class="modal-footer">
        ${!isNew?`<button type="button" class="btn btn-danger" id="delComBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
      </div>
    </form>
  `,'lg');

  const form = $('#comForm');

  const logisticasAll = State.logistica || [];

  // Preenche valor_vendido (readonly) com contrato.valor e valor_contrato com kit*2.5 (se vazio)
  const applyAutoFill = (contrato) => {
    if(!contrato) return;
    if(contrato.valor) form.elements['valor_vendido'].value = fmtInputNum(contrato.valor);
    if(!Number(parseBR(form.elements['valor_contrato'].value))){
      const log = logisticasAll.find(l=>String(l.contrato_id)===String(contrato.id));
      if(log?.valor_compra) form.elements['valor_contrato'].value = fmtInputNum(Number(log.valor_compra)*2.5);
    }
    recalc();
  };

  // Ao abrir: preenche a partir do contrato vinculado
  if(item.contrato_id){
    applyAutoFill(contratosAssinados.find(c=>c.id===item.contrato_id));
  } else if(item.nome){
    applyAutoFill(contratosAssinados.find(c=>(c.nome||'').toLowerCase()===item.nome.trim().toLowerCase()));
  }

  // Auto-preenche Valor Vendido com o valor do contrato ao digitar/selecionar o cliente
  form.elements['nome'].addEventListener('change', ()=>{
    applyAutoFill(contratosAssinados.find(c=>(c.nome||'').toLowerCase()===form.elements['nome'].value.trim().toLowerCase()));
  });
  form.elements['nome'].addEventListener('input', ()=>{
    const contrato = contratosAssinados.find(c=>(c.nome||'').toLowerCase()===form.elements['nome'].value.trim().toLowerCase());
    applyAutoFill(contrato);
  });

  function recalc(){
    const raw = readForm(form);
    const vc  = Number(raw.valor_contrato)||0;
    const vv  = Number(raw.valor_vendido)||0;
    const vp  = Number(raw.vend_pct)||0;
    const vmp = Number(raw.vend_major_pct)||0;
    const sup_val  = vc * ((Number(raw.sup_pct)||0)/100);
    const sdr_val  = raw.sdr_ativo ? vc*((Number(raw.sdr_pct)||0)/100) : 0;
    const cap_val  = raw.cap_ativo ? vc*((Number(raw.cap_pct)||0)/100) : 0;
    const ind_val  = raw.ind_ativo ? (Number(raw.ind_val)||0) : 0;
    const obra_val = raw.obra_ativo ? (Number(raw.obra_val)||0) : 0;
    const pres_val = raw.pres_ativo ? (Number(raw.pres_val)||0) : 0;
    // Majorado: (valor_vendido − valor_referencia − obra − presente − indicador) × % majorado, mínimo R$ 0
    const base_major = vv - vc - obra_val - pres_val - ind_val;
    const major_val  = Math.max(0, base_major) * (vmp/100);
    const vend_base  = vc * (vp/100);
    const vend_val   = vend_base + major_val;
    const total = vend_val + sup_val + sdr_val + cap_val + ind_val + obra_val + pres_val;
    const lucro = vc - total;
    $('#comPreview').innerHTML = `
      <div class="preview-row"><span>Comissão Vendedor</span><span>${fmtBRL(vend_base)}</span></div>
      ${major_val>0?`<div class="preview-row"><span>Majorado Vendedor</span><span>${fmtBRL(major_val)}</span></div>`:''}
      <div class="preview-row"><span>Supervisor</span><span>${fmtBRL(sup_val)}</span></div>
      <div class="preview-row"><span>SDR</span><span>${fmtBRL(sdr_val)}</span></div>
      <div class="preview-row"><span>Captador</span><span>${fmtBRL(cap_val)}</span></div>
      <div class="preview-row"><span>Indicador</span><span>${fmtBRL(ind_val)}</span></div>
      <div class="preview-row"><span>Obra</span><span>${fmtBRL(obra_val)}</span></div>
      <div class="preview-row"><span>Presente</span><span>${fmtBRL(pres_val)}</span></div>
      <div class="preview-row"><span>Total saídas</span><span>${fmtBRL(total)}</span></div>
      <div class="preview-row"><span>Lucro Líquido</span><span>${fmtBRL(lucro)}</span></div>
    `;
    return { vend_val, vend_base, major_val, sup_val, sdr_val, cap_val, ind_val, total_saidas:total, lucro_liquido:lucro };
  }
  form.addEventListener('input', recalc);
  recalc();

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    const calc = recalc();
    Object.assign(data, calc);
    ['valor_contrato','valor_vendido','vend_pct','vend_major_pct','vend_base','major_val','sup_pct','sdr_pct','cap_pct','ind_val','obra_val','pres_val'].forEach(k=>{ data[k] = data[k]!=null ? Number(data[k]) : null; });
    if(isNew){
      data.criado_por = State.user?.id;
      const { data: criada, error } = await supa.from('comissoes').insert(data).select('id').single();
      if(error) return toast(error.message,'error');
      await sincronizarDespesaComissao(criada.id, data);
    } else {
      const { error } = await supa.from('comissoes').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
      await sincronizarDespesaComissao(item.id, data);
    }
    toast('Salvo','success'); closeModal(); renderComissoes();
  });
  $('#delComBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir comissão?')) return;
    await supa.from('financeiro_despesas').delete().eq('comissao_id', item.id);
    await supa.from('comissoes').delete().eq('id',item.id);
    toast('Excluído','success'); closeModal(); renderComissoes();
  });
}

async function sincronizarReceitaRepasse(logisticaId, log){
  if(!log.valor_repasse || Number(log.valor_repasse) <= 0){
    // Se não há repasse, remove eventual receita anterior vinculada
    await supa.from('financeiro_receitas').delete().eq('logistica_id', logisticaId);
    return;
  }
  const receita = {
    descricao: `Repasse – ${log.distribuidora||log.nome||''}`,
    valor: Number(log.valor_repasse),
    categoria: 'repasse',
    status: 'pendente',
    logistica_id: logisticaId
  };
  const { data: existente } = await supa.from('financeiro_receitas')
    .select('id').eq('logistica_id', logisticaId).maybeSingle();
  if(existente){
    await supa.from('financeiro_receitas').update(receita).eq('id', existente.id);
  } else {
    receita.criado_por = State.user?.id;
    await supa.from('financeiro_receitas').insert(receita);
  }
}

async function sincronizarDespesaComissao(comissaoId, com){
  const statusMap = { pendente:'pendente', aprovada:'pendente', paga:'pago', cancelada:'cancelado' };
  const despesa = {
    descricao: `Comissão – ${com.nome||''}`,
    valor: Number(com.total_saidas)||0,
    categoria: 'comissao',
    status: statusMap[com.status] || 'pendente',
    comissao_id: comissaoId,
    obs: com.vend_nome ? `Vendedor: ${com.vend_nome}` : null
  };
  const { data: existente } = await supa.from('financeiro_despesas')
    .select('id').eq('comissao_id', comissaoId).maybeSingle();
  if(existente){
    await supa.from('financeiro_despesas').update(despesa).eq('id', existente.id);
  } else {
    despesa.criado_por = State.user?.id;
    await supa.from('financeiro_despesas').insert(despesa);
  }
}

/* ============================================================
   DESPESAS PADRÃO EM LOTE
   ============================================================ */
async function openDespesasPadraoModal(){
  await Promise.all([
    loadTable('contratos'), loadTable('vistorias'), loadTable('instalacoes'),
    loadTable('homologacoes'), loadTable('financeiro_despesas'), loadTable('logistica')
  ]);

  const despesas    = State.despesas || [];
  const contratos   = (State.contratos || []).filter(c => c.status !== 'cancelado');
  const vistorias   = State.vistorias   || [];
  const instalacoes = State.instalacoes || [];
  const logisticas  = State.logistica   || [];

  // Valor vistoria por resultado
  function valorVistoria(resultado){
    const map = {
      aprovado: 120, aprovado_com_obra: 120,
      aprovado_com_sombreamento: 150,
      aprovado_com_obra_e_sombreamento: 120,
      reprovado: 120
    };
    return map[resultado] || null;
  }

  // Valor instalação por kWp
  function valorInstalacao(kwp){
    const k = Number(kwp) || 0;
    if(!k) return null;
    if(k <= 4.5)  return parseFloat((k * 500).toFixed(2));
    if(k <= 6.5)  return parseFloat((k * 450).toFixed(2));
    if(k <= 10)   return parseFloat((k * 380).toFixed(2));
    if(k <= 15)   return parseFloat((k * 350).toFixed(2));
    return parseFloat((k * 320).toFixed(2));
  }

  // Verifica se já existe despesa com essa descrição no contrato
  function temDesp(contratoId, desc){
    return despesas.some(d =>
      String(d.contrato_id) === String(contratoId) &&
      (d.descricao||'').toLowerCase().includes(desc.toLowerCase())
    );
  }

  // Monta lista de pendências por contrato
  const pendencias = [];
  for(const c of contratos){
    const cid = c.id;
    const vis = vistorias.find(v => String(v.contrato_id) === String(cid) || String(v.proposta_id) === String(c.proposta_id));
    const inst = instalacoes.find(i => String(i.contrato_id) === String(cid));
    const rows = [];

    if(!temDesp(cid, 'taxa trt'))
      rows.push({ descricao:'Taxa TRT', recebedor:'Crea', valor:68.17, categoria:'homologacao' });
    if(!temDesp(cid, 'homologação') && !temDesp(cid, 'homologacao'))
      rows.push({ descricao:'Homologação', recebedor:'Michel Darlan Britto da Silva', valor:300, categoria:'homologacao' });

    if(vis && vis.resultado){
      const vVal = valorVistoria(vis.resultado);
      if(vVal && !temDesp(cid, 'parecer') && !temDesp(cid, 'vistoria'))
        rows.push({ descricao:'Parecer Final da Vistoria', recebedor:'Paulo Adriano - Vistoria', valor:vVal, categoria:'vistoria', _info: vis.resultado });
    }

    const kwp = inst?.kwp || c.kwp;
    if(kwp && !temDesp(cid, 'instalação') && !temDesp(cid, 'instalacao')){
      const iVal = valorInstalacao(kwp);
      if(iVal)
        rows.push({ descricao:'Instalação', recebedor:'Instalação - Paulo Oliveira', valor:iVal, categoria:'instalacao', _info:`${kwp} kWp` });
    }

    // Kit Solar — só aparece se logística tem valor_compra e não há despesa de kit
    const log = logisticas.find(l => String(l.contrato_id) === String(cid));
    if(log?.valor_compra && !temDesp(cid, 'kit')){
      rows.push({ descricao:'Kit Solar', recebedor: log.distribuidora || '', valor: Number(log.valor_compra), categoria:'kit', _info: log.distribuidora||'' });
    }

    if(rows.length) pendencias.push({ contrato: c, rows });
  }

  if(!pendencias.length){
    toast('Todos os contratos já têm as despesas padrão preenchidas ✓','success');
    return;
  }

  const fR = v => 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2});

  openModal(`
    <div class="modal-header">
      <h2>📋 Despesas Padrão em Lote</h2>
      <button class="modal-close">×</button>
    </div>
    <div class="modal-body" style="padding:0">
      <p style="padding:12px 20px 8px;font-size:13px;color:#555;margin:0">
        Contratos com despesas padrão faltando. Marque os que deseja preencher e clique em <strong>Aplicar</strong>.
      </p>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr style="background:#f5f0fc;text-align:left">
              <th style="padding:8px 12px"><input type="checkbox" id="dpSelectAll" title="Selecionar todos"></th>
              <th style="padding:8px 12px">Cliente</th>
              <th style="padding:8px 12px">Despesas a inserir</th>
              <th style="padding:8px 12px;text-align:right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${pendencias.map((p,i) => `
              <tr style="border-top:1px solid #eee;vertical-align:top" data-idx="${i}">
                <td style="padding:8px 12px"><input type="checkbox" class="dp-chk" value="${i}" checked></td>
                <td style="padding:8px 12px;font-weight:600;color:#1a0a2e">${esc(p.contrato.nome||p.contrato.cliente||'—')}</td>
                <td style="padding:8px 12px">
                  ${p.rows.map(r=>`<div style="margin-bottom:3px">
                    <span style="display:inline-block;background:#e9d5ff;color:#4c1d95;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-right:4px">${r.categoria}</span>
                    ${esc(r.descricao)} — <em>${esc(r.recebedor)}</em> — <strong>${fR(r.valor)}</strong>
                    ${r._info?`<span style="color:#6b7280;font-size:10px"> (${esc(r._info)})</span>`:''}
                  </div>`).join('')}
                </td>
                <td style="padding:8px 12px;text-align:right;font-weight:700;color:#4B0082">
                  ${fR(p.rows.reduce((s,r)=>s+r.valor,0))}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <span id="dpCount" style="font-size:12px;color:#555">${pendencias.length} contrato(s) selecionado(s)</span>
      <button class="btn btn-secondary modal-close">Cancelar</button>
      <button class="btn btn-primary" id="dpAplicarBtn">Aplicar</button>
    </div>
  `, 'lg');

  // Select all toggle
  const selAll = $('#dpSelectAll');
  const updateCount = () => {
    const n = document.querySelectorAll('.dp-chk:checked').length;
    $('#dpCount').textContent = `${n} contrato(s) selecionado(s)`;
  };
  selAll.addEventListener('change', () => {
    document.querySelectorAll('.dp-chk').forEach(c => c.checked = selAll.checked);
    updateCount();
  });
  document.querySelectorAll('.dp-chk').forEach(c => c.addEventListener('change', updateCount));

  $('#dpAplicarBtn').addEventListener('click', async () => {
    const selecionados = [...document.querySelectorAll('.dp-chk:checked')].map(c => pendencias[Number(c.value)]);
    if(!selecionados.length){ toast('Nenhum contrato selecionado','info'); return; }

    const btn = $('#dpAplicarBtn');
    btn.disabled = true;
    btn.textContent = 'Aplicando…';

    const inserts = [];
    for(const p of selecionados){
      for(const r of p.rows){
        inserts.push({
          descricao: r.descricao,
          recebedor: r.recebedor,
          valor: r.valor,
          categoria: r.categoria,
          status: 'pendente',
          contrato_id: p.contrato.id,
          criado_por: State.user?.id
        });
      }
    }

    const { error } = await supa.from('financeiro_despesas').insert(inserts);
    if(error){ toast(error.message,'error'); btn.disabled=false; btn.textContent='Aplicar'; return; }

    closeModal();
    toast(`✓ ${inserts.length} despesa(s) inserida(s) em ${selecionados.length} contrato(s)`, 'success', 5000);
    await renderFinanceiro();
  });
}

/* ============================================================
   PROJETO FINANCEIRO
   ============================================================ */
async function openProjetoFinanceiroModal(contratoId, nomeCliente){
  if(!canVerFinanceiro()){ toast('Acesso restrito','error'); return; }
  if(!contratoId){ toast('Contrato não encontrado para este projeto','error'); return; }
  await Promise.all([loadTable('financeiro_receitas'), loadTable('financeiro_despesas'), loadTable('comissoes'), loadTable('contratos')]);

  const voltar = ()=> openProjetoFinanceiroModal(contratoId, nomeCliente);
  const fR = v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const stBadge = s=>{ const m={pendente:'badge-pendente',recebido:'badge-ativo',pago:'badge-ativo',cancelado:'badge-cancelado'}; const l={pendente:'Pendente',recebido:'Recebido',pago:'Pago',cancelado:'Cancelado'}; return `<span class="badge ${m[s]||''}">${l[s]||s}</span>`; };

  const contrato = (State.contratos||[]).find(c=>String(c.id)===String(contratoId));
  const valorContrato = Number(contrato?.valor)||0;

  // Receitas do projeto (contrato_id) + valor do contrato como base
  const rec   = (State.receitas||[]).filter(r=>String(r.contrato_id)===String(contratoId));
  const totalRec = rec.length ? rec.reduce((s,r)=>s+(Number(r.valor)||0),0) : valorContrato;

  // Despesas por categoria
  const despAll = (State.despesas||[]).filter(d=>String(d.contrato_id)===String(contratoId));
  const despPor = cat => despAll.filter(d=>d.categoria===cat);

  // Comissão vinculada pelo nome do cliente
  const comissao = (State.comissoes||[]).find(x=>(x.nome||'').toLowerCase().trim()===(nomeCliente||'').toLowerCase().trim());
  const totalCom = comissao ? Number(comissao.total_saidas)||0 : 0;

  const totalDesp = despAll.reduce((s,d)=>s+(Number(d.valor)||0),0) + totalCom;
  const margem    = totalRec - totalDesp;
  const mColor    = margem>=0?'#16a34a':'#dc2626';

  // % sobre receita
  const pct = v => totalRec > 0 ? `<span style="font-size:11px;color:var(--text-light);margin-left:4px">${((Number(v)||0)/totalRec*100).toFixed(1)}%</span>` : '';

  // Helper: renderiza linha de despesa
  const rowDesp = (d,cat)=>`<tr>
    <td>${esc(d.descricao||'')}</td>
    <td>${esc(d.recebedor||'')}</td>
    <td style="text-align:right;font-weight:600;color:#dc2626;white-space:nowrap">${fR(d.valor)}${pct(d.valor)}</td>
    <td>${stBadge(d.status)}</td>
    <td><button class="btn btn-sm btn-secondary" data-ed="${d.id}" data-cat="${cat}">✏️</button></td>
  </tr>`;

  // Helper: bloco de seção de custo
  const totalSec = itens => itens.reduce((s,d)=>s+(Number(d.valor)||0),0);
  const secDesp = (id, icon, label, cat, itens)=>{
    const tot = totalSec(itens);
    const cabeca = tot>0 ? `<span style="font-size:12px;color:#dc2626;font-weight:600">${fR(tot)}${pct(tot)}</span>` : '';
    return `<div style="margin-bottom:18px" id="sec-${id}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <h4 style="margin:0;font-size:14px">${icon} ${label} ${cabeca}</h4>
        <button class="btn btn-sm btn-secondary" data-add-cat="${cat}">+ Lançar</button>
      </div>
      ${itens.length
        ? `<div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Recebedor</th><th>Valor / %</th><th>Status</th><th></th></tr></thead><tbody>${itens.map(d=>rowDesp(d,cat)).join('')}</tbody></table></div>`
        : `<p style="color:var(--text-light);font-size:12px;margin:0 0 4px">Nenhum lançamento.</p>`}
    </div>`;
  };

  openModal(`
    <div class="modal-header">
      <h2>💰 ${esc(nomeCliente)}</h2>
      <button class="modal-close">×</button>
    </div>
    <div class="modal-body" style="padding:16px 22px">
      <!-- Resumo -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:10px;color:#166534;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Receita</div>
          <div style="font-size:18px;font-weight:700;color:#16a34a;margin-top:4px">${fR(totalRec)}</div>
        </div>
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:10px;color:#991b1b;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Custos</div>
          <div style="font-size:18px;font-weight:700;color:#dc2626;margin-top:4px">${fR(totalDesp)} ${pct(totalDesp)}</div>
        </div>
        <div style="background:${margem>=0?'#f0fdf4':'#fef2f2'};border:1px solid ${margem>=0?'#bbf7d0':'#fecaca'};border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:10px;color:${mColor};font-weight:700;text-transform:uppercase;letter-spacing:.5px">Margem</div>
          <div style="font-size:18px;font-weight:700;color:${mColor};margin-top:4px">${fR(margem)} ${pct(margem)}</div>
        </div>
      </div>
      <!-- Barra de composição dos custos -->
      ${(()=>{
        const segs = [
          { label:'Kit',         val: despPor('kit').reduce((s,d)=>s+(Number(d.valor)||0),0),        cor:'#7c3aed' },
          { label:'Comissões',   val: totalCom,                                                       cor:'#db2777' },
          { label:'Vistoria',    val: despPor('vistoria').reduce((s,d)=>s+(Number(d.valor)||0),0),   cor:'#0891b2' },
          { label:'Instalação',  val: despPor('instalacao').reduce((s,d)=>s+(Number(d.valor)||0),0), cor:'#d97706' },
          { label:'Homologação', val: despPor('homologacao').reduce((s,d)=>s+(Number(d.valor)||0),0),cor:'#059669' },
          { label:'Maquininha',  val: despPor('maquininha').reduce((s,d)=>s+(Number(d.valor)||0),0), cor:'#64748b' },
          { label:'Extras',      val: despPor('extras').reduce((s,d)=>s+(Number(d.valor)||0),0),     cor:'#92400e' },
        ].filter(s=>s.val>0);
        const margemSeg = { label:'Margem', val: Math.max(0,margem), cor:'#16a34a' };
        const allSegs = [...segs, margemSeg].filter(s=>s.val>0);
        const base = totalRec > 0 ? totalRec : 1;
        if(!segs.length) return '';
        return `<div style="margin-bottom:20px">
          <div style="display:flex;border-radius:8px;overflow:hidden;height:24px;gap:1px">
            ${allSegs.map(s=>`<div title="${s.label}: ${fR(s.val)} (${(s.val/base*100).toFixed(1)}%)" style="background:${s.cor};flex:${s.val/base};min-width:2px"></div>`).join('')}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
            ${allSegs.map(s=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text)">
              <span style="width:10px;height:10px;border-radius:2px;background:${s.cor};flex-shrink:0"></span>
              ${esc(s.label)} <strong>${(s.val/base*100).toFixed(1)}%</strong>
            </span>`).join('')}
          </div>
        </div>`;
      })()}

      <!-- Seções de custo -->
      ${secDesp('kit','📦','Kit / Equipamentos','kit', despPor('kit'))}

      <!-- Comissões -->
      <div style="margin-bottom:18px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <h4 style="margin:0;font-size:14px">🤝 Comissões</h4>
          <button class="btn btn-sm btn-secondary" id="projComBtn">${comissao?'✏️ Editar':'+ Lançar'}</button>
        </div>
        ${comissao ? (()=>{
          // Recalcula do zero com todos os campos — igual ao recalc() do modal
          const _vc       = Number(comissao.valor_contrato||0);
          const _vv       = Number(comissao.valor_vendido||0) || _vc;
          const _obra     = comissao.obra_ativo ? Number(comissao.obra_val||0) : 0;
          const _pres     = comissao.pres_ativo ? Number(comissao.pres_val||0) : 0;
          const _ind      = comissao.ind_ativo  ? Number(comissao.ind_val||0)  : 0;
          const _vend_base = _vc * (Number(comissao.vend_pct)||0) / 100;
          const _base_maj  = _vv - _vc - _obra - _pres - _ind;
          const _major_val = Math.max(0, _base_maj) * (Number(comissao.vend_major_pct)||0) / 100;
          const linhas = [];
          if(_vend_base) linhas.push([comissao.vend_nome||'Vendedor','Comissão Vendedor',_vend_base]);
          if(_major_val) linhas.push([comissao.vend_nome||'Vendedor','Majorado',_major_val]);
          if(Number(comissao.sup_val))   linhas.push([comissao.sup_nome||'Supervisor','Supervisor',comissao.sup_val]);
          if(comissao.sdr_ativo && Number(comissao.sdr_val))  linhas.push([comissao.sdr_nome||'SDR','SDR',comissao.sdr_val]);
          if(comissao.cap_ativo && Number(comissao.cap_val))  linhas.push([comissao.cap_nome||'Captador','Captador',comissao.cap_val]);
          if(comissao.ind_ativo && Number(comissao.ind_val))  linhas.push([comissao.ind_nome||'Indicador','Indicador',comissao.ind_val]);
          if(comissao.obra_ativo && Number(comissao.obra_val)) linhas.push(['Obra','Obra',comissao.obra_val]);
          if(comissao.pres_ativo && Number(comissao.pres_val)) linhas.push(['Presente','Presente',comissao.pres_val]);
          const totalComLinhas = linhas.reduce((s,[,,v])=>s+(Number(v)||0),0);
          return `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Valor / %</th><th>Status</th></tr></thead><tbody>
            ${linhas.map(([nome,tipo,val])=>`<tr>
              <td>${esc(nome)}</td>
              <td style="color:var(--text-light);font-size:12px">${esc(tipo)}</td>
              <td style="color:#dc2626;font-weight:600;white-space:nowrap">${fR(val)}${pct(val)}</td>
              <td>${stBadge(comissao.status)}</td>
            </tr>`).join('')}
            <tr style="border-top:2px solid var(--border)">
              <td colspan="2" style="font-weight:600;font-size:12px;color:var(--text-light)">Total comissões</td>
              <td style="color:#dc2626;font-weight:700;white-space:nowrap">${fR(totalComLinhas)}${pct(totalComLinhas)}</td>
              <td></td>
            </tr>
          </tbody></table></div>`;
        })() : `<p style="color:var(--text-light);font-size:12px;margin:0 0 4px">Nenhuma comissão lançada.</p>`}
      </div>

      ${secDesp('vist','🔍','Vistoria','vistoria', despPor('vistoria'))}
      ${secDesp('inst','🔧','Instalação','instalacao', despPor('instalacao'))}
      ${secDesp('hom','📋','Homologação','homologacao', despPor('homologacao'))}
      ${secDesp('maq','💳','Maquininha (taxas)','maquininha', despPor('maquininha'))}
      ${secDesp('ext','➕','Extras','extras', despPor('extras'))}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary modal-close">Fechar</button>
    </div>
  `,'lg');

  // Comissão
  $('#projComBtn')?.addEventListener('click', ()=>{
    if(comissao) openComissaoModal(comissao);
    else openComissaoModal(null, nomeCliente);
  });

  // Botões + Lançar por categoria
  $$('[data-add-cat]').forEach(b=>{
    b.addEventListener('click', ()=> openDespesaModal(null,{ contratoId, categoriaFixa: b.dataset.addCat, onSave: voltar }));
  });

  // Editar despesa existente
  $$('[data-ed]').forEach(b=>{
    const item = despAll.find(d=>String(d.id)===b.dataset.ed);
    b.addEventListener('click', ()=> openDespesaModal(item,{ contratoId, categoriaFixa: b.dataset.cat, onSave: voltar }));
  });

async function downloadBackup(){
  if(!isAdmin()) return toast('Apenas admins podem gerar backup.','error');
  toast('Gerando backup — aguarde...','info',6000);
  const tables=['leads','propostas','vistorias','contratos','logistica','instalacoes',
    'homologacoes','posvenda','remarketing','comissoes','financeiro_receitas',
    'financeiro_despesas','cadastros','perfis','tentativas_contato','metas'];
  const backup={
    gerado_em: new Date().toISOString(),
    gerado_por: State.profile?.email||'?',
    versao:'1.0',
    tabelas:{}
  };
  let allOk=true;
  await Promise.all(tables.map(async t=>{
    try{
      const {data,error}=await supaAdmin.from(t).select('*').order('criado_em',{ascending:true});
      if(error){console.warn('backup',t,error.message);allOk=false;}
      backup.tabelas[t]=data||[];
    }catch(e){backup.tabelas[t]=[];allOk=false;}
  }));
  backup.total_registros=Object.values(backup.tabelas).reduce((s,r)=>s+r.length,0);
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const dt=new Date().toISOString().slice(0,19).replace('T','_').replace(/:/g,'-');
  a.href=url; a.download=`ser-backup-${dt}.json`; a.click();
  URL.revokeObjectURL(url);
  toast(`Backup concluído${allOk?'':' com alertas'}! ${backup.total_registros} registros exportados.`,allOk?'success':'info');
}

async function renderUsuarios(){
  if(!['admin','supervisor'].includes(userRole())){
    $('#content').innerHTML = '<div class="empty">Sem permissão.</div>'; return;
  }
  await loadTable('perfis');
  const items = State.perfis;
  $('#pageActions').innerHTML = isAdmin()
    ? `<button class="btn btn-secondary" id="backupBtn">⬇️ Backup Manual</button>
       <button class="btn btn-primary" id="newUserBtn">+ Novo Usuário</button>`
    : '';
  $('#newUserBtn')?.addEventListener('click', ()=> openUserModal());
  $('#backupBtn')?.addEventListener('click', downloadBackup);
  const tbody = items.length ? items.map((u,i)=>`
    <tr>
      <td>${esc(u.nome||'')}</td>
      <td>${esc(u.email||'')}</td>
      <td><span class="badge">${esc(u.perfil||'')}</span></td>
      <td>${u.ativo?'<span class="badge badge-ativo">Ativo</span>':'<span class="badge badge-inativo">Inativo</span>'}</td>
      <td class="row-actions">
        <button class="btn btn-sm btn-secondary" data-edit="${i}">Editar</button>
        ${isAdmin()?`<button class="btn btn-sm btn-secondary" data-tog="${i}">${u.ativo?'Desativar':'Ativar'}</button>`:''}
        ${isAdmin()?`<button class="btn btn-sm btn-secondary" data-rpwd="${i}">Redefinir senha</button>`:''}
        ${isAdmin()?`<button class="btn btn-sm btn-secondary" data-setpwd="${i}">🔑 Definir senha</button>`:''}
        ${isAdmin()&&u.email!==State.user?.email?`<button class="btn btn-sm btn-danger" data-del="${i}">Excluir</button>`:''}
      </td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">Sem usuários</td></tr>';
  window._usrItems = items;
  $('#content').innerHTML = `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Status</th><th></th></tr></thead>
    <tbody>${tbody}</tbody>
  </table></div></div>`;
  $('#content').addEventListener('click', async e=>{
    const btn = e.target.closest('button[data-edit],button[data-tog],button[data-del],button[data-rpwd],button[data-setpwd]');
    if(!btn) return;
    const ds = btn.dataset;
    if(ds.edit!==undefined){
      const u = window._usrItems[+ds.edit];
      if(!u){ toast('Usuário não encontrado','error'); return; }
      try{ openUserModal(u); } catch(err){ toast('Erro: '+err.message,'error'); }
    } else if(ds.tog!==undefined){
      const u = window._usrItems[+ds.tog]; if(!u) return;
      await supa.from('perfis').update({ ativo:!u.ativo }).eq('email',u.email);
      toast('Status atualizado','success'); renderUsuarios();
    } else if(ds.rpwd!==undefined){
      const u = window._usrItems[+ds.rpwd]; if(!u||!u.email) return;
      const { error } = await supa.auth.resetPasswordForEmail(u.email, { redirectTo: location.origin+location.pathname });
      if(error) toast(error.message,'error');
      else toast(`Reset enviado para ${u.email}`,'success');
    } else if(ds.setpwd!==undefined){
      const u = window._usrItems[+ds.setpwd]; if(!u||!u.email) return;
      const nova = prompt(`Nova senha para ${u.nome||u.email}:\n(mín. 8 caracteres, letras e números, ex: Senha2025)`);
      if(!nova) return;
      if(nova.length < 8){ toast('Senha muito curta — mínimo 8 caracteres.','error'); return; }
      // Busca o id do usuário no auth
      const { data:lista } = await supaAdmin.auth.admin.listUsers({ perPage:1000 });
      const authUser = lista?.users?.find(x=>x.email===u.email);
      if(!authUser){ toast('Usuário não encontrado no sistema de autenticação.','error'); return; }
      const { error } = await supaAdmin.auth.admin.updateUserById(authUser.id, { password: nova });
      if(error) toast(error.message,'error');
      else toast(`Senha de ${u.nome||u.email} atualizada!`,'success');
    } else if(ds.del!==undefined){
      const u = window._usrItems[+ds.del]; if(!u) return;
      if(!await confirmDel(`Excluir "${u.nome||u.email}"?`)) return;
      const { error } = await supa.from('perfis').delete().eq('email',u.email);
      if(error) return toast(error.message,'error');
      toast('Excluído','success'); renderUsuarios();
    }
  });
}

function openUserModal(item=null){
  if(!isAdmin() && item==null){ toast('Apenas admin pode criar usuários.','error'); return; }
  const isNew = !item;
  item = item || {};
  const perfilOpts = [['admin','Admin'],['supervisor','Supervisor'],['vendedor','Vendedor'],['tec_vistoria','Téc. Vistoria'],['tec_instalacao','Téc. Instalação'],['tec_vistoria_instalacao','Téc. Vistoria + Instalação'],['tec_homologacao','Téc. Homologação'],['financeiro','Financeiro']];
  openModal(`
    <div class="modal-header"><h2>${isNew?'Novo Usuário':'Editar Usuário'}</h2><button class="modal-close">×</button></div>
    <form id="userForm"><div class="modal-body"><div class="form-grid">
      ${formField({label:'Nome',name:'nome',value:item.nome,required:true})}
      ${formField({label:'Email',name:'email',type:'email',value:item.email,required:true,readonly:!isNew})}
      ${isNew?formField({label:'Senha (mín. 8 caracteres, letras e números)',name:'password',type:'password',value:'',required:true}):''}
      ${isNew?`<div style="grid-column:1/-1;font-size:11px;color:#888;margin-top:-8px">💡 Ex: <strong>Senha2025</strong> — evite caracteres especiais como @#$%</div>`:''}
      ${formField({label:'Perfil',name:'perfil',type:'select',value:item.perfil||'vendedor',options:perfilOpts})}
      ${formField({label:'CPF',name:'cpf',value:item.cpf||'',placeholder:'000.000.000-00'})}
      ${formField({label:'Ativo',name:'ativo',type:'toggle',value:item.ativo!==false})}
    </div></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
      <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
    </div></form>
  `,'sm');
  const form = $('#userForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    if(isNew){
      try{
        let userId;
        const { data:auth, error } = await supaAdmin.auth.admin.createUser({
          email: data.email, password: data.password, email_confirm: true
        });
        if(error){
          // Usuário já existe no auth — busca o ID pelo email
          const jaRegistrado = error.message?.toLowerCase().includes('already');
          if(!jaRegistrado) throw error;
          const { data:lista } = await supaAdmin.auth.admin.listUsers({ perPage:1000 });
          const existente = lista?.users?.find(u=>u.email===data.email);
          if(!existente) throw new Error('Email já registrado, mas não foi possível recuperar o ID. Redefina a senha pelo painel do Supabase.');
          userId = existente.id;
        } else {
          userId = auth.user?.id;
        }
        const profile = { id:userId, nome:data.nome, email:data.email, perfil:data.perfil, ativo:data.ativo!==false };
        const { error:e2 } = await supaAdmin.from('perfis').upsert(profile, { onConflict:'id' });
        if(e2) throw e2;
        toast('Usuário salvo com sucesso!','success');
      }catch(err){ return toast(err.message,'error'); }
    } else {
      const { data:updated, error } = await supaAdmin.from('perfis').update({ nome:data.nome, perfil:data.perfil, ativo:data.ativo, cpf:data.cpf||null }).eq('email',item.email).select();
      if(error) return toast(error.message,'error');
      if(!updated||updated.length===0) return toast('Registro não encontrado.','error');
      toast('Atualizado','success');
    }
    closeModal(); renderUsuarios();
  });
}

    {tag:"1A · Reconexão amigável", m:"Oi [Nome]! Como você tá?\nLembro que conversamos sobre energia solar umas semanas atrás.\nComo andam as coisas por aí? Tudo bem com a família?"},
    {tag:"1B · Check-in genuíno", m:"[Nome], oi! Tudo bom? Fiquei pensando na nossa conversa sobre energia solar."},
    {tag:"1C · Abordagem casual", m:"Oi [Nome]! Passando aqui pra dar um oi!\nLembro que você tinha interesse em energia solar. Como está a vida?"}
  ]},
  {chip:"2", sub:"Diagnóstico", title:"Dia 2 · Diagnóstico", opts:[
    {tag:"2A · Investigar mudanças", m:"[Nome], me conta uma coisa: mudou alguma coisa na situação desde nossa última conversa?"},
    {tag:"2B · Entender obstáculos", m:"Oi [Nome]! Ficou alguma dúvida sobre energia solar que posso esclarecer?"},
    {tag:"2C · Abordagem direta", m:"[Nome], você demonstrou interesse em energia solar mas sumiu!\nAconteceu algo que mudou a situação? Posso ajudar com alguma coisa?"}
  ]},
  {chip:"3", sub:"Ajuda", title:"Dia 3 · Solução / Ajuda", opts:[
    {tag:"3A · Oferecer suporte", m:"[Nome], se a questão for dúvida sobre financiamento, posso te explicar melhor!\nTemos parcelamento em até 84x com taxa reduzida pelo nosso parceiro."},
    {tag:"3B · Resolver objeções", m:"Muita gente fica em dúvida se o telhado serve ou se vale a pena mesmo. Posso tirar essa dúvida com você."},
    {tag:"3C · Facilitar decisão", m:"[Nome], se quiser, posso te mandar alguns casos de clientes da sua região que instalaram."}
  ]},
  {chip:"4", sub:"Reativar", title:"Dia 4 · Reativar interesse", opts:[
    {tag:"4A · Novo ângulo", m:"[Nome], você sabia que além de economizar na conta, energia solar valoriza o imóvel em até 15%?"},
    {tag:"4B · Benefício adicional", m:"Lembrei de você quando vi que a energia solar agora dá direito a financiamento com juros especiais!"},
    {tag:"4C · Prova social", m:"[Nome], 3 famílias aqui da região instalaram energia solar este mês!"}
  ]},
  {chip:"5", sub:"Urgência", title:"Dia 5 · Urgência suave", opts:[
    {tag:"5A · Timing de mercado", m:"[Nome], os preços dos equipamentos começaram a subir novamente...\nQuem aproveitar agora ainda pega as condições melhores. Vale pensar!"},
    {tag:"5B · Oportunidade limitada", m:"O nosso parceiro financeiro liberou uma linha especial de crédito para energia solar, mas é por tempo limitado."},
    {tag:"5C · Consequência da inação", m:"[Nome], enquanto a gente conversa, sua conta de luz continua subindo..."}
  ]},
  {chip:"6", sub:"Incisivo", title:"Dia 6 · Incisivo", opts:[
    {tag:"6A · Questionamento direto", m:"[Nome], posso te perguntar uma coisa?\nO que realmente tá te impedindo de economizar R$ 300-500/mês na conta de luz?"},
    {tag:"6B · Confronto amigável", m:"Sinceramente, não entendo... Você demonstrou interesse, viu que funciona, mas não age."},
    {tag:"6C · Realidade dura", m:"[Nome], enquanto você fica pensando, seus vizinhos já estão economizando."}
  ]},
  {chip:"7", sub:"Breakup", title:"Dia 7 · Breakup final", opts:[
    {tag:"7A · Encerramento positivo", m:"[Nome], foi meu último contato sobre energia solar!\nEntendo que pode não ser o momento certo. Se a situação mudar, estarei aqui pra ajudar!"},
    {tag:"7B · Porta aberta", m:"Oi [Nome]! Vou parar por aqui mesmo.\nMas quando a conta de luz apertar de vez e você lembrar da nossa conversa, me chama!"},
    {tag:"7C · Último alerta", m:"[Nome], última mensagem! Quando você ver sua conta de luz aumentar de novo (e vai aumentar), lembra que a solução tava bem aqui."}
  ]}
]},

{ id:"noshow", name:"Follow-up pós-reunião (no-show)", kind:"dias", groups:[

    {tag:"1C · Sem cobrança", m:"Oi [Nome]! Ficamos aqui te esperando hoje, mas tudo bem!\nSei que imprevistos acontecem. Quando puder, me chama que reagendamos!"}
  ]},
  {chip:"2", sub:"Obstáculos", title:"Dia 2 · Investigar obstáculos", opts:[
    {tag:"2A · Investigar", m:"[Nome], me conta: mudou alguma coisa desde que agendamos nossa conversa?"},
    {tag:"2B · Flexibilizar", m:"Se a questão for tempo, posso fazer uma apresentação rápida por aqui mesmo no WhatsApp!"},
    {tag:"2C · Facilitar", m:"[Nome], se ficar difícil nos encontrarmos, posso te mandar a proposta por aqui mesmo."}
  ]},
  {chip:"3", sub:"Soluções", title:"Dia 3 · Oferecer soluções", opts:[
    {tag:"3A · Videoconferência", m:"[Nome], que tal fazermos uma videochamada?\nPosso te mostrar na tela quanto sua família economizaria com energia solar."},
    {tag:"3B · Visita flexível", m:"Se quiser, posso passar aí rapidinho no final do dia, quando você tiver mais livre."},
    {tag:"3C · Análise remota", m:"Manda uma foto da sua conta de luz que faço a simulação completa pra você!"}
  ]},
  {chip:"4", sub:"Momentum", title:"Dia 4 · Criar momentum", opts:[
    {tag:"4A · Prova social", m:"[Nome], seus vizinhos da [Rua] instalaram energia solar esta semana!"},
    {tag:"4B · Urgência de preço", m:"Lembrei de você quando soube que os preços vão subir mês que vem..."},
    {tag:"4C · Custo da espera", m:"[Nome], cada dia que passa sem energia solar é dinheiro jogado fora na conta de luz!"}
  ]},
  {chip:"5", sub:"Direto", title:"Dia 5 · Mais direto", opts:[
    {tag:"5A · Esclarecer interesse", m:"[Nome], me esclarece uma coisa: você realmente tem interesse em economia de energia?"},
    {tag:"5B · Custo da enrolação", m:"Enquanto você fica enrolando, sua conta de luz continua alta todo mês..."},
    {tag:"5C · Comparação", m:"[Nome], seus vizinhos que agiram rápido já estão economizando.\nVocê vai ficar pagando caro enquanto eles poupam? Vamos decidir isso?"}
  ]},
  {chip:"6", sub:"Incisivo", title:"Dia 6 · Incisivo", opts:[
    {tag:"6A · Sinceridade", m:"[Nome], vou ser sincero: você está perdendo tempo e dinheiro.\nAgendou, não veio, fica enrolando... Sua família não merece essa economia?"},
    {tag:"6B · Limite", m:"Olha, não posso ficar correndo atrás indefinidamente.\nOu você tem interesse real em energia solar ou não tem. Se tiver, me avisa!"},
    {tag:"6C · Última tentativa", m:"[Nome], última tentativa mesmo! Você demonstrou interesse, agendou reunião, mas não apareceu..."}
  ]},
  {chip:"7", sub:"Breakup", title:"Dia 7 · Breakup definitivo", opts:[
    {tag:"7A · Respeitoso", m:"[Nome], não vou mais incomodar!\nEntendo que deve ter outras prioridades agora.\nSe no futuro quiser retomar sobre energia solar, é só chamar. Sucesso!"},
    {tag:"7B · Despedida", m:"Essa é realmente minha última mensagem, [Nome].\nQuando você se arrepender e sua conta de luz estiver ainda mais cara, lembra de mim."},
    {tag:"7C · Encerramento seco", m:"[Nome], acabou por aqui mesmo!\nQuem não tem tempo pra economizar R$ 300/mês realmente não precisa."}

function renderDisparador(){
  $('#pageActions').innerHTML = '';
  const MESES_DISP=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  let dpCatIdx=0, dpSubIdx=0;
  const g = id => document.getElementById(id);

  function loadCfg(){try{return JSON.parse(localStorage.getItem('ser_disparador_cfg')||'{}')}catch(e){return {}}}
  function saveCfg(){try{localStorage.setItem('ser_disparador_cfg',JSON.stringify({
    vendedor:g('dpVendedor').value, empresa:g('dpEmpresa').value, telefone:g('dpTelefone').value
  }))}catch(e){}}

  function parseValorDp(v){const n=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(n)?null:n}
  function fmtBRLDp(n){return 'R$ '+n.toLocaleString('pt-BR',{maximumFractionDigits:0})}
  function fmtNumDp(n){return n.toLocaleString('pt-BR',{maximumFractionDigits:0})}

  function tokens(){
    const v=parseValorDp(g('dpValor').value);
    const v20=v!=null?fmtBRLDp(v*240):null;
    return [
      ['[Nome da sua empresa]', g('dpEmpresa').value.trim()],
      ['[Seu Nome]', g('dpVendedor').value.trim()],
      ['[valor da conta x 20 anos]', v20],
      ['[valor x 20 anos]', v20],
      ['[Empresa]', g('dpClienteEmpresa').value.trim()],
      ['[Nome]', g('dpCliente').value.trim()],
      ['[valor]', v!=null?fmtNumDp(v):''],
      ['[cor]', g('dpBandeira').value],
      ['[mes]', g('dpMes').value]
    ];
  }

  function fillDisplay(msg){
    let s=esc(msg);
    for(const [k,val] of tokens()){
      if(val){ s=s.split(k).join('<mark class="disp-hl">'+esc(val)+'</mark>'); }
    }
    s=s.replace(/\[[^\]]+\]/g,m=>'<mark class="disp-hl-empty">'+m+'</mark>');
    return s.replace(/\n/g,'<br>');
  }
  function fillCopy(msg){
    let s=msg;
    for(const [k,val] of tokens()){ if(val) s=s.split(k).join(val); }
    return s;
  }

  function renderCats(){
    g('dpCatChips').innerHTML=DISPARADOR_DATA.map((c,i)=>
      `<button type="button" class="disp-chip${i===dpCatIdx?' active':''}" data-dpcat="${i}">${esc(c.name)}</button>`).join('');
  }
  function renderSub(){
    const cat=DISPARADOR_DATA[dpCatIdx];
    g('dpSubLabel').textContent = cat.kind==='dias' ? 'Dia da tentativa' : (cat.id==='objecoes'?'Objeção':(cat.kind==='roteiro'?'Etapa do roteiro':'Momento'));
    g('dpSubChips').innerHTML=cat.groups.map((sgrp,i)=>{
      if(cat.kind==='dias'){
        return `<button type="button" class="disp-chip disp-chip-day${i===dpSubIdx?' active':''}" data-dpsub="${i}"><span class="d">${esc(sgrp.chip)}</span><span class="s">${esc(sgrp.sub)}</span></button>`;
      }
      return `<button type="button" class="disp-chip${i===dpSubIdx?' active':''}" data-dpsub="${i}">${esc(sgrp.chip)}</button>`;
    }).join('');
  }
  function renderResults(){
    const cat=DISPARADOR_DATA[dpCatIdx], grp=cat.groups[dpSubIdx];
    g('dpResTitle').textContent=grp.title;
    g('dpResCount').textContent=grp.opts.length+' opções';
    g('dpResults').innerHTML=grp.opts.map((o,i)=>`
      <div class="disp-card">
        <div class="disp-card-top"><span class="disp-tag">${esc(o.tag)}</span></div>
        <div class="disp-msg" id="dpMsg${i}">${fillDisplay(o.m)}</div>
        <div class="disp-actions">
          <button type="button" class="btn btn-secondary disp-copy-btn" data-dpcopy="${i}">📋 Copiar</button>
          <button type="button" class="btn disp-wa-btn" data-dpwa="${i}">💬 WhatsApp</button>
        </div>
      </div>`).join('');
  }
  function renderCtxBar(){
    const cli=g('dpCliente').value.trim(), v=parseValorDp(g('dpValor').value);
    const cor=g('dpBandeira').value, parts=[];
    parts.push(`<span class="disp-pill">Cliente: <b>${cli?esc(cli):'<span class="disp-warn">defina</span>'}</b></span>`);
    if(v!=null) parts.push(`<span class="disp-sep"></span><span class="disp-pill">Conta: <b>${fmtBRLDp(v)}</b></span>`);
    parts.push(`<span class="disp-sep"></span><span class="disp-pill">Bandeira: <b style="text-transform:capitalize">${esc(cor)}</b></span>`);
    g('dpCtxBar').innerHTML=parts.join('');
  }
  function refreshDynamic(){
    renderCtxBar();
    $$('#dpResults .disp-msg').forEach((el,i)=>{
      const grp=DISPARADOR_DATA[dpCatIdx].groups[dpSubIdx];
      if(grp.opts[i]) el.innerHTML=fillDisplay(grp.opts[i].m);
    });
    const cores = {verde:'var(--success)',amarela:'#f4c20d',vermelha:'var(--danger)'};
    g('dpFlagdot').style.background = cores[g('dpBandeira').value] || cores.vermelha;
  }

  async function copyTextDp(t){
    try{ await navigator.clipboard.writeText(t); return true; }
    catch(e){
      const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      document.body.removeChild(ta);return ok;
