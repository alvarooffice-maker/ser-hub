  });
}

/* ============================================================
   FILE UPLOAD HELPER
   ============================================================ */
async function compressImage(file, maxPx=1280, quality=0.72){
  const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(file.name);
  if(!isImage) return file;
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width > maxPx || height > maxPx){
        if(width >= height){ height = Math.round(height * maxPx / width); width = maxPx; }
        else               { width  = Math.round(width  * maxPx / height); height = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        if(!blob){ resolve(file); return; }
        const compressed = new File([blob], file.name.replace(/\.\w+$/, '.jpg'), {type:'image/jpeg'});
        resolve(compressed);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function uploadFile(bucket, file, prefix=''){
  const processed = await compressImage(file);
  const ext = (processed.name.split('.').pop()||'bin').toLowerCase();
  const path = `${prefix?prefix+'/':''}${Date.now()}_${uid()}.${ext}`;
  const { error } = await supa.storage.from(bucket).upload(path, processed, { upsert:false, contentType:processed.type || 'application/octet-stream' });
  if(error) throw error;
  const { data:urlData } = supa.storage.from(bucket).getPublicUrl(path);
  return { url:urlData.publicUrl, path, name:file.name };
}

function fileUploadBlock(label, name, bucket, currentList=[], multiple=true){
  const list = Array.isArray(currentList)?currentList:[];
  const btnLabel = multiple ? '+ Adicionar fotos' : '+ Selecionar arquivo';
  return `
    <div class="file-upload" data-fu="${name}">
      <label>${esc(label)}</label>
      <div class="file-thumbs" data-thumbs="${name}">
        ${list.map((f,i)=>thumbHtml(f,name,i)).join('')}
      </div>
      <button type="button" class="btn-add-file" data-trigger="${name}">${btnLabel}</button>
      <input type="file" data-bucket="${bucket}" data-name="${name}" ${multiple?'multiple':''} accept="image/*,application/pdf" />
    </div>`;
}
function thumbHtml(f,name,i){
  const isImg = (f.url||'').match(/\.(jpe?g|png|gif|webp|bmp)$/i);
  return `<div class="file-thumb ${isImg?'':'doc'}" data-name="${name}" data-i="${i}">
    ${isImg ? `<a href="${esc(f.url)}" target="_blank"><img src="${esc(f.url)}" alt="${esc(f.name||'')}"/></a>` : `<a href="${esc(f.url)}" target="_blank">${esc(f.name||'arquivo')}</a>`}
    <button type="button" class="rm" data-rm="${name}" data-i="${i}">×</button>
  </div>`;
}

function attachFileUploads(rootEl, fileStore){
  function bindRemove(){
    $$('[data-rm]',rootEl).forEach(b=>{
      if(b._bound) return; b._bound = true;
      b.addEventListener('click', ()=>{
        const name = b.dataset.rm, i = Number(b.dataset.i);
        if(!fileStore[name]) return;
        fileStore[name].splice(i,1);
        const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
        wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
        bindRemove();
      });
    });
  }
  // Botão "+ Adicionar fotos/arquivo" → dispara o input oculto
  $$('.btn-add-file',rootEl).forEach(btn=>{
    if(btn._bound) return; btn._bound = true;
    btn.addEventListener('click', ()=>{
      const inp = rootEl.querySelector(`input[type=file][data-name="${btn.dataset.trigger}"]`);
      if(inp) inp.click();
    });
  });

  $$('input[type=file]',rootEl).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const bucket = inp.dataset.bucket;
      const name = inp.dataset.name;
      fileStore[name] = fileStore[name] || [];
      for(const file of inp.files){
        const MB = file.size / 1024 / 1024;
        if(MB > 48){
          toast(`❌ Arquivo muito grande (${MB.toFixed(0)} MB). Limite: 48 MB. Comprima o PDF antes de enviar.`,'error',6000);
          continue;
        }
        try{
          toast('Enviando '+file.name+'…','info',1500);
          const f = await uploadFile(bucket, file, name);
          fileStore[name].push(f);
        }catch(e){ toast('Erro upload: '+e.message,'error'); }
      }
      const wrap = rootEl.querySelector(`[data-thumbs="${name}"]`);
      wrap.innerHTML = fileStore[name].map((f,i)=>thumbHtml(f,name,i)).join('');
      bindRemove();
      inp.value = '';
    });
  });
  bindRemove();
}

            ${fileUploadBlock('PDF Análise de Sombreamento','pdf_sombreamento','vistorias',docs.pdf_sombreamento||[],true)}
            ${fileUploadBlock('Laudo Técnico','laudo_tecnico','vistorias',docs.laudo_tecnico||[],true)}

            ${formField({label:'Observação sobre Estrutura',name:'de_obs_estrutura',type:'textarea',value:de.obs_estrutura,full:true})}

            <div style="grid-column:1/-1;border-top:2px solid var(--primary);padding-top:14px;margin-top:6px">
              ${formField({label:'Parecer Final',name:'resultado',type:'select',value:item.resultado,options:parecerOpts,full:true})}
            </div>

          </div></div>
        </div>

        ${!isNew?renderLinkedDocBtns(linked):''}
        ${!isNew ? histSection() : ''}
      </div>
      <div class="modal-footer">
        ${!isNew && isAdmin()?`<button type="button" class="btn btn-danger" id="delVistBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        ${!isNew?`<button type="button" class="btn btn-secondary" id="vistPdfBtn">🖨️ Gerar Relatório</button>`:''}
        <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
      </div>
    </form>
  `,'lg');

  const form = $('#vistForm');
  attachCEP(form);

  // Mostrar/ocultar responsável ausência conforme toggle de presença
  const toggleRespWrap = () => {
    const val = form.elements.cliente_presente?.value;
    const wrap = document.getElementById('respAusenciaWrap');
    if(wrap) wrap.style.display = val === 'nao' ? 'block' : 'none';
  };
  form.elements.cliente_presente?.addEventListener('change', toggleRespWrap);
  toggleRespWrap();

  if(!isNew){ attachLinkedDocListeners(linked); carregarHistorico($('#histList'), 'vistorias', item.id); }

  const allFiles = {};
  [...fotoKeys, ...docKeys].forEach(k=>{
    allFiles[k] = (fotos[k] || docs[k] || []).slice();
  });
  attachFileUploads(form, allFiles);

  // ── Auto-save: persiste o rascunho no localStorage ───────
  const _draftKey = `vistoria_rascunho_${item.id||'nova'}`;
  const _saveDraft = ()=>{
    try{
      localStorage.setItem(_draftKey, JSON.stringify({
        ts: Date.now(),
        fields: readForm(form),
        files: JSON.parse(JSON.stringify(allFiles))
      }));
      const ind = document.getElementById('autosaveInd');
      if(ind){ const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); ind.textContent=`💾 salvo às ${t}`; }
    }catch(e){}
  };
  let _draftTimer = null;
  form.addEventListener('input',  ()=>{ clearTimeout(_draftTimer); _draftTimer=setTimeout(_saveDraft,1500); });
  form.addEventListener('change', ()=>{ clearTimeout(_draftTimer); _draftTimer=setTimeout(_saveDraft,1500); });

  // Verificar se existe rascunho e oferecer restauração
  try{
    const saved = localStorage.getItem(_draftKey);
    if(saved){
      const draft = JSON.parse(saved);
      const mins = Math.round((Date.now()-draft.ts)/60000);
      if(mins < 1440){
        const banner = document.getElementById('draftBanner');
        if(banner){
          banner.style.display='flex';
          banner.querySelector('span').innerHTML=`💾 <strong>Rascunho encontrado</strong> — salvo há ${mins<1?'menos de 1':mins} min. Deseja restaurar o que foi preenchido?`;
          document.getElementById('draftRestoreBtn')?.addEventListener('click',()=>{
            Object.entries(draft.fields||{}).forEach(([k,v])=>{
              // multicheck: restaura checkboxes pelo data-multicheck
              const mcDiv = form.querySelector(`[data-multicheck="${k}"]`);
              if(mcDiv){
                const vals = Array.isArray(v)?v:(v?[v]:[]);
                mcDiv.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.checked=vals.includes(cb.value); });
                return;
              }
              const el = form.elements[k];
              if(!el) return;
              if(el.type==='checkbox') el.checked=!!v;
              else el.value=v;
            });
            Object.entries(draft.files||{}).forEach(([k,arr])=>{
              allFiles[k]=arr;
              const wrap=form.querySelector(`[data-thumbs="${k}"]`);
              if(wrap) wrap.innerHTML=arr.map((f,i)=>thumbHtml(f,k,i)).join('');
            });
            toggleRespWrap();
            banner.style.display='none';
            toast('Rascunho restaurado!','success');
            _saveDraft();
          });
          document.getElementById('draftDiscardBtn')?.addEventListener('click',()=>{
            localStorage.removeItem(_draftKey);
            banner.style.display='none';
          });
        }
      }
    }
  }catch(e){}
  // ─────────────────────────────────────────────────────────

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const raw = readForm(form);
    const data = {
      nome:raw.nome, telefone:raw.telefone, email:raw.email,
      data_agendamento:raw.data_agendamento, hora_agendamento:raw.hora_agendamento,
      tecnico:raw.tecnico, gmap:raw.gmap,
      cliente_presente: raw.cliente_presente==='sim' ? true : raw.cliente_presente==='nao' ? false : null,
      responsavel_ausencia:raw.responsavel_ausencia,
      resultado:raw.resultado, status:raw.status,
      cep:raw.cep, rua:raw.rua, numero:raw.numero, complemento:raw.complemento,
      bairro:raw.bairro, cidade:raw.cidade, estado:raw.estado,
      qtd_modulos:raw.qtd_modulos?Number(raw.qtd_modulos):null,
      marca_modulo:raw.marca_modulo||null,
      pot_modulo:raw.pot_modulo?Number(raw.pot_modulo):null,
      qtd_inversores:raw.qtd_inversores?Number(raw.qtd_inversores):null,
      marca_inversor:raw.marca_inversor||null,
      pot_inversor:raw.pot_inversor?Number(raw.pot_inversor):null,
      kwp:raw.kwp?Number(raw.kwp):null,
      dados_padrao:    extractJsonGroup(raw,'dp_'),
      dados_inversor:  extractJsonGroup(raw,'di_'),
      dados_estrutura: extractJsonGroup(raw,'de_'),
      fotos: pickFiles(allFiles, fotoKeys),
      docs:  pickFiles(allFiles, docKeys)
    };
    const parecerMap = {
      aprovado:'Aprovado', aprovado_com_obra:'Aprovado c/ Obra',
      aprovado_com_sombreamento:'Aprovado c/ Sombreamento',
      aprovado_com_obra_e_sombreamento:'Aprovado c/ Obra e Sombreamento',
      reprovado:'Reprovado',
      // backward compat
      aprovada:'Aprovada', aprovada_com_obra:'Aprovada c/ Obra',
      aprovada_com_sombreamento:'Aprovada c/ Sombreamento',
      aprovada_com_obra_e_sombreamento:'Aprovada c/ Obra e Sombreamento'
    };
    const eAprovado = v => ['aprovado','aprovado_com_obra','aprovado_com_sombreamento','aprovado_com_obra_e_sombreamento','aprovada','aprovada_com_obra','aprovada_com_sombreamento','aprovada_com_obra_e_sombreamento'].includes(v||'');
    const eReprovado = v => ['reprovado','reprovada'].includes(v||'');

    if(isNew){
      data.criado_por = State.user?.id;
      const { data: vistCriada, error } = await supa.from('vistorias').insert(data).select('id').single();
      if(error) return toast(error.message,'error');
      await registrarHistorico('vistorias', vistCriada.id, 'criado', `Vistoria criada: ${data.nome||''}`);
      toast('Vistoria salva','success');
    } else {
      const prevResultado = item.resultado || '';
      const { error } = await supa.from('vistorias').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
      const mud = detectMudancas(item, data, [
        ['resultado','Parecer', v=>parecerMap[v]||v],
        ['status','Status',null], ['tecnico','Técnico',null],
      ]);
      const acao = mud.some(m=>m.startsWith('Parecer')) ? 'status' : 'atualizado';
      await registrarHistorico('vistorias', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');

      if(eAprovado(data.resultado) && !eAprovado(prevResultado)){
        const jaExiste = (State.contratos||[]).find(c => c.vistoria_id === item.id);
        if(!jaExiste){
          await loadAll();
          const vistAtual = (State.vistorias||[]).find(v=>v.id===item.id) || {...item,...data};
          const cPayload = buildTransitionPayload(vistAtual, 'vistoria', 'contrato');
          cPayload.criado_por = State.user?.id;
          const { error: ce } = await supa.from('contratos').insert(cPayload);
          if(ce) toast('Vistoria salva, mas erro ao criar contrato: '+ce.message,'error');
          else toast('Vistoria aprovada → Contrato criado automaticamente! ✓','success');
        } else {
          toast('Vistoria salva','success');
        }
      } else if(eReprovado(data.resultado) && !eReprovado(prevResultado)){
        // Vistoria reprovada → envia cliente para Remarketing
        await enviarParaRemarketing({...item,...data}, 'vistoria_reprovada', 'Vistoria reprovada');
      } else {
        toast('Vistoria salva','success');
      }
    }
    localStorage.removeItem(_draftKey); // limpa rascunho após salvar
    closeModal();
    if(State.route==='pipeline') renderPipeline(); else if(State.route==='vistoriador') renderVistoriadorKanban(); else if(State.route==='instalador') renderInstaladorKanban(); else if(State.route==='homologador') renderHomologadorKanban();
  });

  $('#delVistBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir vistoria?')) return;
    await supa.from('vistorias').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });

  $('#vistPdfBtn')?.addEventListener('click', ()=>{
    const raw = readForm(form);
    const pdfItem = {
      ...item,
      nome:raw.nome, telefone:raw.telefone, email:raw.email,
      data_agendamento:raw.data_agendamento, hora_agendamento:raw.hora_agendamento,
      tecnico:raw.tecnico, gmap:raw.gmap,
      cliente_presente: raw.cliente_presente==='sim' ? true : raw.cliente_presente==='nao' ? false : null,
      responsavel_ausencia:raw.responsavel_ausencia,
      resultado:raw.resultado, status:raw.status,
      cep:raw.cep, rua:raw.rua, numero:raw.numero, complemento:raw.complemento,
      bairro:raw.bairro, cidade:raw.cidade, estado:raw.estado,
      qtd_modulos:raw.qtd_modulos?Number(raw.qtd_modulos):null,
      marca_modulo:raw.marca_modulo||null,
      pot_modulo:raw.pot_modulo?Number(raw.pot_modulo):null,
      qtd_inversores:raw.qtd_inversores?Number(raw.qtd_inversores):null,
      marca_inversor:raw.marca_inversor||null,
      pot_inversor:raw.pot_inversor?Number(raw.pot_inversor):null,
      kwp:raw.kwp?Number(raw.kwp):null,
      dados_padrao:    extractJsonGroup(raw,'dp_'),
      dados_inversor:  extractJsonGroup(raw,'di_'),
      dados_estrutura: extractJsonGroup(raw,'de_'),
      fotos: pickFiles(allFiles, fotoKeys),
      docs:  pickFiles(allFiles, docKeys)
    };
    abrirVistoriaJanela(pdfItem);
  });
}

function openAtendimentoModal(item=null){
  const isNew = !item;
  item = item || {};

  const tipoOpts = [
    ['','— selecione —'],
    ['retorno_tecnico','Retorno Técnico'],
    ['sombreamento','Sombreamento'],
    ['goteira','Goteira'],

            ${formField({label:'Telefone',name:'telefone',value:item.telefone})}

            ${formField({label:'Hora',name:'hora_agendamento',type:'time',value:item.hora_agendamento})}
            ${formField({label:'Responsável',name:'responsavel',value:item.responsavel,datalist:DL_TECNICO})}
            ${formField({label:'Status *',name:'status',type:'select',value:item.status||'aberto',options:statusOpts,required:true})}
            ${formField({label:'Valor (R$)',name:'valor',type:'number',value:item.valor})}
            ${formField({label:'Descrição *',name:'descricao',type:'textarea',value:item.descricao,required:true,full:true})}
            ${formField({label:'Observações',name:'obs',type:'textarea',value:item.obs,full:true})}
            ${fileUploadBlock('Fotos / Documentos','fotos_atendimento','atendimentos',fotos.fotos_atendimento||[],true)}
          </div></div>
        </div>
        <div class="section"><div class="section-header"><h4>📍 Endereço</h4><span class="section-toggle">▼</span></div>
          <div class="section-body"><div class="form-grid">
            ${formField({label:'CEP',name:'cep',value:item.cep})}
            ${formField({label:'Rua',name:'rua',value:item.rua})}
            ${formField({label:'Número',name:'numero',value:item.numero})}
            ${formField({label:'Complemento',name:'complemento',value:item.complemento})}
            ${formField({label:'Bairro',name:'bairro',value:item.bairro})}
            ${formField({label:'Cidade',name:'cidade',value:item.cidade})}
            ${formField({label:'Estado',name:'estado',value:item.estado})}
            ${formField({label:'Localização (Google Maps)',name:'gmap',value:item.gmap,placeholder:'Cole aqui o link do Google Maps',full:true})}
          </div></div>
        </div>
        ${!isNew ? histSection() : ''}
      </div>
      <div class="modal-footer">
        ${!isNew && isAdmin()?`<button type="button" class="btn btn-danger" id="delAtendBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
      </div>
    </form>
  `,'lg');

  const form = $('#atendForm');
  if(!isNew) carregarHistorico($('#histList'), 'atendimentos', item.id);

  const allFiles = {};
  [...fotoKeys,...docKeys].forEach(k=>{ allFiles[k]=(fotos[k]||docs[k]||[]).slice(); });
  attachFileUploads(form, allFiles);
  attachCEP(form);

  const tipoSel = form.elements['tipo'];
  const campoTipoOutro = $('#campoTipoOutro');
  const toggleTipoOutro = ()=>{
    const isOutros = tipoSel.value === 'outros';
    campoTipoOutro.style.display = isOutros ? '' : 'none';
    form.elements['tipo_obs'].required = isOutros;
  };
  tipoSel.addEventListener('change', toggleTipoOutro);
  toggleTipoOutro();

      docs:  pickFiles(allFiles, docKeys),

        ['status','Status',null],['tipo','Tipo',v=>tipoMap[v]||v],['responsavel','Responsável',null]
      ]);
      const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
      await registrarHistorico('atendimentos', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');
      toast('Re-Serviço salvo! ✓','success');
    }
    closeModal();
    if(State.route==='reservico') renderReservicoKanban(); else if(State.route==='appmanutencao') renderAppManKanban(); else if(State.route==='pipeline') renderPipeline(); else if(State.route==='vistoriador') renderVistoriadorKanban(); else if(State.route==='instalador') renderInstaladorKanban(); else if(State.route==='homologador') renderHomologadorKanban();
  });

  $('#delAtendBtn')?.addEventListener('click', async ()=>{

    toast('Excluído','success'); await loadAll(); closeModal();
    if(State.route==='reservico') renderReservicoKanban(); else renderPipeline();
  });
}

      </div>

  `,'lg');

  const form = $('#appManForm');
  if(!isNew) carregarHistorico($('#histList'), 'app_manutencao', item.id);

  const allFiles = {};
  fotoKeys.forEach(k=>{ allFiles[k]=(fotos[k]||[]).slice(); });
  attachFileUploads(form, allFiles);
  attachCEP(form);

  // Forma de pagamento: exibe parcelamento apenas para cartão
  const formaPagSel = form.elements['forma_pagamento'];
  const parceladoSel = form.elements['parcelado'];
  const campoParcelado = $('#campoParcelado');
  const campoQtdParcelas = $('#campoQtdParcelas');
  const togglePagamento = ()=>{
    const isCartao = formaPagSel.value === 'cartao';
    campoParcelado.style.display = isCartao ? '' : 'none';
    const isParcelado = isCartao && parceladoSel.value === 'sim';
    campoQtdParcelas.style.display = isParcelado ? '' : 'none';
    form.elements['qtd_parcelas'].required = isParcelado;
  };
  formaPagSel.addEventListener('change', togglePagamento);
  parceladoSel.addEventListener('change', togglePagamento);
  togglePagamento();

  // Soma automática do valor total a partir dos itens marcados
  const valorTotalInput = form.querySelector('[name="valor_total"]');
  function recalcTotal(){
    let total = 0;
    ITENS_APPMAN.forEach(([key])=>{
      const chk = form.querySelector(`[data-am-check="${key}"]`);
      const val = form.querySelector(`[data-am-valor="${key}"]`);
      if(chk?.checked) total += parseBR(val.value) || 0;
    });
    valorTotalInput.value = fmtInputNum(total);
  }
  $$('#amItens [data-am-check]', form).forEach(el=> el.addEventListener('change', recalcTotal));
  $$('#amItens [data-am-valor]', form).forEach(el=> el.addEventListener('input', recalcTotal));
  recalcTotal();

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const raw = readForm(form);
    const itensData = {};
    ITENS_APPMAN.forEach(([key])=>{
      const chk = form.querySelector(`[data-am-check="${key}"]`);
      const val = form.querySelector(`[data-am-valor="${key}"]`);
      itensData[key] = { ativo: !!chk?.checked, valor: parseBR(val.value) };
    });
    const data = {
      nome: raw.nome, telefone: raw.telefone,
      responsavel: raw.responsavel,
      tecnico_responsavel: raw.tecnico_responsavel,
      status: raw.status || 'aberto',
      itens: itensData,
      valor_total: raw.valor_total,
      forma_pagamento: raw.forma_pagamento || null,
      parcelado: raw.forma_pagamento==='cartao' && raw.parcelado==='sim',
      qtd_parcelas: (raw.forma_pagamento==='cartao' && raw.parcelado==='sim' && raw.qtd_parcelas) ? Number(raw.qtd_parcelas) : null,
      data_venda: raw.data_venda || null,
      data_servico: raw.data_servico || null,
      data_renovacao: raw.data_renovacao || null,
      obs: raw.obs,
      cep: raw.cep, rua: raw.rua, numero: raw.numero, complemento: raw.complemento,
      bairro: raw.bairro, cidade: raw.cidade, estado: raw.estado, gmap: raw.gmap,
      fotos: pickFiles(allFiles, fotoKeys),
      atualizado_em: new Date().toISOString()
    };
    if(isNew){
      data.criado_por = State.user?.id;
      const { data:criado, error } = await supa.from('app_manutencao').insert(data).select('id').single();
      if(error) return toast(error.message,'error');
      await registrarHistorico('app_manutencao', criado.id, 'criado', `Registro criado: ${data.nome}`);
      toast('Registro criado! ✓','success');
    } else {
      const { error } = await supa.from('app_manutencao').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
      const mud = detectMudancas(item, data, [
        ['status','Status',null],['responsavel','Responsável',null],['tecnico_responsavel','Técnico',null],['valor_total','Valor Total',null]
      ]);
      const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
      await registrarHistorico('app_manutencao', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');
      toast('Registro salvo! ✓','success');
    }
    closeModal();
    if(State.route==='appmanutencao') renderAppManKanban(); else if(State.route==='pipeline') renderPipeline();
  });

  $('#delAppManBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir registro de App/Manutenção?')) return;
    await supa.from('app_manutencao').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal();
    if(State.route==='appmanutencao') renderAppManKanban(); else renderPipeline();
  });
}

function extractJsonGroup(obj,prefix){
  const out = {};
  Object.entries(obj).forEach(([k,v])=>{
    if(k.startsWith(prefix)){
      out[k.slice(prefix.length)] = v;
    }
  });
  return out;
}
function pickFiles(store, keys){
  const out = {};
  keys.forEach(k=>{ if(store[k]?.length) out[k] = store[k]; });
  return out;
}

        ${!isNew&&canVerFinanceiro()?`<button type="button" class="btn btn-secondary" id="projFinBtn">💰 Financeiro</button>`:''}
        ${!isNew?`<button type="button" class="btn btn-danger" id="delContBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">${isNew?'Criar':'Salvar'}</button>
      </div>
    </form>
  `,'lg');

  const form = $('#contForm');
  attachCEP(form);
  attachCPF(form);

  // Auto-preenche CPF ao selecionar vendedor ou supervisor
  const perfisMap = (State.perfis||[]).reduce((m,p)=>{ if(p.nome) m[p.nome]=p; return m; }, {});
  form.elements.vendedor?.addEventListener('change', e=>{
    const p = perfisMap[e.target.value];
    if(p?.cpf && !form.elements.vend_cpf.value) form.elements.vend_cpf.value = p.cpf;
    else if(p?.cpf) form.elements.vend_cpf.value = p.cpf;
  });
  form.elements.supervisor_nome?.addEventListener('change', e=>{
    const p = perfisMap[e.target.value];
    if(p?.cpf) form.elements.supervisor_cpf.value = p.cpf;
  });

  // Mostra/esconde campo motivo de perda
  form.elements.status?.addEventListener('change', e=>{
    const wrap = document.getElementById('motivoPerdaWrap');
    if(wrap) wrap.style.display = e.target.value==='perdido' ? 'block' : 'none';
  });

  if(!isNew) carregarHistorico($('#histList'), 'contratos', item.id);

  if(!isNew){
    $('#addTermoBtn')?.addEventListener('click', ()=>{ closeModal(); openTermoAditivoModal(item); });
    $$('.ta-edit-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{
      const t = (State.termos_aditivos||[]).find(x=>x.id===btn.dataset.id);
      if(t){ closeModal(); openTermoAditivoModal(item, t); }
    }); });
    $$('.ta-print-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{
      const t = (State.termos_aditivos||[]).find(x=>x.id===btn.dataset.id);
      if(t) imprimirTermoAditivo(item, t);
    }); });
  }
  const statusContMap = {pendente:'Pendente', enviado:'Enviado', assinado:'Assinado', cancelado:'Cancelado', perdido:'Perdido'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    ['kwp','qtd_modulos','pot_modulo','qtd_inversores','pot_inversor','qtd_baterias','pot_bateria','valor'].forEach(k=>{ data[k] = data[k]!=null ? Number(data[k]) : null; });
    if(isNew){
      data.criado_por = State.user?.id;
      const { data: contCriado, error } = await supa.from('contratos').insert(data).select('id').single();
      if(error) return toast(error.message,'error');
      await registrarHistorico('contratos', contCriado.id, 'criado', `Contrato criado: ${data.nome||''}`);
    } else {
      const prevStatus = item.status;
      const { error } = await supa.from('contratos').update(data).eq('id',item.id);
      if(error) return toast(error.message,'error');
      const mud = detectMudancas(item, data, [
        ['status','Status', v=>statusContMap[v]||v],
        ['vendedor','Vendedor',null], ['valor','Valor',null],
      ]);
      const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
      await registrarHistorico('contratos', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');

      // Contrato cancelado → envia cliente para Remarketing
      if(data.status === 'cancelado' && prevStatus !== 'cancelado'){
        await enviarParaRemarketing({...item,...data}, 'contrato_cancelado', 'Contrato cancelado');
      }
      // Contrato perdido → valida motivo e envia para Remarketing
      if(data.status === 'perdido'){
        if(!data.motivo_perda){ toast('Selecione o motivo da perda','error'); return; }
        if(prevStatus !== 'perdido'){
          await enviarParaRemarketing({...item,...data}, 'contrato_perdido', 'Contrato perdido: '+data.motivo_perda.trim());
        }
      }

      // Auto-avançar para Logística quando assinado
      if(data.status === 'assinado'){
        // Verifica no banco (não no State) para evitar duplicata por race condition
        const { data: logExist } = await supa.from('logistica').select('id').eq('contrato_id', item.id).maybeSingle();
        if(!logExist){
          const contAtual = { ...item, ...data };
          const payload = buildTransitionPayload(contAtual,'contrato','logistica');
          payload.criado_por = State.user?.id;
          const { error: eLog } = await supa.from('logistica').insert(payload);
          if(eLog) toast('Avançou para Logística: '+eLog.message,'error');
          else toast('Contrato assinado → movido para Logística ✓','success');
          await loadAll(); closeModal();
          if(State.route==='pipeline') renderPipeline(); else if(State.route==='vistoriador') renderVistoriadorKanban(); else if(State.route==='instalador') renderInstaladorKanban(); else if(State.route==='homologador') renderHomologadorKanban();
          return;
        }
      }
    }
    toast('Contrato salvo','success'); await loadAll(); closeModal();
    if(State.route==='pipeline') renderPipeline(); else if(State.route==='vistoriador') renderVistoriadorKanban(); else if(State.route==='instalador') renderInstaladorKanban(); else if(State.route==='homologador') renderHomologadorKanban();
  });

  $('#clickSignBtn')?.addEventListener('click', async ()=>{
    try{
      toast('Enviando ao ClickSign…','info');
      const resp = await fetch(`${SURL}/functions/v1/clicksign-proxy`,{
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${SKEY}`},
        body: JSON.stringify({ contrato_id:item.id })
      });
      const result = await resp.json().catch(()=>({}));
      if(!resp.ok) throw new Error(result.error||'Falha ClickSign');
      toast('Enviado ao ClickSign!','success');
      closeModal();
    }catch(e){ toast('ClickSign: '+e.message,'error'); }
  });

  $('#vizContBtn')?.addEventListener('click', ()=> abrirContratoJanela(item, false));
  $('#dlContBtn')?.addEventListener('click',  ()=> abrirContratoJanela(item, true));
  $('#projFinBtn')?.addEventListener('click', ()=> openProjetoFinanceiroModal(item.id, item.nome||item.cliente||''));

  if(!isNew) attachLinkedDocListeners(linked);

  $('#delContBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir contrato?')) return;
    await supa.from('contratos').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });
}

function abrirContratoJanela(c, imprimir=false){
  const fR = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const txt = v => v||'_______________';
  const dt  = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR');
  const end = [c.rua, c.numero?'nº '+c.numero:'', c.complemento, c.bairro, c.cidade, c.estado||'', c.cep?'CEP '+c.cep:''].filter(Boolean).join(', ');
  function extenso(n){
    n=Math.round(Number(n||0));
    if(!n) return 'zero reais';
    const un=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
    const dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
    const ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    function g(x){if(!x)return'';if(x===100)return'cem';let r='';if(x>=100){r+=ct[Math.floor(x/100)];x%=100;if(x)r+=' e ';}if(x>=20){r+=dz[Math.floor(x/10)];x%=10;if(x)r+=' e '+un[x];}else if(x)r+=un[x];return r;}
    let r='',mi=Math.floor(n/1000000),mil=Math.floor((n%1000000)/1000),hum=n%1000;
    if(mi){r+=g(mi)+(mi===1?' milhão':' milhões');}
    if(mil){if(r)r+=' e ';r+=mil===1?'mil':g(mil)+' mil';}
    if(hum){if(r)r+=' e ';r+=g(hum);}
    return r+(n===1?' real':' reais');
  }
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Contrato — ${c.nome||'SER Energia'}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.print-bar{position:sticky;top:0;z-index:100;background:#fff;padding:10px 24px;border-bottom:2px solid #4B0082;display:flex;justify-content:space-between;align-items:center}

<h2>Do Objeto do Contrato</h2>
<p><strong>1. O(A) CONTRATANTE confia à CONTRATADA e aceita, a execução de todas as atividades necessárias para a realização, teste e conexão do projeto fotovoltaico que compreende:</strong></p>
<p class="pi">a. Fornecimento e instalação de materiais elétricos estritamente necessários à execução do serviço e instalação do projeto (quadro de string DC, quadro de paralelo AC);</p>
<p class="pi">b. Fornecimento e instalação de estrutura metálica para suporte de módulos fotovoltaicos;</p>
<p class="pi">c. Conexão elétrica entre módulos, quadros DC, inversor e quadro baixa tensão;</p>

<h2>Das Exclusões do Contrato</h2>
<p><strong>2. São exclusos do presente contrato os seguintes:</strong></p>
<p class="pi">a. Obras civis: estrutura de edifícios, fundações, terraplenagem, armação, drenagem, ampliação, inovação ou restauração no imóvel;</p>
<p class="pi">b. Fornecimento de telha, exceto quando no momento da instalação alguma telha for danificada;</p>
<p class="pi">c. Obras de transmissão de energia em linha aérea: cabeamento que liga a residência até a rede da concessionária;</p>
<p class="pi">d. Estrutura mecânica de reforço do telhado (onde previsto no laudo de vistoria);</p>
<p class="pi">e. Implantação e custeio de poste auxiliar, quando necessário e indicado na vistoria;</p>
<p class="pi">f. Cálculo estrutural do telhado (quando não previsto no item 2.1).</p>
<p><strong>2.3. O presente contrato visa a prestação de serviços especializados para instalação de sistemas de geração de energia fotovoltaica com uma capacidade de potência de <span style="color:#4B0082">${c.kwp||'___'} kWp</span>, em endereço definido no contrato.</strong></p>
<p><strong>2.4. A capacidade de energia estabelecida no item 2.3 será alcançada apenas em condições ideais, podendo sofrer alterações por fatores naturais ou não naturais, tais como, chuva, neblina, sombreamento e sujeira nos painéis solares.</strong></p>

<h2>Dos Valores e Forma de Pagamento</h2>
<p><strong>3. O valor que deverá ser pago pelo(a) CONTRATANTE à CONTRATADA SER ENERGIA RENOVÁVEL para a realização do serviço de todas as obrigações descritas neste contrato corresponde ao total de <span style="color:#4B0082">${fR(c.valor)}</span> (${extenso(c.valor)}).</strong></p>
<p><strong>Forma de pagamento: <span style="color:#4B0082">${txt(c.forma_pgto)}</span></strong></p>
${(c.pgto_desc||c.banco)?'<p><strong>3.1. O Pagamento ocorrerá: <span style="color:#4B0082">'+(c.banco?c.banco+' — ':'')+txt(c.pgto_desc)+'</span>.</strong></p>':''}
<p><strong>3.2. Verificado o descumprimento da obrigação prevista no item 3 e 3.1, estará a CONTRATADA autorizada a proceder com os métodos de cobrança extrajudiciais e judiciais, tais como negativação do CPF do devedor nos órgãos de crédito, envio da dívida para protesto em cartórios, além do ajuizamento das medidas judiciais cabíveis e interrupção imediata da prestação do serviço até a regularização.</strong></p>
<p><strong>3.3. Havendo mais de um contratante, estes possuem responsabilidade solidária em todas as obrigações do presente contrato.</strong></p>

<h2>Reajuste e Revisão de Valores</h2>
<p>4. O valor que será pago pelo CONTRATANTE abarca os serviços e equipamentos necessários para finalizar o projeto contratado. Caso o CONTRATANTE faça solicitação de alteração do projeto, ou ocorra desequilíbrio contratual em função de fatos supervenientes ao início da execução do serviço, as condições contratuais poderão ser reanalisadas.</p>
<p>4.1. Os valores estabelecidos neste contrato poderão ser revisados em caso de variações significativas nos custos de materiais, desde que comprovados documentalmente.</p>
<p>4.2. Alterações no escopo do projeto, solicitadas pelo(a) CONTRATANTE, que impactem os custos previamente acordados, deverão ser formalizadas por meio de aditivo contratual.</p>

<h2>Das Obrigações da Contratada</h2>
<p>5. A CONTRATADA se compromete a fornecer os equipamentos e executar a instalação dos itens contidos na Cláusula 1 deste contrato, observando as normas técnicas aplicáveis e garantindo a segurança de todos os envolvidos.</p>
<p>5.1. A CONTRATADA se compromete a utilizar equipamentos adequados e pessoal qualificado, assumindo plena e exclusiva responsabilidade por sua contratação, eximindo o(a) CONTRATANTE de qualquer responsabilidade.</p>
<p>5.2. A CONTRATADA declara e garante dispor de toda experiência e competências técnicas necessárias, executando as obras dentro das normas NR-10 (Segurança em Instalações e Serviços em Eletricidade) e NR-35 (Trabalho em Altura).</p>
<p>5.5. A CONTRATADA realizará uma vistoria técnica no local de instalação antes da execução dos serviços. Em caso de aprovação com ressalvas ou reprovação, o CONTRATANTE deverá corrigir as pendências identificadas.</p>

<h2>Das Obrigações da Contratante</h2>
<p>6. Deverá a CONTRATANTE cumprir com os pagamentos à CONTRATADA, na forma descrita no item 3.</p>
<p>6.1. Compromete-se a CONTRATANTE a liberar a entrada dos profissionais para a execução dos serviços de instalação nas dependências do imóvel.</p>
<p>6.4. As obras deverão ser realizadas no prazo máximo de 90 (noventa) dias, período em que os prazos do item 7 estarão suspensos.</p>
<p>6.6. Deverá o CONTRATANTE receber e armazenar os equipamentos entregues pela FABRICANTE de forma segura durante a etapa de instalação, respondendo por eventuais perdas e danos.</p>
<p>6.7. O(A) CONTRATANTE declara e garante haver a plena disponibilidade jurídica do local e se dispõe a manter pela inteira duração do presente contrato a disponibilidade do local.</p>

<h2>Dos Prazos</h2>
<p>7. O cumprimento deste contrato iniciará quando verificado o pagamento do valor descrito no item 3, na forma pactuada, além da entrega de toda a documentação pela CONTRATANTE. As várias fases relativas à realização das obras deverão ser completadas no prazo máximo de <strong>90 (noventa) dias</strong>.</p>
<p>7.1. O prazo passará a contar a partir do cumprimento de duas condições, cumulativas: realização do pagamento e entrega dos documentos solicitados para homologação e desenvolvimento do projeto.</p>
<p>7.2. Caso o inversor adquirido seja de potência 30kW ou superior, automaticamente o prazo de entrega da obra passará a ser de <strong>180 (cento e oitenta) dias</strong>.</p>
<p>7.3. Caso a CONTRATADA não cumpra com o prazo previsto no item 7, compromete-se a arcar com o pagamento das parcelas do financiamento bancário contratado pela CONTRATANTE, ou, não sendo o caso, a realizar o reembolso referente ao valor pago das faturas de energia de forma proporcional aos dias que excederem o estabelecido.</p>

<h2>Das Variações de Projeto</h2>
<p>8.1. As Partes contratantes concordam que as variações relativas à majorações de obras ordenadas pelo(a) CONTRATANTE, serão realizadas, após averiguação de possibilidade de realização da parte CONTRATADA, no tempo que ela determinar.</p>
<p>8.2. A CONTRATADA terá direito à compensação, relativa à variação prevista no item 8.1, que será correspondida ao final da realização dela, após apresentação da Nota Fiscal.</p>

<h2>Da Rescisão do Contrato</h2>
<p>9. O presente contrato poderá ser rescindido no caso de inadimplemento de quaisquer obrigações ora estabelecidas pelas partes contratadas, desde que a parte inadimplente não sane a pendência em 30 (trinta) dias, contados do recebimento da notificação por escrito da outra parte. A parte infratora ficará obrigada a pagar a multa equivalente a <strong>20% (vinte por cento)</strong> do valor total do contrato à outra parte.</p>
<p>9.2. Eventual rescisão unilateral pelo(a) CONTRATANTE deverá ser feita mediante aviso prévio de no mínimo 15 (quinze) dias, arcando com o pagamento de multa de <strong>20%</strong> do valor do contrato.</p>
<p>9.3. Caso a instalação já tenha sido iniciada ou concluída, a multa mencionada anteriormente será majorada para <strong>35%</strong> do valor total do projeto.</p>
<p>9.7/9.8. Nos casos em que a execução dos serviços for viabilizada por meio de financiamento, uma vez que o contrato de financiamento seja formalizado e assinado, a solicitação de rescisão sujeitará o CONTRATANTE ao pagamento de multa de <strong>55%</strong> sobre o valor total do serviço financiado.</p>
<div class="cdc-box">⚠️ DESTAQUE LEGAL (ART. 54, § 4º, CDC): O CONTRATANTE DECLARA TER TOTAL E INEQUÍVOCA CIÊNCIA DE QUE A RESCISÃO DO CONTRATO APÓS A ASSINATURA DO FINANCIAMENTO IMPLICARÁ EM MULTA DE 55% SOBRE O VALOR TOTAL FINANCIADO, A QUAL SERÁ REPASSADA À INSTITUIÇÃO FINANCEIRA.</div>

<h2>Das Garantias</h2>
<p>10. A CONTRATADA garante ao(à) CONTRATANTE que os equipamentos a serem fornecidos atendem ao descrito nas especificações técnicas quando operados dentro dos limites técnicos para os quais foram projetados.</p>
<p><strong>10.1. Prazos de garantia contados a partir do término da instalação:</strong></p>
<p class="pi">a. Prazo de garantia para problemas com o inversor: <strong>12 meses</strong>.</p>
<p class="pi">b. Prazo de garantia para limpeza dos painéis, reaperto das conexões e verificação de condições de telhado: <strong>03 meses</strong>.</p>
<p>10.2. Passado o prazo referido na cláusula 10.1, fica estabelecido como garantia os prazos oferecidos pelas FABRICANTES: <strong>25 (vinte e cinco) anos</strong> de garantia de performance e <strong>10 (dez) anos</strong> contra defeitos de fabricação para os módulos e <strong>10 (dez) anos</strong> para os inversores e estrutura.</p>
<p>10.5. A presente garantia não cobre defeitos ou falhas decorrentes do desgaste natural dos materiais, erros operacionais, manuseio inadequado, ou danos causados por erosão, corrosão, intempéries, fatores climáticos etc.</p>

<h2>Disposições Finais</h2>
<p>11.1. A CONTRATADA executará seus projetos de acordo com padrões e normas técnicas aplicáveis.</p>
<p>11.3. (X) Autorizo o uso de minha imagem constante na filmagem da entrega do projeto solar Sucesso do Cliente, sem qualquer ônus para a empresa e em caráter definitivo.</p>
<p>11.4. Este documento poderá ser assinado eletronicamente mediante utilização de processo de certificação disponibilizado pela Infraestrutura de Chaves Pública Brasileira — ICP-Brasil, ou de qualquer outro meio de comprovação da autoria e integridade de documentos em forma eletrônica (Docusign, Adobesign etc.).</p>
<p>11.5. Fica estabelecido o foro da cidade de <strong>Belém/PA</strong>, para dirimir quaisquer dúvidas oriundas do presente instrumento.</p>

    <div class="modal-header"><h2>Logística — ${esc(item.nome||'')}</h2><button class="modal-close">×</button></div>
    <form id="logForm">
      <div class="modal-body">
        <div class="form-grid">
          ${formField({label:'Cliente',name:'_nome',value:item.nome,readonly:true})}
          ${formField({label:'kWp',name:'_kwp',value:item.kwp,readonly:true})}
          ${formField({label:'Vendedor',name:'_vendedor',value:item.vendedor,readonly:true})}
          ${formField({label:'Valor (R$)',name:'valor',type:'number',value:item.valor})}
          ${formField({label:'Valor da Nota (R$)',name:'valor_nota',type:'number',value:item.valor_nota})}
          ${formField({label:'Valor da Compra (R$)',name:'valor_compra',type:'number',value:item.valor_compra})}
          ${formField({label:'Valor de Repasse (R$)',name:'valor_repasse',type:'number',value:item.valor_repasse,readonly:true})}
          ${formField({label:'Distribuidora',name:'distribuidora',value:item.distribuidora,datalist:DL_DISTRIBUIDORA})}
          ${formField({label:'Nº Pedido',name:'num_pedido',value:item.num_pedido})}
          ${formField({label:'Nº NF',name:'num_nf',value:item.num_nf})}
          ${formField({label:'Data Prevista Entrega',name:'data_prevista_entrega',type:'date',value:item.data_prevista_entrega})}
          ${formField({label:'Status',name:'status',type:'select',value:item.status||'aguardando',options:statusOpts})}
          ${formField({label:'Observações',name:'obs',type:'textarea',value:item.obs,full:true})}
        </div>
        <div style="margin-top:10px;padding:10px;background:#fffbeb;border-radius:8px;font-size:12px;color:#856404">
          💡 Ao marcar como <strong>Comprado</strong> e salvar, o card será automaticamente movido para <strong>Instalação</strong>.
        </div>
        ${renderLinkedDocBtns(linked)}
        ${histSection()}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="delLogBtn">Excluir</button>
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  `);
  const form = $('#logForm');
  attachLinkedDocListeners(linked);
  carregarHistorico($('#histList'), 'logistica', item.id);

  // Auto-cálculo: valor_repasse = valor_nota − valor_compra (mínimo 0)
  const recalcRepasse = ()=>{
    const nota    = parseBR(form.elements['valor_nota'].value)  || 0;
    const compra  = parseBR(form.elements['valor_compra'].value)|| 0;
    form.elements['valor_repasse'].value = fmtInputNum(Math.max(0, nota - compra));
  };
  form.elements['valor_nota'].addEventListener('input', recalcRepasse);
  form.elements['valor_compra'].addEventListener('input', recalcRepasse);
  const statusLogMap = {aguardando:'Aguardando', comprado:'Comprado', enviado:'Enviado', entregue:'Entregue'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    Object.keys(data).filter(k=>k.startsWith('_')).forEach(k=>delete data[k]);
    // Garante que valores sejam número
    ['valor','valor_nota','valor_compra','valor_repasse'].forEach(k=>{ if(data[k]!=null) data[k]=Number(data[k])||null; });
    const { error } = await supa.from('logistica').update(data).eq('id',item.id);
    if(error) return toast('Erro ao salvar: '+error.message,'error');
    const mud = detectMudancas(item, data, [
      ['status','Status', v=>statusLogMap[v]||v],
      ['distribuidora','Distribuidora',null], ['num_pedido','Nº Pedido',null],
    ]);
    const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
    await registrarHistorico('logistica', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');

    // Sincroniza repasse com Financeiro > Receitas
    await sincronizarReceitaRepasse(item.id, data);

    // Auto-avanço para Instalação quando marcado como comprado
    if(data.status === 'comprado'){
      const { data: instExist } = await supa.from('instalacoes').select('id').eq('logistica_id', item.id).maybeSingle();
      if(!instExist){
        const logAtual = {...item, ...data};
        const instPayload = buildTransitionPayload(logAtual, 'logistica', 'instalacao');
        instPayload.criado_por = State.user?.id;
        const { error: instErr } = await supa.from('instalacoes').insert(instPayload);
        if(instErr) toast('Logística salva. Erro ao criar instalação: '+instErr.message,'error');
        else toast('Comprado ✓ → Instalação criada automaticamente!','success');
        await loadAll(); closeModal(); renderPipeline();
        return;
      }
    }
    // Sincroniza despesa de Kit com Financeiro
    if(data.valor_compra && item.contrato_id){
      const { data: kitExist } = await supa.from('financeiro_despesas')
        .select('id').eq('contrato_id', item.contrato_id).eq('categoria','kit').maybeSingle();
      const kitPayload = {
        descricao: 'Kit Solar',
        valor: Number(data.valor_compra),
        recebedor: data.distribuidora || item.distribuidora || '',
        categoria: 'kit',
        status: 'pendente',
        contrato_id: item.contrato_id,
      };
      if(kitExist){
        await supa.from('financeiro_despesas').update(kitPayload).eq('id', kitExist.id);
      } else {
        kitPayload.criado_por = State.user?.id;
        await supa.from('financeiro_despesas').insert(kitPayload);
      }
    }

    toast('Salvo','success'); await loadAll(); closeModal(); renderPipeline();
  });
  $('#delLogBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir?')) return;
    await supa.from('logistica').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });
}

          ${formField({label:'kWp',name:'_kwp',value:item.kwp,readonly:true})}
          ${formField({label:'Vendedor',name:'_vendedor',value:item.vendedor,readonly:true})}
          ${formField({label:'Técnico',name:'tecnico',value:item.tecnico,required:true,datalist:DL_TECNICO})}

          <div class="section-body"><div class="form-grid">

            ${formField({label:'Valor Poste',name:'val_poste',type:'number',value:item.val_poste})}
            ${formField({label:'Tem Troca Padrão',name:'tem_troca_padrao',type:'toggle',value:item.tem_troca_padrao})}

          return `<div class="section" style="margin-top:14px"><div class="section-header"><h4>📄 Documentos Técnicos</h4><span class="section-toggle">▼</span></div><div class="section-body"><div style="display:flex;flex-direction:column;gap:8px">${itens}</div></div></div>`;

  carregarHistorico($('#histList'), 'instalacoes', item.id);
  const filesStore = { geral: (fotos.geral||[]).slice() };
  attachFileUploads(form, filesStore);

  // ── Auto-save: persiste o rascunho no localStorage ───────
  const _draftKeyInst = `instalacao_rascunho_${item.id||'nova'}`;
  const _saveDraftInst = ()=>{
    try{
      localStorage.setItem(_draftKeyInst, JSON.stringify({
        ts: Date.now(),
        fields: readForm(form),
        files: JSON.parse(JSON.stringify(filesStore))
      }));
      const ind = document.getElementById('autosaveIndInst');
      if(ind){ const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); ind.textContent=`💾 salvo às ${t}`; }
    }catch(e){}
  };
  let _draftTimerInst = null;
  form.addEventListener('input',  ()=>{ clearTimeout(_draftTimerInst); _draftTimerInst=setTimeout(_saveDraftInst,1500); });
  form.addEventListener('change', ()=>{ clearTimeout(_draftTimerInst); _draftTimerInst=setTimeout(_saveDraftInst,1500); });

  // Verificar se existe rascunho e oferecer restauração
  try{
    const saved = localStorage.getItem(_draftKeyInst);
    if(saved){
      const draft = JSON.parse(saved);
      const mins = Math.round((Date.now()-draft.ts)/60000);
      if(mins < 1440){
        const banner = document.getElementById('draftBannerInst');
        if(banner){
          banner.style.display='flex';
          banner.querySelector('span').innerHTML=`💾 <strong>Rascunho encontrado</strong> — salvo há ${mins<1?'menos de 1':mins} min. Deseja restaurar o que foi preenchido?`;
          document.getElementById('draftRestoreBtnInst')?.addEventListener('click',()=>{
            Object.entries(draft.fields||{}).forEach(([k,v])=>{
              const el = form.elements[k];
              if(!el) return;
              if(el.type==='checkbox') el.checked=!!v;
              else el.value=v;
            });
            Object.entries(draft.files||{}).forEach(([k,arr])=>{
              filesStore[k]=arr;
              const wrap=form.querySelector(`[data-thumbs="${k}"]`);
              if(wrap) wrap.innerHTML=arr.map((f,i)=>thumbHtml(f,k,i)).join('');
            });
            banner.style.display='none';
            toast('Rascunho restaurado!','success');
            _saveDraftInst();
          });
          document.getElementById('draftDiscardBtnInst')?.addEventListener('click',()=>{
            localStorage.removeItem(_draftKeyInst);
            banner.style.display='none';
          });
        }
      }
    }
  }catch(e){}
  // ─────────────────────────────────────────────────────────

  const statusInstMap = {aguardando_agendamento:'Aguardando Agendamento', agendada:'Agendada', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    ['val_poste','val_troca_padrao','estimado','pago'].forEach(k=>{ data[k] = data[k]!=null ? Number(data[k]) : null; });
    Object.keys(data).filter(k=>k.startsWith('_')).forEach(k=>delete data[k]);
    data.fotos = filesStore;
    const { error } = await supa.from('instalacoes').update(data).eq('id',item.id);
    if(error) return toast('Erro ao salvar: '+error.message,'error');
    const mud = detectMudancas(item, data, [
      ['status','Status', v=>statusInstMap[v]||v],
      ['tecnico','Técnico',null], ['data_instalacao','Data Instalação',null],
    ]);
    const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
    await registrarHistorico('instalacoes', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');
    localStorage.removeItem(_draftKeyInst);
    toast('Salvo','success'); await loadAll(); closeModal(); renderPipeline();
  });
  $('#delInstBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir?')) return;
    await supa.from('instalacoes').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });
}

function openHomologacaoModal(item=null){

  // ── Etapa tracker ──
  const etapaSeq = ['aguardando_docs','projeto','trt_art_pg','parecer_acesso','aumento_de_carga','vistoria_final','aprovada'];
  const etapaInfo = {
    aguardando_docs:  {icon:'📋', label:'Aguardando Documentos'},
    projeto:          {icon:'📐', label:'Projeto'},
    trt_art_pg:       {icon:'💰', label:'TRT/ART Pago'},
    parecer_acesso:   {icon:'✅', label:'Parecer de Acesso'},
    aumento_de_carga: {icon:'🔌', label:'Aumento de Carga'},
    vistoria_final:   {icon:'🔍', label:'Vistoria Final'},
    aprovada:         {icon:'⚡', label:'Aprovada'},
  };
  function buildEtapaTrackerHTML(etapa){
    const isReprovada = etapa === 'reprovada';
    const idx = etapaSeq.indexOf(etapa);
    let html = '';
    etapaSeq.forEach((key, i)=>{
      const isDone    = !isReprovada && idx > i;
      const isCurrent = !isReprovada && idx === i;
      const info = etapaInfo[key];
      let bg, border, textColor, badgeStyle, badgeText;
      if(isDone){
        bg='#d1e7dd'; border='#a3cfbb'; textColor='#0f5132';
        badgeStyle='background:#0f5132;color:#fff'; badgeText='✓ Concluído';
      } else if(isCurrent){
        bg='#e3f0ff'; border='var(--primary)'; textColor='var(--primary)';
        badgeStyle='background:var(--primary);color:#fff'; badgeText='👈 Etapa atual';
      } else {
        bg='#f8f9fa'; border='#dee2e6'; textColor='#adb5bd';
        badgeStyle='background:#dee2e6;color:#6c757d'; badgeText='Pendente';
      }
      html += `<div class="hom-etapa-row" data-etapa="${key}" style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:${bg};border:1.5px solid ${border};border-radius:8px;margin-bottom:6px;cursor:pointer;transition:filter .15s" title="Clique para selecionar esta etapa">

          <div style="font-size:12px;font-weight:700;color:${textColor}">${i+1}. ${info.label}</div>
        </div>
        <span style="${badgeStyle};border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap">${badgeText}</span>
      </div>`;
    });
    // Reprovada — row especial (fora da sequência)
    const repBg     = isReprovada ? 'background:#f8d7da;border:1.5px solid #842029' : 'background:#fff5f5;border:1.5px dashed #e57373';
    const repTxt    = isReprovada ? 'color:#842029;font-weight:700' : 'color:#e57373';

      <div style="flex:1;min-width:0"><div style="font-size:12px;${repTxt}">Reprovada</div></div>
      ${repBadge}
    </div>`;
    return html;
  }

  // ── Equipamentos (herda do contrato / vistoria) ──
  const _c = linked.contrato || {};
  const _v = linked.vistoria  || {};
  const kwp      = item.kwp           || _c.kwp           || _v.kwp           || '';
  const qtdMod   = item.qtd_modulos   || _c.qtd_modulos   || '';
  const marcaMod  = item.marca_modulo  || _c.marca_modulo   || '';
  const potMod   = item.pot_modulo    || _c.pot_modulo    || '';
  const qtdInv   = item.qtd_inversores|| _c.qtd_inversores|| '';
  const marcaInv  = item.marca_inversor|| _c.marca_inversor || '';
  const potInv   = item.pot_inversor  || _c.pot_inversor  || '';

  // ── Google Maps ──
  const gmap = _c.gmap || _v.gmap || '';

  openModal(`
    <div class="modal-header"><h2>⚡ Homologação — ${esc(item.nome||'')}</h2><button class="modal-close">×</button></div>
    <form id="homForm">
      <div class="modal-body">

        ${gmap ? `<a href="${esc(gmap)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:#e8f5e9;border:2px solid #4caf50;border-radius:10px;text-decoration:none;color:#1b5e20;font-weight:700;font-size:14px;margin-bottom:14px">
          <span style="font-size:22px">📍</span>
          <span style="flex:1">Ver localização no Google Maps</span>
          <span style="font-size:12px;color:#388e3c;opacity:.8">↗ Abrir</span>
        </a>` : ''}

        <!-- Equipamentos do sistema -->
        <div style="background:#fff8e1;border:1.5px solid #ffc107;border-radius:10px;padding:12px 16px;margin-bottom:14px">
          <div style="font-size:11px;font-weight:700;color:#795548;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">⚙️ Equipamentos do Sistema</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div style="background:#fff;border-radius:7px;padding:10px 12px;border:1px solid #ffe082">
              <div style="font-size:10px;font-weight:700;color:#f57f17;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">☀️ Módulos</div>

  });

  // ── Etapa tracker — interação ──

  const etapaSelectEl = document.getElementById('homEtapaSelect');

  function refreshTracker(){
    trackerEl.innerHTML = buildEtapaTrackerHTML(activeEtapa);
    trackerEl.querySelectorAll('.hom-etapa-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        activeEtapa = row.dataset.etapa;
        if(etapaSelectEl) etapaSelectEl.value = activeEtapa;
        refreshTracker();
      });
    });
  }
  refreshTracker();

  // ── Mesmo cliente: replica dados do contrato nos campos do homologador ──
  const _contrato = linked.contrato || {};
  function syncHomFields(fill){
    const map = {
      hom_nome: _contrato.nome       || '',
      hom_cpf:  _contrato.cpf        || '',
      hom_rg:   _contrato.rg         || '',
      hom_nasc: _contrato.nascimento || ''
    };
    Object.entries(map).forEach(([fname, val])=>{
      const el = form[fname];
      if(!el) return;
      if(fill){
        el.value    = val;
        el.readOnly = true;
        el.style.cssText = 'background:#f0ebfc;color:#5e35b1;cursor:not-allowed;';
      } else {
        el.readOnly  = false;
        el.style.cssText = '';
      }
    });

  // Estado inicial (caso já salvo como mesmo_cliente=true)
  if(form.mesmo_cliente?.checked) syncHomFields(true);

  // ── Data Assinatura: herda do contrato vinculado se campo estiver vazio ──
  const _dtAssin = form.data_assinatura;
  if(_dtAssin && !_dtAssin.value && _contrato.data_assinatura){
    _dtAssin.value = _contrato.data_assinatura;
  }
  form.mesmo_cliente?.addEventListener('change', ()=> syncHomFields(form.mesmo_cliente.checked));

  attachLinkedDocListeners(linked);
  const docStore = {};
  docKeys.forEach(k=> docStore[k] = (docs[k]||[]).slice());
  attachFileUploads(form, docStore);
  const etapaHomMap = {aguardando_docs:'Aguardando docs', projeto:'Projeto', trt_art_pg:'TRT/ART pago',
    parecer_acesso:'Parecer de acesso', aumento_de_carga:'Aumento de carga',
    vistoria_final:'Vistoria final', aprovada:'Aprovada', reprovada:'Reprovada'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    ['trt_val','art_val','tecnico_val','estimado','pago'].forEach(k=>{ data[k] = data[k]!=null ? Number(data[k]) : null; });
    Object.keys(data).filter(k=>k.startsWith('_')).forEach(k=>delete data[k]);
    data.etapa = activeEtapa; // usa sempre o estado do tracker, não o select oculto
    data.docs = docStore;
    if(data.etapa==='aprovada' && !item.data_aprovacao) data.data_aprovacao = new Date().toISOString();
    const { error } = await supa.from('homologacoes').update(data).eq('id',item.id);
    if(error){ toast(error.message,'error'); return; }
    const mud = detectMudancas(item, data, [
      ['etapa','Etapa', v=>etapaHomMap[v]||v],
      ['tecnico','Técnico',null], ['concessionaria','Concessionária',null],
    ]);
    const acao = mud.some(m=>m.startsWith('Etapa')) ? (data.etapa==='aprovada'?'aprovado':data.etapa==='reprovada'?'reprovado':'etapa') : 'atualizado';
    await registrarHistorico('homologacoes', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');
    toast('Salvo','success'); await loadAll(); closeModal(); renderPipeline();
  });
  $('#delHomBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir?')) return;
    await supa.from('homologacoes').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });
}

/* ============================================================
   POS VENDA MODAL
   ============================================================ */
/* Cria um registro vazio (apenas dados básicos do cliente) numa das tabelas
   do funil e vincula o id de volta ao registro de posvenda. Usado para
   "destravar" clientes importados via CSV (sem histórico de funil), permitindo
   ao time preencher Proposta/Vistoria/Contrato/Logística/Instalação/Homologação
   depois, pelo modal de Pós Venda. */
const POSVENDA_LINK_CFG = {
  proposta:    { table:'propostas',   fk:'proposta_id',   open:()=>openPropostaModal,    extra:()=>({status:'em_aberto'}) },
  vistoria:    { table:'vistorias',   fk:'vistoria_id',   open:()=>openVistoriaModal,    extra:()=>({status:'realizada'}) },
  contrato:    { table:'contratos',   fk:'contrato_id',   open:()=>openContratoModal,    extra:()=>({status:'assinado'}) },
  logistica:   { table:'logistica',   fk:'logistica_id',  open:()=>openLogisticaModal,   extra:()=>({status:'entregue'}) },
  instalacao:  { table:'instalacoes', fk:'instalacao_id', open:()=>openInstalacaoModal,  extra:()=>({status:'concluida'}) },
  homologacao: { table:'homologacoes',fk:'homologacao_id',open:()=>openHomologacaoModal, extra:()=>({etapa:'aprovada'}) },
};
async function criarRegistroVinculadoPosVenda(tipo, posItem){
  const cfg = POSVENDA_LINK_CFG[tipo];
  if(!cfg) return null;

  // Evita duplicar: se já existe um registro com o mesmo nome (cliente
  // importado sem cadeia de FKs), apenas vincula em vez de criar outro.
  const nome = (posItem.nome||'').toLowerCase().trim();
  const existente = nome ? (State[cfg.table]||[]).find(x=>(x.nome||'').toLowerCase().trim()===nome) : null;
  if(existente){
    const { error: linkErr } = await supa.from('posvenda').update({ [cfg.fk]: existente.id }).eq('id', posItem.id);
    if(linkErr){ toast('Erro ao vincular registro existente: '+linkErr.message,'error'); return null; }
    toast('Registro existente encontrado e vinculado! ✓','success');
    await loadAll();
    return existente.id;
  }

  const payload = {
    nome: posItem.nome,
    telefone: posItem.telefone,
    vendedor: posItem.vendedor,
    kwp: posItem.kwp,
    criado_por: State.user?.id,
    ...cfg.extra(),
  };
  const { data, error } = await supa.from(cfg.table).insert(payload).select('id').single();
  if(error){ toast('Erro ao criar registro: '+error.message,'error'); return null; }
  const { error: linkErr } = await supa.from('posvenda').update({ [cfg.fk]: data.id }).eq('id', posItem.id);
  if(linkErr){ toast('Registro criado, mas erro ao vincular: '+linkErr.message,'error'); }
  await registrarHistorico(cfg.table, data.id, 'criado', `Registro criado a partir do Pós Venda (cliente importado): ${posItem.nome||''}`);
  await loadAll();
  return data.id;
}

function openPosVendaModal(item=null){
  item = item || {};
  const linked = getLinkedDocsByNome(item);
  const statusOpts = [['ativo','Ativo'],['inativo','Inativo'],['manutencao','Manutenção']];

  // Resolve dados vinculados
  const lead      = (State.leads||[]).find(l=>String(l.id)===String(item.lead_id||linked.contrato?.lead_id));
  const instalacao= linked.instalacao || {};
  const contrato  = linked.contrato   || {};
  const logistica = linked.logistica  || {};
  const vistoria  = (State.vistorias||[]).find(v=>String(v.id)===String(contrato.vistoria_id)) || {};
  const nomeKey = (item.nome||'').toLowerCase().trim();
  const homologacao = (State.homologacoes||[]).find(h=>String(h.id)===String(item.homologacao_id))
                    || (nomeKey ? (State.homologacoes||[]).find(h=>(h.nome||'').toLowerCase().trim()===nomeKey) : null)
                    || null;
  const instDate  = instalacao.data_instalacao;

  // Helpers de data
  const todayMs = new Date(); todayMs.setHours(0,0,0,0);
  function addD(dateStr,n){ if(!dateStr)return null; const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n); return d; }
  function diff(d){ if(!d)return null; const t=new Date(d); t.setHours(0,0,0,0); return Math.round((t-todayMs)/86400000); }
  function fmtD(d){ return d?new Date(d).toLocaleDateString('pt-BR'):'—'; }
  function diffBadge(d, done){
    const dv=diff(d);
    if(done||dv<0) return `<span class="flag countdown done">✓ Feito</span>`;
    if(dv===0)     return `<span class="flag countdown urgent">HOJE!</span>`;
    if(dv<=7)      return `<span class="flag countdown urgent">${dv}d</span>`;
    return `<span class="flag countdown">${dv}d</span>`;
  }
  function pvRow(icon,label,sub,targetDate,checkName,checked){
    const dv=diff(targetDate);
    const done=checked||(dv!==null&&dv<0);
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f6fc;border-radius:8px;border:1px solid #e2daea;margin-bottom:6px">
      <span style="font-size:20px">${icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600">${label}</div>
        <div style="font-size:11px;color:var(--text-light)">${sub}</div>
      </div>
      ${targetDate?diffBadge(targetDate,done):'<span style="font-size:11px;color:#aaa">sem data</span>'}
      ${checkName && !done?`<input type="checkbox" name="${checkName}" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0" title="Marcar como feito">`:''}
      ${checkName && done?`<input type="checkbox" name="${checkName}" checked style="display:none">`:''}
    </div>`;
  }
  function statusRow(icon,label,s){
    if(!s)return '';
    const bg=/aprovada|assinado|conclu|comprado|ativo|realiz|entregue|pago/.test(s)?'#d1e7dd':/reprova|perdido|recusad|cancel/.test(s)?'#f8d7da':'#ccfbf1';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${bg};border-radius:6px;font-size:12px;font-weight:500;margin-bottom:4px">${icon} ${label}: <strong style="margin-left:4px">${s}</strong></div>`;
  }

  // Aniversário — sempre renderiza (com ou sem data de nascimento)
  // Fallback: lead → contrato (caso nascimento só esteja preenchido no contrato)
  const nascimento = lead?.nascimento || contrato?.nascimento || null;
  let nextBday = null;
  let bdaySub  = 'Data de nascimento não registrada';
  if(nascimento){
    const bday = new Date(nascimento+'T12:00:00');
    const next = new Date(todayMs.getFullYear(), bday.getMonth(), bday.getDate());
    if(next < todayMs) next.setFullYear(todayMs.getFullYear()+1);
    nextBday = next;
    bdaySub  = `Nascimento: ${fmtD(nascimento)} → Próximo: ${next.toLocaleDateString('pt-BR')}`;
  }

  openModal(`
    <div class="modal-header"><h2>Pós Venda — ${esc(item.nome||'')}</h2><button class="modal-close">×</button></div>
    <form id="pvForm">
      <div class="modal-body">
        <div class="form-grid">
          ${formField({label:'Cliente',name:'_nome',value:item.nome,readonly:true})}
          ${formField({label:'kWp',name:'_kwp',value:item.kwp,readonly:true})}
          ${formField({label:'Vendedor',name:'_vendedor',value:item.vendedor,readonly:true})}
          ${formField({label:'Status',name:'status',type:'select',value:item.status||'ativo',options:statusOpts})}
          ${formField({label:'Data Ativação',name:'data_ativacao',type:'date',value:item.data_ativacao})}
          ${formField({label:'Observações',name:'obs',type:'textarea',value:item.obs,full:true})}
        </div>

        <!-- Histórico do funil -->
        <div class="section collapsed" style="margin-top:12px">
          <div class="section-header"><h4>📋 Histórico do Funil</h4><span class="section-toggle">▼</span></div>
          <div class="section-body" style="padding:10px 0 4px">
            ${statusRow('🔍','Vistoria',vistoria.resultado||vistoria.status)}
            ${statusRow('✍️','Contrato',contrato.status)}
            ${statusRow('📦','Logística',logistica.status)}
            ${statusRow('🔧','Instalação',instalacao.status)}
          </div>
        </div>

        <!-- Acompanhamento pós-venda -->
        <div class="section" style="margin-top:12px">
          <div class="section-header"><h4>⏰ Acompanhamento</h4><span class="section-toggle">▼</span></div>
          <div class="section-body" style="padding:10px 0 4px">
            ${pvRow('🎂','Aniversário',bdaySub,nextBday,null,false)}
            ${pvRow('🛡️','Manutenção preventiva (300 dias)',
              instDate?`Instalação: ${fmtD(instDate)} → Vence: ${fmtD(addD(instDate,300))}`:'Data de instalação não registrada',
              addD(instDate,300),null,false)}
            ${pvRow('🤝','Acolhimento (5 dias)',
              instDate?`Instalação: ${fmtD(instDate)} → Contato: ${fmtD(addD(instDate,5))}`:'Data de instalação não registrada',
              addD(instDate,5),'check_5d',!!item.check_5d)}
            ${pvRow('💛','Gratidão (30 dias)',
              instDate?`Instalação: ${fmtD(instDate)} → Contato: ${fmtD(addD(instDate,30))}`:'Data de instalação não registrada',
              addD(instDate,30),'check_30d',!!item.check_30d)}
            ${pvRow('🌟','Embaixador (90 dias)',
              instDate?`Instalação: ${fmtD(instDate)} → Contato: ${fmtD(addD(instDate,90))}`:'Data de instalação não registrada',
              addD(instDate,90),'check_90d',!!item.check_90d)}
          </div>
        </div>

        ${(()=>{
          const pendentes = [
            !linked.proposta    && {key:'proposta',    icon:'📄', label:'Proposta'},
            !linked.vistoria    && {key:'vistoria',    icon:'🔍', label:'Vistoria'},
            !linked.contrato    && {key:'contrato',    icon:'✍️', label:'Contrato'},
            !linked.logistica   && {key:'logistica',   icon:'📦', label:'Logística'},
            !linked.instalacao  && {key:'instalacao',  icon:'🔧', label:'Instalação'},
            !homologacao        && {key:'homologacao', icon:'⚡', label:'Homologação'},
          ].filter(Boolean);
          if(!pendentes.length) return '';
          return `
          <div class="section" style="margin-top:12px">
            <div class="section-header"><h4>➕ Cadastros Pendentes</h4><span class="section-toggle">▼</span></div>
            <div class="section-body" style="padding:10px 0 4px">
              <p style="font-size:12px;color:var(--text-light);margin:0 0 8px">Cliente importado da base antiga — crie os registros abaixo para completar o histórico do funil:</p>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                ${pendentes.map(p=>`<button type="button" class="btn btn-secondary btn-sm" data-create-link="${p.key}">➕ ${p.icon} Criar ${p.label}</button>`).join('')}
              </div>
            </div>
          </div>`;
        })()}
        ${renderLinkedDocBtns({...linked, homologacao})}
        ${histSection()}
      </div>
      <div class="modal-footer">
        ${canVerFinanceiro()?`<button type="button" class="btn btn-secondary" id="pvProjFinBtn">💰 Financeiro</button>`:''}
        ${isAdmin()?`<button type="button" class="btn btn-danger" id="delPvBtn">Excluir</button>`:''}
        <button type="button" class="btn btn-secondary modal-close">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  `);
  const form = $('#pvForm');
  const pvContrato = linked.contrato || {};
  $('#pvProjFinBtn')?.addEventListener('click', ()=> openProjetoFinanceiroModal(pvContrato.id, item.nome||''));
  attachLinkedDocListeners({...linked, homologacao});
  carregarHistorico($('#histList'), 'posvenda', item.id);
  $$('[data-create-link]').forEach(b=>b.addEventListener('click', async ()=>{
    const tipo = b.dataset.createLink;
    b.disabled = true; b.textContent = 'Criando...';
    const newId = await criarRegistroVinculadoPosVenda(tipo, item);
    if(!newId){ b.disabled = false; return; }
    toast('Registro criado! Preencha os dados.','success');
    const cfg = POSVENDA_LINK_CFG[tipo];
    const novoItem = (State[cfg.table]||[]).find(x=>String(x.id)===String(newId));
    closeModal();
    cfg.open()(novoItem);
  }));
  const statusPvMap = {ativo:'Ativo', inativo:'Inativo', manutencao:'Manutenção'};
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const data = readForm(form);
    Object.keys(data).filter(k=>k.startsWith('_')).forEach(k=>delete data[k]);
    const { error } = await supa.from('posvenda').update(data).eq('id',item.id);
    if(error) return toast(error.message,'error');
    const mud = detectMudancas(item, data, [
      ['status','Status', v=>statusPvMap[v]||v],
      ['data_ativacao','Data Ativação',null],
      ['check_5d','Acolhimento (5d)', v=>v?'✓ Feito':'Pendente'],
      ['check_30d','Gratidão (30d)', v=>v?'✓ Feito':'Pendente'],
      ['check_90d','Embaixador (90d)', v=>v?'✓ Feito':'Pendente'],
    ]);
    const acao = mud.some(m=>m.startsWith('Status')) ? 'status' : 'atualizado';
    await registrarHistorico('posvenda', item.id, acao, mud.length ? mud.join(' | ') : 'Dados atualizados');
    toast('Salvo','success'); await loadAll(); closeModal(); renderPipeline();
  });
  $('#delPvBtn')?.addEventListener('click', async ()=>{
    if(!await confirmDel('Excluir?')) return;
    await supa.from('posvenda').delete().eq('id',item.id);
    toast('Excluído','success'); await loadAll(); closeModal(); renderPipeline();
  });
}
